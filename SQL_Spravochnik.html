<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SQL: основы — справочник, карточки, тест</title>
<script>(function(){var d=document.documentElement,t,f;try{t=JSON.parse(localStorage.getItem("sql-theme"));f=JSON.parse(localStorage.getItem("sql-fs"))}catch(e){}d.setAttribute("data-theme",t||(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));if(f)d.setAttribute("data-fs",f)})()</script>
<style>
/* ===== Справочник: каркас в стиле QA Handbook ===== */
:root{
  --bg:#f5f6f8;--surface:#fff;--surface-2:#f0f2f6;--text:#1f2430;--text-muted:#667085;--border:#e4e7ec;
  --accent:#3b6cf6;--accent-soft:#eef3ff;--code-bg:#f3f4f7;--pre-bg:#f3f4f7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);--top:56px;--radius:14px;
  --blue:#2563eb;--green:#16a34a;--purple:#9333ea;--orange:#d97706;--teal:#0d9488;--red:#dc2626;--pink:#db2777;--gray:#64748b;
  --ok:#17894a;--ok-bg:rgba(23,137,74,.1);--bad:#c53030;--bad-bg:rgba(197,48,48,.08);--warn:#b7791f;
  --neg-bg:rgba(239,68,68,.06);--neg-border:rgba(239,68,68,.3);--qa-bg:rgba(59,108,246,.06);
  --tip-bg:#1f2430;--tip-text:#f5f6f8;--tip-muted:#b6c2d1;--abbr-line:var(--accent);--hot:rgba(245,158,11,.12);
  --hl-kw:#a626a4;--hl-str:#50a14f;--hl-num:#b76b01;--hl-com:#8a94a3;--hl-fn:#4078f2;--hl-bi:#0184bc;--hl-dec:#c18401;--hl-self:#e45649;
}
:root[data-theme="dark"]{
  --bg:#101319;--surface:#181c24;--surface-2:#202531;--text:#e8eaf0;--text-muted:#9aa3b5;--border:#272d3a;
  --accent:#7aa2ff;--accent-soft:#1c2540;--code-bg:#0e1117;--pre-bg:#0e1117;--shadow:none;
  --blue:#60a5fa;--green:#4ade80;--purple:#c084fc;--orange:#fbbf24;--teal:#2dd4bf;--red:#f87171;--pink:#f472b6;--gray:#94a3b8;
  --ok:#4cc38a;--ok-bg:rgba(76,195,138,.12);--bad:#f07178;--bad-bg:rgba(240,113,120,.12);--warn:#e3a94b;
  --neg-bg:rgba(248,113,113,.08);--neg-border:rgba(248,113,113,.35);--qa-bg:rgba(122,162,255,.08);
  --tip-bg:#e8eaf0;--tip-text:#101319;--tip-muted:#475569;--hot:rgba(251,191,36,.1);
  --hl-kw:#c678dd;--hl-str:#98c379;--hl-num:#d19a66;--hl-com:#6b7686;--hl-fn:#61afef;--hl-bi:#56b6c2;--hl-dec:#e5c07b;--hl-self:#e06c75;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:100%;scroll-padding-top:calc(var(--top) + 64px)}
html[data-fs="1"]{font-size:112%}
html[data-fs="2"]{font-size:125%}
body{margin:0;background:var(--bg);color:var(--text);font:1rem/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html.ready body{transition:background .2s,color .2s}
a{color:var(--accent)}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

/* --- верхняя панель --- */
.topbar{position:sticky;top:0;z-index:50;height:var(--top);display:flex;align-items:center;gap:10px;padding:0 max(14px,env(safe-area-inset-left));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.logo{font-weight:700;font-size:17px;white-space:nowrap;color:var(--text);text-decoration:none;min-width:0;overflow:hidden;text-overflow:ellipsis}
.search{flex:1;min-width:0;max-width:440px;margin-left:auto;position:relative}
.search input{width:100%;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);padding:0 12px 0 34px;font:inherit;font-size:15px}
.search input:focus{outline:2px solid var(--accent);background:var(--surface)}
.search::before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.6}
.ibtn{height:38px;min-width:38px;padding:0 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:15px;text-decoration:none;color:var(--text);gap:6px}
.ibtn:hover{border-color:var(--accent)}
.ibtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
#menuBtn,#searchBtn{display:none}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0}

/* --- раскладка --- */
.layout{display:grid;grid-template-columns:276px minmax(0,1fr);max-width:1200px;margin:0 auto}
.side{position:sticky;top:var(--top);align-self:start;height:calc(100vh - var(--top));overflow:auto;padding:18px 12px 30px 16px}
.side a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;color:var(--text);text-decoration:none;font-size:14.5px;line-height:1.4}
.side a:hover{background:var(--surface-2)}
.side a.cat{font-weight:600}
.side a .cnt{margin-left:auto;font-size:12px;color:var(--text-muted);font-weight:500;flex:none}
.side a.cat.active,.side a.mode.active{background:var(--accent-soft);color:var(--accent)}
.side .ci{flex:none;width:24px;text-align:center}
.side .sub{margin:2px 0 8px 22px;padding-left:10px;border-left:2px solid var(--border)}
.side .sub a{font-size:13.5px;padding:5px 8px;color:var(--text-muted);font-weight:400}
.side .sub a.active{color:var(--accent);font-weight:600}
.side .sub a.read::after{content:"✓";margin-left:auto;color:var(--ok);font-size:12px}
.side .grp{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:700;margin:18px 10px 6px}
main{padding:22px 22px 60px;min-width:0}
#view{max-width:860px;margin:0 auto}
footer{max-width:860px;margin:50px auto 0;text-align:center;color:var(--text-muted);font-size:12.5px}

/* --- главная --- */
.hero h1{font-size:30px;line-height:1.2;margin:4px 0 8px}
.hero p{color:var(--text-muted);margin:0 0 16px;max-width:62ch}
.cont{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;margin-bottom:6px;max-width:100%}
.cont span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
:root[data-theme="dark"] .cont{color:#0b1020}
.h2{font-size:20px;margin:34px 0 4px}
.h2+.lead{color:var(--text-muted);margin:0;font-size:14.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.card{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;text-decoration:none;color:var(--text);box-shadow:var(--shadow);transition:transform .12s,border-color .12s;min-width:0}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card .ico{font-size:26px;line-height:1;min-height:28px;display:flex;align-items:center}
.card h3{margin:4px 0 0;font-size:17px;line-height:1.3}
.card p{margin:0;color:var(--text-muted);font-size:14px;line-height:1.5;flex:1}
.card .meta{font-size:12.5px;color:var(--text-muted);margin-top:6px}
.card .bar{flex:none;width:100%}
.train .card{background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%)}
.bar{height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:4px;flex:1;min-width:80px}
.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}

/* --- категория --- */
.back{display:inline-block;margin-bottom:10px;color:var(--text-muted);text-decoration:none;font-size:14px}
.back:hover{color:var(--accent)}
.cathead{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.cathead .ico{font-size:34px;line-height:1;flex:none}
.cathead h1{margin:0;font-size:26px;line-height:1.2}
.cathead p{margin:2px 0 0;color:var(--text-muted);font-size:15px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.toolbar .ibtn{font-size:13.5px;height:34px}
.toolbar label{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text-muted);cursor:pointer}
.toolbar .pr{margin-left:auto;font-size:13px;color:var(--text-muted)}
.intro{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:4px 22px 12px;margin-bottom:14px}
.flat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 22px 20px}

details.topic{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;scroll-margin-top:calc(var(--top) + 8px)}
details.topic>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:56px;border-radius:var(--radius)}
details.topic>summary::-webkit-details-marker{display:none}
details.topic>summary:hover{background:var(--surface-2)}
.num{flex:none;min-width:28px;height:28px;padding:0 6px;border-radius:99px;background:var(--surface-2);color:var(--text-muted);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.ttl{flex:1;min-width:0;font-weight:600;font-size:1.04rem;line-height:1.35}
.tag{flex:none;font-size:11.5px;color:var(--text-muted);background:var(--surface-2);border-radius:99px;padding:2px 9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{flex:none;width:9px;height:9px;border-right:2px solid var(--text-muted);border-bottom:2px solid var(--text-muted);transform:rotate(-45deg);transition:transform .15s}
details.topic[open]>summary .chev{transform:rotate(45deg)}
.done{flex:none;color:var(--ok);font-weight:700;display:none}
details.topic.isread .done{display:inline}
details.topic.isread .num{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
details.topic[open]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 10px 28px rgba(30,50,110,.16);margin:18px 0 22px}
:root[data-theme="dark"] details.topic[open]{box-shadow:0 0 0 1px var(--accent),0 10px 28px rgba(0,0,0,.45)}
details.topic[open]>summary{position:sticky;top:var(--top);z-index:20;background:var(--accent-soft);border-bottom:1px solid var(--accent);border-radius:calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0;box-shadow:inset 5px 0 0 var(--accent)}
details.topic[open]>summary .num{background:var(--accent);color:#fff}
:root[data-theme="dark"] details.topic[open]>summary .num{color:#0b1020}
details.topic[open]>summary .tag{background:var(--surface);color:var(--accent)}
details.topic[open]>summary .ttl{color:var(--accent);font-weight:700}
details.topic:not([open]){opacity:.93}
details.topic:not([open]):hover{opacity:1;border-color:var(--text-muted)}
.tbody{padding:6px 22px 20px}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:24px;padding-top:16px;border-top:1px dashed var(--border)}
.foot .ibtn{height:40px;padding:0 16px;font-weight:600;font-size:14px}
.foot .mark.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.foot .next{margin-left:auto;background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .foot .next{color:#0b1020}

/* блок «Проверить себя» в конце раздела */
.selfcheck{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:26px 0 8px;padding:14px 18px;border-radius:var(--radius);border:1px dashed var(--accent);background:var(--accent-soft)}
.selfcheck b{margin-right:auto;font-size:15px}
.selfcheck .ibtn{background:var(--surface);height:38px;font-weight:600;font-size:14px}
.catnext{margin-top:18px;text-align:center}
.catnext .ibtn{height:42px;padding:0 18px;font-weight:600}

/* --- поиск --- */
.res{display:block;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:10px;text-decoration:none;color:var(--text)}
.res:hover{border-color:var(--accent)}
.res b{font-size:1.02rem}
.res .rc{display:block;font-size:12.5px;color:var(--text-muted);margin:2px 0 4px}
.res p{margin:0;font-size:.92rem;color:var(--text-muted);line-height:1.55}
mark{background:#ffe066;color:#111;border-radius:3px;padding:0 2px}
.empty{text-align:center;color:var(--text-muted);padding:40px 0}
.termhits{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.totop{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.2);display:none;font-size:18px;z-index:40}
.backdrop{display:none}
.pagehead h1{margin:0 0 4px;font-size:26px;line-height:1.2}
.pagehead p{margin:0 0 16px;color:var(--text-muted)}

/* ===== Блоки контента ===== */
.section-body{overflow-wrap:break-word}
.section-body>p,.section-body>ul,.section-body>ol{max-width:72ch}
.section-body p{margin:10px 0}
.section-body p.note{color:var(--text)}
h3.sub{display:flex;align-items:center;gap:8px;margin:26px 0 6px;font-size:1.04rem;line-height:1.35}
h3.sub::before{content:"";flex:none;width:4px;height:16px;border-radius:3px;background:var(--accent)}
h3.sub:first-child{margin-top:12px}
ol.checks,ul.checks{padding-left:22px;margin:10px 0}
ol.checks li,ul.checks li{margin:6px 0}
ol.checks li::marker,ul.checks li::marker{color:var(--text-muted)}
.neg-block{margin:16px 0;background:var(--neg-bg);border:1px solid var(--neg-border);border-left:4px solid var(--red);border-radius:12px;padding:10px 16px 12px}
.neg-block .neg-title,.qa-block .qa-title{font-weight:700;margin:2px 0 4px;font-size:.92rem}
.neg-block .neg-title{color:var(--red)}
.neg-block ol{margin:6px 0 0;padding-left:20px}
.neg-block ol li{margin:5px 0}
.neg-block pre{background:var(--surface)}
.qa-block{margin:16px 0;background:var(--qa-bg);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;padding:10px 16px 12px;font-size:.95rem}
.qa-block .qa-title{color:var(--accent)}
.qa-block .qa-title::before{content:"🧪 "}
.qa-block ul{margin:6px 0 0;padding-left:20px}
.qa-block li{margin:5px 0}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tags span{font-size:.86rem;background:var(--surface-2);border:1px solid var(--border);padding:4px 11px;border-radius:999px}
.vs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:14px 0}
.vs-card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:.93rem}
.vs-card h4{margin:0 0 6px;font-size:.98rem}
.vs-card p{margin:0 0 6px;color:var(--text-muted)}
.vs-card p:last-child{margin-bottom:0}
.badge{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.74rem;font-weight:700;padding:3px 8px;border-radius:7px;color:#fff;letter-spacing:.02em;flex-shrink:0;min-width:34px;text-align:center;display:inline-block;line-height:1.5}
:root[data-theme="dark"] .badge{color:#0b1020}
.b-blue{background:var(--blue)}.b-green{background:var(--green)}.b-purple{background:var(--purple)}
.b-orange{background:var(--orange)}.b-teal{background:var(--teal)}.b-red{background:var(--red)}
.b-pink{background:var(--pink)}.b-gray{background:var(--gray)}
.card .ico .badge,.cathead .ico .badge{font-size:14px;padding:5px 10px}
.side .ci .badge{font-size:9.5px;padding:1px 3px;min-width:22px;border-radius:5px}

code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
code{font-size:.87em;background:var(--code-bg);padding:.12em .42em;border-radius:6px;overflow-wrap:anywhere;border:1px solid var(--border)}
pre{position:relative;font-size:.85rem;line-height:1.55;background:var(--pre-bg);border:1px solid var(--border);border-radius:12px;padding:14px 16px;overflow-x:auto;margin:14px 0;tab-size:4;-webkit-overflow-scrolling:touch}
pre code{background:none;padding:0;border:0;overflow-wrap:normal}
.copy-btn{position:absolute;top:8px;right:8px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:12px;padding:3px 9px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;opacity:0;transition:opacity .15s}
pre:hover .copy-btn,.copy-btn:focus{opacity:1}
.hl-kw{color:var(--hl-kw);font-weight:600}.hl-str{color:var(--hl-str)}.hl-num{color:var(--hl-num)}
.hl-com{color:var(--hl-com);font-style:italic}.hl-fn{color:var(--hl-fn)}.hl-bi{color:var(--hl-bi)}
.hl-dec{color:var(--hl-dec)}.hl-self{color:var(--hl-self)}

.table-scroll{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;margin:14px 0;border:1px solid var(--border);border-radius:12px;-webkit-overflow-scrolling:touch}
.tbl{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.5}
.tbl th,.tbl td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
.tbl th{background:var(--surface-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);font-weight:600}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.tbl tr.hot td{background:var(--hot)}
.tbl tr.hot td:first-child::after{content:" ★";color:var(--orange);font-size:.8em}
.tbl pre{margin:6px 0;font-size:.8rem;padding:8px 10px}
.yes{color:var(--ok);font-weight:600}.no{color:var(--bad);font-weight:600}.mid{color:var(--orange);font-weight:600}
.legend-hot{font-size:.82rem;color:var(--text-muted);margin:-6px 0 10px}

/* --- подсказки --- */
abbr.t{text-decoration:none;border-bottom:1.5px dotted var(--abbr-line);cursor:help;outline:none}
abbr.t:hover,abbr.t:focus{background:var(--accent-soft);border-radius:3px}
abbr.t.flash{animation:flash 1.6s ease 2}
@keyframes flash{50%{background:#ffe066;color:#111}}
code abbr.t{border-bottom:0}
code:has(abbr.t){border-bottom:1.5px dotted var(--abbr-line)}
#tip{position:fixed;left:0;top:0;z-index:200;max-width:340px;background:var(--tip-bg);color:var(--tip-text);padding:10px 13px;border-radius:11px;font-size:13.5px;line-height:1.5;box-shadow:0 10px 28px rgba(0,0,0,.35);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.show{opacity:1;transform:none}
#tip .tip-term{font-weight:700;font-size:14.5px}
#tip .tip-full{font-weight:600;margin-bottom:4px}
#tip .tip-why{opacity:.9}
#tip pre{background:rgba(127,127,127,.18);border:0;color:inherit;margin:6px 0 0;padding:7px 9px;font-size:.78rem}

/* ===== Тренировка: общие элементы ===== */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;padding:6px 12px;border-radius:999px;font-size:.86rem;font-weight:500;line-height:1.4}
.chip:hover{border-color:var(--accent)}
.chip .n{color:var(--text-muted);font-size:.8em;margin-left:5px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on .n{color:rgba(255,255,255,.85)}
:root[data-theme="dark"] .chip.on{color:#0b1020}
:root[data-theme="dark"] .chip.on .n{color:rgba(11,16,32,.75)}
.setup .row{margin-bottom:18px}
.setup .row>h3{margin:0 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted)}
.setup .num-in{width:76px;height:32px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:0 12px;font:inherit;font-size:.86rem}
.setup .num-in:focus{outline:2px solid var(--accent)}
.setup .summary{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding-top:14px;border-top:1px dashed var(--border)}
.setup .summary .info{color:var(--text-muted);font-size:.9rem}

<template id="src">
  <!-- ==================== ЧТО ТАКОЕ SQL ==================== -->
  <details class="section" id="s-about" data-icon="🗄" data-desc="Таблицы, строки, ключи, СУБД и учебная база для всех примеров." data-train="SELECT">
    <summary><span class="badge b-blue">🗄</span> Что такое SQL и база данных <span class="chev">▶</span></summary>
    <div class="section-body">
      <p class="note">SQL (Structured Query Language) — язык запросов к реляционным базам данных. Вы не пишете, <i>как</i> искать данные (циклы, переборы), а описываете, <i>что</i> нужно получить: «дай имена пользователей из Москвы, отсортированные по возрасту». Как именно это найти, решает СУБД — это декларативный подход.</p>
      <div class="vs-grid">
        <div class="vs-card"><h4>Таблица</h4><p>Похожа на лист Excel: столбцы (поля) имеют имя и тип, строки (записи) — это отдельные объекты. Таблица <code>users</code> — пользователи, одна строка = один пользователь.</p></div>
        <div class="vs-card"><h4>Реляционная модель</h4><p>Данные разложены по нескольким таблицам, которые связаны ключами. Заказ не хранит имя клиента — только его <code>user_id</code>. Связь «по ключу» и есть отношение (relation).</p></div>
        <div class="vs-card"><h4>СУБД</h4><p>Программа, которая хранит данные и выполняет запросы: PostgreSQL, MySQL, MS SQL Server, Oracle, SQLite. SQL у всех почти одинаковый, но есть диалекты — различия в функциях и деталях.</p></div>
        <div class="vs-card"><h4>Порядок строк не гарантирован</h4><p>Таблица — это множество строк, а не список. Без <code>ORDER BY</code> база вправе вернуть строки в любом порядке, и порядок может поменяться между запусками.</p></div>
      </div>

      <h3 class="sub">Группы команд SQL</h3>
      <div class="table-scroll"><table class="tbl">
        <thead><tr><th>Группа</th><th>Расшифровка</th><th>Команды</th><th>Для чего</th></tr></thead>
        <tbody>
          <tr class="hot"><td><b>DQL</b></td><td>Data Query Language</td><td><code>SELECT</code></td><td>Чтение данных — 90% работы QA</td></tr>
          <tr class="hot"><td><b>DML</b></td><td>Data Manipulation Language</td><td><code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code></td><td>Изменение строк</td></tr>
          <tr><td><b>DDL</b></td><td>Data Definition Language</td><td><code>CREATE</code>, <code>ALTER</code>, <code>DROP</code>, <code>TRUNCATE</code></td><td>Структура: таблицы, индексы</td></tr>
          <tr><td><b>DCL</b></td><td>Data Control Language</td><td><code>GRANT</code>, <code>REVOKE</code></td><td>Права доступа</td></tr>
          <tr><td><b>TCL</b></td><td>Transaction Control Language</td><td><code>BEGIN</code>, <code>COMMIT</code>, <code>ROLLBACK</code></td><td>Транзакции</td></tr>
        </tbody>
      </table></div>
      <p class="legend-hot">★ — то, что QA-инженер пишет каждый день</p>

      <h3 class="sub">Учебная база этого справочника</h3>
      <p class="note">Все примеры ниже выполняются на двух таблицах: пользователи и их заказы. У Веры и Дины заказов нет, у Веры не указан возраст, у Дины — город. Эти «дырки» специально: на них видны ловушки с <code>NULL</code> и <code>JOIN</code>.</p>
<pre class="code" data-lang="sql">-- users                              orders
-- id | name  | city   | age          id | user_id | amount | status    | created_at
-- 1  | Анна  | Москва | 28           1  | 1       | 500    | paid      | 2026-01-10
-- 2  | Борис | СПб    | 35           2  | 1       | 1500   | paid      | 2026-02-03
-- 3  | Вера  | Москва | NULL         3  | 2       | 700    | new       | 2026-02-15
-- 4  | Глеб  | Казань | 42           4  | 4       | 300    | cancelled | 2026-03-01
-- 5  | Дина  | NULL   | 19           5  | 4       | 1200   | paid      | 2026-03-20
--                                    6  | 2       | 200    | paid      | 2026-03-25</pre>
<pre class="sh">sqlite3 shop.db &lt; seed.sql     # создать базу из файла demo/seed.sql рядом со справочником
sqlite3 shop.db                 # открыть консоль; .tables — список таблиц, .quit — выход
psql -h host -U user -d shop    # подключиться к PostgreSQL
mysql -h host -u user -p shop   # подключиться к MySQL</pre>

      <h3 class="sub">Синтаксис в двух словах</h3>
      <ul class="checks">
        <li>Ключевые слова не зависят от регистра: <code>select</code> = <code>SELECT</code>. Принято писать их заглавными, чтобы отличать от имён.</li>
        <li>Строки — в <b>одинарных</b> кавычках: <code>'Москва'</code>. Двойные кавычки — для имён столбцов и таблиц: <code>"order"</code> (в MySQL — обратные <code>`order`</code>).</li>
        <li>Запрос заканчивается точкой с запятой <code>;</code>. Переносы строк и пробелы не важны.</li>
        <li>Комментарии: <code>-- до конца строки</code> и <code>/* многострочный */</code>.</li>
      </ul>

      <div class="qa-block"><p class="qa-title">Для QA</p><ul>
        <li>SQL нужен, чтобы проверить, что действие в интерфейсе или запрос к API реально записали в базу то, что ожидалось.</li>
        <li>Подготовка тестовых данных: создать пользователя с нужным статусом быстрее одним <code>INSERT</code>, чем через пять экранов.</li>
        <li>Поиск багов в данных: дубли, «сироты» без родительской записи, пустые обязательные поля — см. раздел «SQL для QA».</li>
        <li>На проде и общем стенде обычно доступ только на чтение. Любой <code>UPDATE</code>/<code>DELETE</code> — только на своём стенде и только с <code>WHERE</code>.</li>
      </ul></div>
    </div>
  </details>

  <!-- ==================== SELECT ==================== -->
  <details class="section" id="s-select" data-icon="🔎" data-desc="Выбор столбцов, псевдонимы, DISTINCT, сортировка, LIMIT и порядок выполнения." data-train="SELECT">
    <summary><span class="badge b-green">SEL</span> SELECT: выборка и сортировка <span class="chev">▶</span></summary>
    <div class="section-body">
      <p class="note"><code>SELECT</code> — главная команда: прочитать данные. Минимальный запрос — «какие столбцы» + «из какой таблицы». Результат запроса — тоже таблица, только временная.</p>

      <details class="section"><summary><span class="badge b-green">1</span> Столбцы и псевдонимы <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">SELECT * FROM users;                        -- все столбцы, все строки
SELECT name, city FROM users;               -- только нужные столбцы
SELECT name AS "Имя", age + 1 AS next_age   -- псевдоним (alias) и вычисление
FROM users;                                 -- Анна | 29, ..., Вера | NULL
SELECT 2 + 2;                               -- 4 (в PostgreSQL/MySQL/SQLite FROM не обязателен)</pre>
        <p class="note">Псевдоним <code>AS</code> переименовывает столбец в результате (слово <code>AS</code> можно опустить). Таблицам тоже дают короткие псевдонимы: <code>FROM users u</code> — дальше пишем <code>u.name</code>.</p>
        <div class="neg-block"><p class="neg-title">✕ Частые ошибки</p><ol>
          <li><code>SELECT *</code> в автотестах и коде: добавят столбец — сломается порядок и маппинг. Перечисляйте столбцы явно.</li>
          <li><code>NULL + 1</code> даёт <code>NULL</code>, а не 1: у Веры <code>next_age</code> пустой.</li>
        </ol></div>
      </div></details>

      <details class="section"><summary><span class="badge b-green">2</span> DISTINCT — без повторов <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">SELECT DISTINCT city FROM users;            -- Москва, СПб, Казань, NULL (4 строки)
SELECT DISTINCT user_id, status FROM orders; -- уникальны ПАРЫ значений, а не каждый столбец</pre>
        <p class="note"><code>DISTINCT</code> применяется ко всей строке результата целиком. <code>NULL</code> считается одним значением и попадает в результат один раз.</p>
      </div></details>

      <details class="section"><summary><span class="badge b-green">3</span> ORDER BY — сортировка <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">SELECT name, age FROM users ORDER BY age;          -- по возрастанию (ASC по умолчанию)
SELECT name, age FROM users ORDER BY age DESC;     -- по убыванию
SELECT name, city, age FROM users
ORDER BY city, age DESC;                           -- сначала по городу, внутри — по возрасту
SELECT name, age FROM users ORDER BY 2;            -- по номеру столбца (2-й = age), лучше не злоупотреблять
SELECT name, age FROM users ORDER BY age NULLS LAST; -- PostgreSQL/SQLite: куда ставить NULL</pre>
        <p class="note">Где окажутся <code>NULL</code> при сортировке, зависит от СУБД: в PostgreSQL и Oracle <code>NULL</code> «больше всех» (в конце при ASC), в MySQL, SQLite и SQL Server — «меньше всех» (в начале).</p>
      </div></details>

      <details class="section"><summary><span class="badge b-green">4</span> LIMIT / OFFSET — первые N строк <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">SELECT name, age FROM users ORDER BY age DESC LIMIT 2;            -- Глеб 42, Борис 35
SELECT * FROM orders ORDER BY id LIMIT 2 OFFSET 2;                -- пропустить 2, взять 2: id 3, 4
SELECT TOP 2 * FROM users;                                        -- SQL Server
SELECT * FROM users ORDER BY id FETCH FIRST 2 ROWS ONLY;          -- стандарт SQL, PostgreSQL, Oracle 12+</pre>
        <div class="qa-block"><p class="qa-title">Для QA</p><ul>
          <li>Пагинация в API почти всегда — <code>LIMIT/OFFSET</code>. Проверяйте: последнюю страницу, страницу за пределами, одинаковые значения сортировки (без уникального поля в <code>ORDER BY</code> строки могут «прыгать» между страницами и дублироваться).</li>
          <li><code>LIMIT</code> без <code>ORDER BY</code> — «какие-то» N строк. Тест, который на это опирается, будет нестабильным.</li>
        </ul></div>
      </div></details>

      <details class="section"><summary><span class="badge b-green">5</span> Порядок выполнения запроса <span class="chev">▶</span></summary><div class="section-body">
        <p class="note">Пишем в одном порядке, а база выполняет в другом. Это объясняет половину ошибок: почему псевдоним из <code>SELECT</code> нельзя использовать в <code>WHERE</code>, но можно в <code>ORDER BY</code>.</p>
        <div class="table-scroll"><table class="tbl">
          <thead><tr><th>Шаг</th><th>Часть</th><th>Что происходит</th></tr></thead>
          <tbody>
            <tr><td>1</td><td><code>FROM</code> / <code>JOIN</code></td><td>Собрать исходные строки, соединить таблицы</td></tr>
            <tr><td>2</td><td><code>WHERE</code></td><td>Отфильтровать строки</td></tr>
            <tr><td>3</td><td><code>GROUP BY</code></td><td>Разбить на группы</td></tr>
            <tr><td>4</td><td><code>HAVING</code></td><td>Отфильтровать группы</td></tr>
            <tr class="hot"><td>5</td><td><code>SELECT</code></td><td>Вычислить столбцы и псевдонимы, оконные функции</td></tr>
            <tr><td>6</td><td><code>DISTINCT</code></td><td>Убрать повторы</td></tr>
            <tr><td>7</td><td><code>ORDER BY</code></td><td>Отсортировать (псевдонимы уже известны)</td></tr>
            <tr><td>8</td><td><code>LIMIT</code> / <code>OFFSET</code></td><td>Обрезать результат</td></tr>
          </tbody>
        </table></div>
<pre class="code" data-lang="sql">SELECT name, age * 12 AS months FROM users WHERE months &gt; 400;   -- ошибка: months ещё не существует
SELECT name, age * 12 AS months FROM users WHERE age * 12 &gt; 400;  -- так правильно
SELECT name, age * 12 AS months FROM users ORDER BY months;       -- в ORDER BY псевдоним можно</pre>
        <p class="note">SQLite и MySQL прощают псевдоним в <code>WHERE</code>/<code>HAVING</code>, PostgreSQL — нет. Пишите по стандарту, чтобы запрос работал везде.</p>
      </div></details>
    </div>
  </details>

  <!-- ==================== WHERE ==================== -->
  <details class="section" id="s-where" data-icon="🎯" data-desc="Сравнения, AND/OR, IN, BETWEEN, LIKE — фильтрация строк." data-train="WHERE и NULL">
    <summary><span class="badge b-teal">WHR</span> WHERE: фильтрация строк <span class="chev">▶</span></summary>
    <div class="section-body">
      <p class="note"><code>WHERE</code> оставляет только строки, для которых условие <b>истинно</b>. Если условие ложно или неизвестно (<code>NULL</code>), строка отбрасывается.</p>

      <details class="section"><summary><span class="badge b-teal">1</span> Сравнение и логика <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">SELECT name FROM users WHERE city = 'Москва';        -- Анна, Вера
SELECT name FROM users WHERE age &gt;= 30;              -- Борис, Глеб
SELECT name FROM users WHERE city &lt;&gt; 'Москва';       -- Борис, Глеб  (Дина с NULL не попала!)
SELECT name FROM users WHERE city = 'Москва' AND age &lt; 30;   -- Анна
SELECT name FROM users WHERE city = 'СПб' OR age &gt; 40;       -- Борис, Глеб
SELECT name FROM users WHERE NOT city = 'Москва';    -- Борис, Глеб</pre>
        <p class="note">Не равно — <code>&lt;&gt;</code> (стандарт) или <code>!=</code> (поддерживают почти все). У <code>AND</code> приоритет выше, чем у <code>OR</code>, как у умножения перед сложением.</p>
<pre class="code" data-lang="sql">-- хотели: «старше 30 ИЛИ из Москвы» и при этом младше 30 — запутались в приоритете
SELECT name FROM users WHERE age &gt; 30 OR city = 'Москва' AND age &lt; 30;
-- читается как: age &gt; 30 OR (city = 'Москва' AND age &lt; 30)  → Анна, Борис, Глеб
SELECT name FROM users WHERE (age &gt; 30 OR city = 'Москва') AND age &lt; 30;  -- Анна</pre>
        <div class="neg-block"><p class="neg-title">✕ Частая ошибка</p><ol><li>Смешали <code>AND</code> и <code>OR</code> без скобок. Правило: если в условии есть оба — всегда ставьте скобки.</li></ol></div>
      </div></details>

      <details class="section"><summary><span class="badge b-teal">2</span> IN, BETWEEN <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">SELECT id FROM orders WHERE status IN ('new', 'cancelled');   -- 3, 4  (короче, чем два OR)
SELECT id FROM orders WHERE status NOT IN ('paid');           -- 3, 4
SELECT name FROM users WHERE age BETWEEN 19 AND 35;           -- Анна, Борис, Дина (границы ВКЛЮЧЕНЫ)
SELECT id FROM orders
WHERE created_at BETWEEN '2026-02-01' AND '2026-02-28';       -- 2, 3</pre>
        <div class="neg-block"><p class="neg-title">✕ Ловушка с датами</p><ol>
          <li>Если столбец хранит дату со временем, <code>BETWEEN '2026-02-01' AND '2026-02-28'</code> не захватит 28 февраля после 00:00. Надёжнее полуинтервал:
<pre class="code" data-lang="sql">WHERE created_at &gt;= '2026-02-01' AND created_at &lt; '2026-03-01'</pre></li>
        </ol></div>
      </div></details>

      <details class="section"><summary><span class="badge b-teal">3</span> LIKE — поиск по шаблону <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">SELECT name FROM users WHERE name LIKE 'А%';      -- начинается с «А»: Анна
SELECT name FROM users WHERE name LIKE '%а';      -- заканчивается на «а»: Анна, Вера, Дина
SELECT name FROM users WHERE name LIKE '_ера';    -- ровно один любой символ + «ера»: Вера
SELECT name FROM users WHERE name LIKE '%ор%';    -- содержит «ор»: Борис
SELECT email FROM users WHERE email LIKE '%\_%' ESCAPE '\';  -- ищем сам символ «_»</pre>
        <div class="table-scroll"><table class="tbl">
          <thead><tr><th>Символ</th><th>Значит</th><th>Пример</th></tr></thead>
          <tbody>
            <tr><td><code>%</code></td><td>Любое число любых символов, в том числе ноль</td><td><code>'te%'</code> → test, te</td></tr>
            <tr><td><code>_</code></td><td>Ровно один любой символ</td><td><code>'t_st'</code> → test, tost</td></tr>
          </tbody>
        </table></div>
        <p class="note">Чувствительность к регистру зависит от СУБД: в PostgreSQL <code>LIKE</code> различает регистр (для без учёта есть <code>ILIKE</code>), в MySQL обычно нет. Универсально: <code>LOWER(name) LIKE 'анна%'</code>. <code>LIKE '%текст'</code> с <code>%</code> в начале не может использовать обычный индекс — на больших таблицах это медленно.</p>
      </div></details>

      <details class="section"><summary><span class="badge b-teal">✓</span> Шпаргалка по условиям <span class="chev">▶</span></summary><div class="section-body">
        <div class="table-scroll"><table class="tbl">
          <thead><tr><th>Условие</th><th>Пример</th></tr></thead>
          <tbody>
            <tr><td>Равно / не равно</td><td><code>status = 'paid'</code>, <code>status &lt;&gt; 'paid'</code></td></tr>
            <tr><td>Больше / меньше</td><td><code>&gt;</code>, <code>&lt;</code>, <code>&gt;=</code>, <code>&lt;=</code></td></tr>
            <tr><td>Диапазон (с границами)</td><td><code>age BETWEEN 18 AND 30</code></td></tr>
            <tr><td>Из списка</td><td><code>city IN ('Москва', 'СПб')</code></td></tr>
            <tr><td>По шаблону</td><td><code>name LIKE 'А%'</code></td></tr>
            <tr class="hot"><td>Пусто / не пусто</td><td><code>city IS NULL</code>, <code>city IS NOT NULL</code></td></tr>
            <tr><td>Есть связанные строки</td><td><code>EXISTS (SELECT 1 FROM ...)</code></td></tr>
          </tbody>
        </table></div>
        <p class="legend-hot">★ — с <code>NULL</code> работает только <code>IS NULL</code>, не <code>= NULL</code></p>
      </div></details>
    </div>
  </details>

  <!-- ==================== NULL ==================== -->
  <details class="section" id="s-null" data-icon="∅" data-desc="NULL, трёхзначная логика, IS NULL, COALESCE и типичные ловушки." data-train="WHERE и NULL">
    <summary><span class="badge b-purple">∅</span> NULL и трёхзначная логика <span class="chev">▶</span></summary>
    <div class="section-body">
      <p class="note"><code>NULL</code> — это не ноль и не пустая строка, а «значение неизвестно». Возраст Веры не 0 лет, он просто не указан. Отсюда главное правило: любое сравнение с неизвестным даёт неизвестность. «Вере больше 30?» — «Не знаю».</p>
      <div class="vs-grid">
        <div class="vs-card"><h4><code>NULL</code></h4><p>Значения нет. <code>NULL = NULL</code> → <code>NULL</code> (а не TRUE): два неизвестных не обязательно равны.</p></div>
        <div class="vs-card"><h4><code>''</code> пустая строка</h4><p>Значение есть, оно пустое. <code>'' = ''</code> → TRUE. (Исключение — Oracle: там <code>''</code> и есть <code>NULL</code>.)</p></div>
        <div class="vs-card"><h4><code>0</code></h4><p>Обычное число. Баланс 0 ₽ и «баланс неизвестен» — разные состояния, и это важно для бизнес-логики.</p></div>
      </div>

      <h3 class="sub">Трёхзначная логика: TRUE, FALSE, UNKNOWN</h3>
<pre class="code" data-lang="sql">SELECT name FROM users WHERE age = NULL;      -- пусто! сравнение с NULL всегда UNKNOWN
SELECT name FROM users WHERE age IS NULL;     -- Вера
SELECT name FROM users WHERE city IS NOT NULL;-- Анна, Борис, Вера, Глеб
SELECT NULL = NULL, NULL &lt;&gt; 1, NULL + 5;      -- NULL, NULL, NULL</pre>
      <div class="table-scroll"><table class="tbl">
        <thead><tr><th>A</th><th>B</th><th>A AND B</th><th>A OR B</th><th>NOT A</th></tr></thead>
        <tbody>
          <tr><td>TRUE</td><td>NULL</td><td class="mid">NULL</td><td class="yes">TRUE</td><td>FALSE</td></tr>
          <tr><td>FALSE</td><td>NULL</td><td class="no">FALSE</td><td class="mid">NULL</td><td>TRUE</td></tr>
          <tr><td>NULL</td><td>NULL</td><td class="mid">NULL</td><td class="mid">NULL</td><td class="mid">NULL</td></tr>
        </tbody>
      </table></div>
      <p class="note">Логика: <code>FALSE AND что угодно</code> — точно ложь; <code>TRUE OR что угодно</code> — точно истина. В остальных случаях с <code>NULL</code> ответ неизвестен.</p>

      <h3 class="sub">Функции для NULL</h3>
<pre class="code" data-lang="sql">SELECT name, COALESCE(city, 'не указан') FROM users;  -- первое не-NULL значение: Дина | не указан
SELECT COALESCE(NULL, NULL, 3, 4);                    -- 3
SELECT NULLIF(5, 5), NULLIF(5, 3);                    -- NULL, 5 (NULL, если равны)
SELECT 100 / NULLIF(0, 0);                            -- NULL вместо ошибки деления на ноль
-- IFNULL(a, b) — MySQL/SQLite, ISNULL(a, b) — SQL Server, NVL(a, b) — Oracle: всё это COALESCE на два аргумента</pre>

      <h3 class="sub">Где NULL ведёт себя неочевидно</h3>
      <div class="table-scroll"><table class="tbl">
        <thead><tr><th>Ситуация</th><th>Что происходит</th></tr></thead>
        <tbody>
          <tr class="hot"><td><code>WHERE city &lt;&gt; 'Москва'</code></td><td>Строки с <code>city IS NULL</code> не попадут. Нужно <code>... OR city IS NULL</code></td></tr>
          <tr class="hot"><td><code>NOT IN (подзапрос с NULL)</code></td><td>Возвращает 0 строк! См. раздел «Подзапросы»</td></tr>
          <tr><td><code>COUNT(*)</code> vs <code>COUNT(age)</code></td><td><code>COUNT(*)</code> = 5 строк, <code>COUNT(age)</code> = 4: <code>NULL</code> не считается</td></tr>
          <tr><td><code>AVG(age)</code></td><td>31 = 124 / 4, а не 124 / 5: <code>NULL</code> игнорируется</td></tr>
          <tr><td><code>GROUP BY city</code></td><td>Все <code>NULL</code> собираются в одну группу</td></tr>
          <tr><td><code>DISTINCT</code></td><td><code>NULL</code> попадает один раз</td></tr>
          <tr><td><code>UNIQUE</code>-ограничение</td><td>В большинстве СУБД допускает несколько <code>NULL</code> (они «не равны» друг другу)</td></tr>
          <tr><td><code>'abc' || NULL</code></td><td><code>NULL</code> — склейка с неизвестным даёт неизвестное (в MySQL <code>CONCAT</code> тоже)</td></tr>
        </tbody>
      </table></div>
      <p class="legend-hot">★ — самые частые баги в отчётах и фильтрах</p>
      <div class="qa-block"><p class="qa-title">Для QA</p><ul>
        <li>Для каждого необязательного поля проверяйте фильтры и отчёты с <code>NULL</code>: «все, кроме Москвы» должны включать пользователей без города?</li>
        <li>Различайте в требованиях «поле пустое» (<code>''</code>) и «поле не заполнено» (<code>NULL</code>) — API и UI часто путают их.</li>
        <li>Проверка обязательных полей: <code>SELECT COUNT(*) FROM users WHERE email IS NULL OR email = '';</code> — должно быть 0.</li>
      </ul></div>
    </div>
  </details>

  <!-- ==================== АГРЕГАТЫ ==================== -->
  <details class="section" id="s-group" data-icon="Σ" data-desc="COUNT, SUM, AVG, GROUP BY и HAVING — итоги по группам." data-train="Агрегаты">
    <summary><span class="badge b-orange">Σ</span> Агрегаты, GROUP BY, HAVING <span class="chev">▶</span></summary>
    <div class="section-body">
      <p class="note">Агрегатная функция сворачивает много строк в одно число: сколько, сумма, среднее, минимум, максимум. <code>GROUP BY</code> делает то же самое, но отдельно для каждой группы — как сводная таблица в Excel.</p>

      <details class="section"><summary><span class="badge b-orange">1</span> Агрегатные функции <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">SELECT COUNT(*) FROM users;              -- 5   число строк
SELECT COUNT(age) FROM users;            -- 4   число НЕ-NULL значений
SELECT COUNT(DISTINCT city) FROM users;  -- 3   разных городов (NULL не считается)
SELECT SUM(amount) FROM orders;          -- 4400
SELECT AVG(age) FROM users;              -- 31.0  (124 / 4 — Вера без возраста не учтена)
SELECT MIN(amount), MAX(amount) FROM orders;  -- 200, 1500
SELECT MAX(created_at) FROM orders;      -- 2026-03-25  (MIN/MAX работают и со строками, датами)</pre>
        <div class="table-scroll"><table class="tbl">
          <thead><tr><th>Функция</th><th>Считает</th><th>NULL</th><th>Пустая таблица</th></tr></thead>
          <tbody>
            <tr class="hot"><td><code>COUNT(*)</code></td><td>Строки</td><td class="yes">считает</td><td>0</td></tr>
            <tr><td><code>COUNT(col)</code></td><td>Не-NULL значения</td><td class="no">пропускает</td><td>0</td></tr>
            <tr><td><code>SUM(col)</code></td><td>Сумма</td><td class="no">пропускает</td><td class="mid">NULL, не 0!</td></tr>
            <tr><td><code>AVG(col)</code></td><td>Среднее</td><td class="no">пропускает</td><td class="mid">NULL</td></tr>
            <tr><td><code>MIN</code> / <code>MAX</code></td><td>Крайние значения</td><td class="no">пропускает</td><td class="mid">NULL</td></tr>
          </tbody>
        </table></div>
        <p class="note">Сумма пустого набора — <code>NULL</code>. В отчёте «выручка за день без заказов» покажет пустоту вместо 0: оборачивайте в <code>COALESCE(SUM(amount), 0)</code>. В PostgreSQL <code>AVG</code> целых чисел возвращает дробное, а в SQL Server — целое (<code>AVG</code> от 1 и 2 = 1): приводите к дробному типу.</p>
      </div></details>

      <details class="section"><summary><span class="badge b-orange">2</span> GROUP BY — по группам <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">SELECT status, COUNT(*) AS cnt
FROM orders
GROUP BY status;
-- cancelled | 1
-- new       | 1
-- paid      | 4

SELECT user_id, COUNT(*) AS orders_cnt, SUM(amount) AS total
FROM orders
GROUP BY user_id
ORDER BY total DESC;
-- 1 | 2 | 2000
-- 4 | 2 | 1500
-- 2 | 2 | 900</pre>
        <p class="note">Правило: в <code>SELECT</code> при группировке можно писать только столбцы из <code>GROUP BY</code> и агрегаты. Иначе непонятно, какое значение показать: в группе <code>paid</code> четыре разных <code>amount</code> — какой из них вывести?</p>
<pre class="code" data-lang="sql">SELECT status, amount, COUNT(*) FROM orders GROUP BY status;
-- PostgreSQL: ERROR: column "orders.amount" must appear in the GROUP BY clause
-- MySQL (без ONLY_FULL_GROUP_BY) и SQLite: вернут СЛУЧАЙНЫЙ amount из группы — тихий баг</pre>
      </div></details>

      <details class="section"><summary><span class="badge b-orange">3</span> HAVING — фильтр групп <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">-- клиенты, оплатившие больше 1000 в сумме
SELECT user_id, SUM(amount) AS paid_total
FROM orders
WHERE status = 'paid'          -- 1) сначала отбираем строки: только оплаченные
GROUP BY user_id               -- 2) группируем
HAVING SUM(amount) &gt; 1000;     -- 3) отбираем группы
-- 1 | 2000
-- 4 | 1200</pre>
        <div class="vs-grid">
          <div class="vs-card"><h4><code>WHERE</code></h4><p>Фильтрует <b>строки до</b> группировки. Агрегаты в нём нельзя: <code>WHERE SUM(amount) &gt; 1000</code> — ошибка.</p></div>
          <div class="vs-card"><h4><code>HAVING</code></h4><p>Фильтрует <b>группы после</b> группировки. Работает с агрегатами. Условия на обычные столбцы лучше ставить в <code>WHERE</code> — меньше строк попадёт в группировку.</p></div>
        </div>
      </div></details>

      <details class="section"><summary><span class="badge b-orange">✓</span> Шпаргалка <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">SELECT   столбцы_группировки, агрегаты
FROM     таблица
WHERE    условие_на_строки
GROUP BY столбцы_группировки
HAVING   условие_на_агрегаты
ORDER BY ...
LIMIT    ...;</pre>
        <div class="qa-block"><p class="qa-title">Для QA</p><ul>
          <li>Сверка отчёта: цифры на дашборде = <code>SELECT COUNT(*), SUM(amount) ... GROUP BY</code> по тем же условиям (статус, период, часовой пояс!).</li>
          <li>Поиск дублей: <code>GROUP BY email HAVING COUNT(*) &gt; 1</code>.</li>
        </ul></div>
      </div></details>
    </div>
  </details>

  <!-- ==================== JOIN ==================== -->
  <details class="section" id="s-join" data-icon="🔗" data-desc="INNER, LEFT, self join, размножение строк, UNION / INTERSECT / EXCEPT." data-train="JOIN">
    <summary><span class="badge b-blue">⋈</span> JOIN: соединение таблиц <span class="chev">▶</span></summary>
    <div class="section-body">
      <p class="note"><code>JOIN</code> склеивает строки двух таблиц по условию в <code>ON</code>, обычно «внешний ключ = первичный ключ»: <code>orders.user_id = users.id</code>. Каждая пара строк, для которой условие истинно, даёт одну строку результата. Разные виды <code>JOIN</code> отличаются тем, что делать со строками, которым пары не нашлось.</p>
      <div class="table-scroll"><table class="tbl">
        <thead><tr><th>Вид</th><th>Что вернёт</th><th>Строк на учебной базе</th></tr></thead>
        <tbody>
          <tr class="hot"><td><code>INNER JOIN</code> (или просто <code>JOIN</code>)</td><td>Только пары, где совпало</td><td>6 (Вера и Дина пропали)</td></tr>
          <tr class="hot"><td><code>LEFT JOIN</code></td><td>Все строки левой + пары из правой, иначе <code>NULL</code></td><td>8 (Вера и Дина с <code>NULL</code> вместо заказа)</td></tr>
          <tr><td><code>RIGHT JOIN</code></td><td>Зеркально: все строки правой</td><td>6</td></tr>
          <tr><td><code>FULL JOIN</code></td><td>Все строки обеих, где нет пары — <code>NULL</code></td><td>8 (нет в MySQL)</td></tr>
          <tr><td><code>CROSS JOIN</code></td><td>Каждая строка с каждой (декартово произведение)</td><td>5 × 6 = 30</td></tr>
        </tbody>
      </table></div>
      <p class="legend-hot">★ — 95% всех соединений</p>

      <details class="section"><summary><span class="badge b-blue">1</span> INNER JOIN <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">SELECT u.name, o.id AS order_id, o.amount
FROM users u
JOIN orders o ON o.user_id = u.id
ORDER BY o.id;
-- Анна  | 1 | 500
-- Анна  | 2 | 1500
-- Борис | 3 | 700
-- Глеб  | 4 | 300
-- Глеб  | 5 | 1200
-- Борис | 6 | 200</pre>
        <p class="note">Анна встречается дважды — у неё два заказа. <code>JOIN</code> «один ко многим» размножает строки левой таблицы. Пользователи без заказов исчезли.</p>
      </div></details>

      <details class="section"><summary><span class="badge b-blue">2</span> LEFT JOIN и поиск «без пары» <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">SELECT u.name, COUNT(o.id) AS orders_cnt, COALESCE(SUM(o.amount), 0) AS total
FROM users u
LEFT JOIN orders o ON o.user_id = u.id
GROUP BY u.id, u.name
ORDER BY u.id;
-- Анна  | 2 | 2000
-- Борис | 2 | 900
-- Вера  | 0 | 0       ← без заказов, но в отчёте есть
-- Глеб  | 2 | 1500
-- Дина  | 0 | 0

-- анти-соединение: пользователи БЕЗ заказов
SELECT u.name
FROM users u
LEFT JOIN orders o ON o.user_id = u.id
WHERE o.id IS NULL;              -- Вера, Дина</pre>
        <p class="note">Обратите внимание: <code>COUNT(o.id)</code>, а не <code>COUNT(*)</code>. У Веры одна строка с <code>NULL</code> вместо заказа — <code>COUNT(*)</code> посчитал бы её и дал 1.</p>
        <div class="neg-block"><p class="neg-title">✕ Ловушка: условие в WHERE превращает LEFT в INNER</p><ol>
          <li>Хотим всех пользователей и их <b>оплаченные</b> заказы:
<pre class="code" data-lang="sql">-- неправильно: Вера и Дина пропадут (у них o.status IS NULL, условие не выполнено)
SELECT u.name, o.amount FROM users u
LEFT JOIN orders o ON o.user_id = u.id
WHERE o.status = 'paid';
-- правильно: фильтр правой таблицы — в ON
SELECT u.name, o.amount FROM users u
LEFT JOIN orders o ON o.user_id = u.id AND o.status = 'paid';</pre></li>
        </ol></div>
      </div></details>

      <details class="section"><summary><span class="badge b-blue">3</span> Несколько таблиц, self join <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">-- цепочка: заказ → позиции → товары
SELECT o.id, p.title, oi.qty
FROM orders o
JOIN order_items oi ON oi.order_id = o.id
JOIN products p     ON p.id = oi.product_id;

-- self join: таблица с самой собой (сотрудник и его руководитель)
SELECT e.name AS employee, m.name AS manager
FROM employees e
LEFT JOIN employees m ON m.id = e.manager_id;

-- пары пользователей из одного города (без повторов и без пары «сам с собой»)
SELECT a.name, b.name
FROM users a JOIN users b ON a.city = b.city AND a.id &lt; b.id;   -- Анна | Вера</pre>
        <p class="note">Таблицы <code>order_items</code>, <code>products</code>, <code>employees</code> — для иллюстрации, их нет в учебной базе.</p>
      </div></details>

      <details class="section"><summary><span class="badge b-blue">4</span> Размножение строк <span class="chev">▶</span></summary><div class="section-body">
        <p class="note">Если присоединить две «многие» таблицы к одной, строки перемножатся. У Анны 2 заказа и, скажем, 3 адреса — после двух <code>JOIN</code> будет 6 строк, и <code>SUM(amount)</code> окажется втрое больше.</p>
<pre class="code" data-lang="sql">-- неправильно: сумма заказов задвоится/затроится
SELECT u.name, SUM(o.amount) FROM users u
JOIN orders o    ON o.user_id = u.id
JOIN addresses a ON a.user_id = u.id
GROUP BY u.name;
-- правильно: сначала агрегировать, потом соединять
SELECT u.name, t.total
FROM users u
JOIN (SELECT user_id, SUM(amount) AS total FROM orders GROUP BY user_id) t ON t.user_id = u.id;</pre>
        <div class="qa-block"><p class="qa-title">Для QA</p><ul>
          <li>Если в отчёте сумма или количество подозрительно кратно больше — первым делом ищите размножение строк в <code>JOIN</code>.</li>
          <li>Сколько строк должно быть? До и после <code>JOIN</code> сравните <code>COUNT(*)</code> — это быстрая проверка, что ничего не потерялось и не размножилось.</li>
          <li>Проверка целостности: заказы, у которых нет пользователя («сироты») — <code>LEFT JOIN users ... WHERE u.id IS NULL</code>.</li>
        </ul></div>
      </div></details>

      <details class="section"><summary><span class="badge b-blue">5</span> UNION, INTERSECT, EXCEPT <span class="chev">▶</span></summary><div class="section-body">
        <p class="note">JOIN склеивает таблицы «вбок» (добавляет столбцы), а операции над множествами — «вниз» (складывают строки). У запросов должно быть одинаковое число столбцов совместимых типов.</p>
<pre class="code" data-lang="sql">SELECT city FROM users WHERE age &lt; 30
UNION                       -- объединить и убрать дубли: NULL, Москва (2 строки)
SELECT city FROM users WHERE city = 'Москва';

SELECT user_id FROM orders WHERE status = 'paid'
UNION ALL                   -- объединить БЕЗ удаления дублей (быстрее)
SELECT user_id FROM orders WHERE status = 'new';     -- 1, 1, 4, 2, 2  (5 строк)

SELECT id FROM users
EXCEPT                      -- есть в первом, нет во втором (в Oracle — MINUS)
SELECT user_id FROM orders; -- 3, 5

SELECT id FROM users
INTERSECT                   -- есть в обоих
SELECT user_id FROM orders; -- 1, 2, 4</pre>
        <p class="note"><code>UNION ALL</code> предпочтительнее, если дублей быть не может или они нужны: <code>UNION</code> сортирует/хеширует весь результат, чтобы убрать повторы. Для QA <code>EXCEPT</code> удобен для сверки двух наборов: «что есть в источнике, но не доехало в выгрузку».</p>
      </div></details>
    </div>
  </details>

  <!-- ==================== ПОДЗАПРОСЫ ==================== -->
  <details class="section" id="s-subq" data-icon="🪆" data-desc="Скалярные подзапросы, IN / EXISTS, подзапрос в FROM, CTE (WITH)." data-train="Подзапросы и окна">
    <summary><span class="badge b-pink">( )</span> Подзапросы и CTE <span class="chev">▶</span></summary>
    <div class="section-body">
      <p class="note">Подзапрос — запрос внутри запроса, в скобках. Результат внутреннего используется внешним: как одно число, как список значений или как временная таблица. CTE (<code>WITH</code>) — тот же подзапрос, но вынесенный наверх и с именем, чтобы запрос читался сверху вниз.</p>

      <details class="section"><summary><span class="badge b-pink">1</span> Скалярный подзапрос — одно значение <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">-- заказы дороже среднего (среднее = 733.33)
SELECT id, amount FROM orders
WHERE amount &gt; (SELECT AVG(amount) FROM orders);    -- 2 | 1500, 5 | 1200

-- в SELECT: доля каждого заказа от общей суммы
SELECT id, amount, ROUND(100.0 * amount / (SELECT SUM(amount) FROM orders), 1) AS pct
FROM orders;                                         -- 1 | 500 | 11.4 ...</pre>
        <p class="note">Скалярный подзапрос обязан вернуть ровно одну строку и один столбец. Если вернёт несколько строк — ошибка (в PostgreSQL <i>more than one row returned by a subquery</i>), если ноль — <code>NULL</code>.</p>
      </div></details>

      <details class="section"><summary><span class="badge b-pink">2</span> IN и NOT IN со списком <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">SELECT name FROM users
WHERE id IN (SELECT user_id FROM orders WHERE status = 'paid');      -- Анна, Борис, Глеб

SELECT name FROM users
WHERE id NOT IN (SELECT user_id FROM orders);                        -- Вера, Дина</pre>
        <div class="neg-block"><p class="neg-title">✕ Главная ловушка: NOT IN и NULL</p><ol>
          <li>Если в подзапросе для <code>NOT IN</code> есть хотя бы один <code>NULL</code>, результат — <b>пустой</b>.
<pre class="code" data-lang="sql">SELECT name FROM users WHERE id NOT IN (1, 2, NULL);    -- 0 строк!
-- id NOT IN (1, 2, NULL)  ≡  id &lt;&gt; 1 AND id &lt;&gt; 2 AND id &lt;&gt; NULL
-- последнее — UNKNOWN, значит всё условие никогда не TRUE</pre>
          Если в <code>orders</code> появится заказ гостя с <code>user_id = NULL</code>, запрос «пользователи без заказов» внезапно вернёт ноль строк. Используйте <code>NOT EXISTS</code> или <code>LEFT JOIN ... IS NULL</code> — они не страдают от <code>NULL</code>.</li>
        </ol></div>
      </div></details>

      <details class="section"><summary><span class="badge b-pink">3</span> EXISTS и коррелированный подзапрос <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">-- пользователи, у которых есть хотя бы один отменённый заказ
SELECT u.name FROM users u
WHERE EXISTS (SELECT 1 FROM orders o WHERE o.user_id = u.id AND o.status = 'cancelled');   -- Глеб

-- пользователи без заказов — безопасно при NULL
SELECT u.name FROM users u
WHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.user_id = u.id);   -- Вера, Дина

-- самый дорогой заказ каждого пользователя
SELECT o.user_id, o.id, o.amount FROM orders o
WHERE o.amount = (SELECT MAX(o2.amount) FROM orders o2 WHERE o2.user_id = o.user_id);
-- 1 | 2 | 1500,  2 | 3 | 700,  4 | 5 | 1200</pre>
        <p class="note">Коррелированный подзапрос ссылается на строку внешнего (<code>u.id</code>) и логически выполняется для каждой его строки. <code>EXISTS</code> только проверяет «есть ли хоть одна строка» и останавливается на первой найденной, поэтому внутри пишут <code>SELECT 1</code> — столбцы не важны.</p>
      </div></details>

      <details class="section"><summary><span class="badge b-pink">4</span> Подзапрос в FROM <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">-- средняя сумма покупок на одного покупателя
SELECT AVG(total) FROM (
  SELECT user_id, SUM(amount) AS total
  FROM orders GROUP BY user_id
) t;                                  -- (2000 + 900 + 1500) / 3 = 1466.67</pre>
        <p class="note">Подзапросу в <code>FROM</code> (производной таблице) в большинстве СУБД обязательно нужен псевдоним — здесь <code>t</code>.</p>
      </div></details>

      <details class="section"><summary><span class="badge b-pink">5</span> CTE: WITH <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">WITH totals AS (
  SELECT user_id, SUM(amount) AS total
  FROM orders
  WHERE status = 'paid'
  GROUP BY user_id
),
vip AS (
  SELECT user_id FROM totals WHERE total &gt;= 1200
)
SELECT u.name, t.total
FROM vip
JOIN totals t ON t.user_id = vip.user_id
JOIN users u  ON u.id = vip.user_id;     -- Анна | 2000, Глеб | 1200</pre>
        <p class="note">CTE читается как рецепт: «сначала посчитай суммы, потом отбери VIP, потом покажи имена». Одну CTE можно использовать несколько раз, а следующая может ссылаться на предыдущую.</p>
        <h3 class="sub">Рекурсивная CTE</h3>
<pre class="code" data-lang="sql">-- числа от 1 до 5 (генератор последовательности)
WITH RECURSIVE n(x) AS (
  SELECT 1                       -- якорь: стартовая строка
  UNION ALL
  SELECT x + 1 FROM n WHERE x &lt; 5 -- шаг: из предыдущих строк получаем новые
)
SELECT x FROM n;                 -- 1, 2, 3, 4, 5</pre>
        <p class="note">Рекурсия нужна для деревьев: категории с подкатегориями, оргструктура, комментарии с ответами. Без условия остановки запрос будет работать бесконечно.</p>
      </div></details>
    </div>
  </details>

  <!-- ==================== ОКОННЫЕ ФУНКЦИИ ==================== -->
  <details class="section" id="s-window" data-icon="🪟" data-desc="OVER, PARTITION BY, ROW_NUMBER, RANK, накопительный итог, LAG / LEAD." data-train="Подзапросы и окна">
    <summary><span class="badge b-purple">OVER</span> Оконные функции <span class="chev">▶</span></summary>
    <div class="section-body">
      <p class="note">Оконная функция считает что-то по группе строк, но, в отличие от <code>GROUP BY</code>, <b>не сворачивает</b> строки: каждая строка остаётся на месте и получает рядом вычисленное значение. Как если бы в Excel в каждой строке была формула «сумма по моему клиенту».</p>
<pre class="code" data-lang="sql">функция() OVER (
  PARTITION BY ...   -- на какие группы делить (необязательно; без него — вся таблица одно окно)
  ORDER BY ...       -- порядок внутри группы (нужен для нумерации, накопления, LAG/LEAD)
)</pre>

      <details class="section"><summary><span class="badge b-purple">1</span> Агрегат без схлопывания <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">SELECT id, user_id, amount,
       SUM(amount) OVER (PARTITION BY user_id) AS user_total,
       COUNT(*)    OVER ()                     AS all_cnt
FROM orders ORDER BY id;
-- 1 | 1 | 500  | 2000 | 6
-- 2 | 1 | 1500 | 2000 | 6
-- 3 | 2 | 700  | 900  | 6
-- 4 | 4 | 300  | 1500 | 6
-- 5 | 4 | 1200 | 1500 | 6
-- 6 | 2 | 200  | 900  | 6</pre>
      </div></details>

      <details class="section"><summary><span class="badge b-purple">2</span> Нумерация: ROW_NUMBER, RANK, DENSE_RANK <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">SELECT name, score,
       ROW_NUMBER() OVER (ORDER BY score DESC) AS rn,
       RANK()       OVER (ORDER BY score DESC) AS rnk,
       DENSE_RANK() OVER (ORDER BY score DESC) AS drnk
FROM results;
-- A | 100 | 1 | 1 | 1
-- B |  90 | 2 | 2 | 2
-- C |  90 | 3 | 2 | 2   ← одинаковые баллы
-- D |  80 | 4 | 4 | 3   ← RANK пропускает 3, DENSE_RANK — нет</pre>
        <div class="vs-grid">
          <div class="vs-card"><h4><code>ROW_NUMBER</code></h4><p>1, 2, 3, 4 — всегда уникальный номер. При равенстве порядок случайный.</p></div>
          <div class="vs-card"><h4><code>RANK</code></h4><p>1, 2, 2, 4 — равным одинаковое место, следующие места пропускаются (как в спорте).</p></div>
          <div class="vs-card"><h4><code>DENSE_RANK</code></h4><p>1, 2, 2, 3 — без пропусков. Удобно для «N-й по величине зарплаты».</p></div>
        </div>
<pre class="code" data-lang="sql">-- топ-1 заказ каждого пользователя (классическая задача)
SELECT user_id, id, amount FROM (
  SELECT o.*, ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY amount DESC) AS rn
  FROM orders o
) t
WHERE rn = 1;                     -- 1 | 2 | 1500,  2 | 3 | 700,  4 | 5 | 1200</pre>
        <p class="note">Оконную функцию нельзя писать в <code>WHERE</code> (она вычисляется на шаге <code>SELECT</code>), поэтому фильтр — во внешнем запросе или CTE.</p>
      </div></details>

      <details class="section"><summary><span class="badge b-purple">3</span> Накопительный итог, LAG / LEAD <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">SELECT created_at, amount,
       SUM(amount) OVER (ORDER BY created_at)       AS running_total,
       LAG(amount)  OVER (ORDER BY created_at)      AS prev_amount,
       amount - LAG(amount) OVER (ORDER BY created_at) AS diff
FROM orders;
-- 2026-01-10 | 500  | 500  | NULL | NULL
-- 2026-02-03 | 1500 | 2000 | 500  | 1000
-- 2026-02-15 | 700  | 2700 | 1500 | -800
-- 2026-03-01 | 300  | 3000 | 700  | -400
-- 2026-03-20 | 1200 | 4200 | 300  | 900
-- 2026-03-25 | 200  | 4400 | 1200 | -1000</pre>
        <p class="note"><code>LAG</code> — значение из предыдущей строки, <code>LEAD</code> — из следующей. Для первой строки предыдущей нет — <code>NULL</code> (можно задать значение по умолчанию: <code>LAG(amount, 1, 0)</code>). Когда в окне есть <code>ORDER BY</code>, <code>SUM</code> по умолчанию считает «от начала до текущей строки» — отсюда накопительный итог.</p>
      </div></details>
    </div>
  </details>

  <!-- ==================== DML ==================== -->
  <details class="section" id="s-dml" data-icon="✏️" data-desc="INSERT, UPDATE, DELETE, TRUNCATE и UPSERT." data-train="Изменение и структура">
    <summary><span class="badge b-red">DML</span> INSERT, UPDATE, DELETE <span class="chev">▶</span></summary>
    <div class="section-body">
      <p class="note">Команды, которые меняют строки. Главное правило безопасности: <code>UPDATE</code> и <code>DELETE</code> без <code>WHERE</code> затрагивают <b>всю таблицу</b>. Перед изменением выполните тот же запрос как <code>SELECT</code> и посмотрите, какие строки попадут.</p>

      <details class="section"><summary><span class="badge b-red">1</span> INSERT — добавить <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">INSERT INTO users (name, city, age) VALUES ('Егор', 'Тула', 31);   -- id подставится сам
INSERT INTO users (name, city) VALUES                              -- несколько строк сразу
  ('Жанна', 'Омск'),
  ('Зоя', NULL);                                                   -- age не указан → NULL (или DEFAULT)
INSERT INTO archive_orders (id, amount)                            -- вставить результат запроса
SELECT id, amount FROM orders WHERE created_at &lt; '2026-02-01';
INSERT INTO users (name) VALUES ('Ия') RETURNING id;               -- PostgreSQL/SQLite: сразу получить новый id</pre>
        <p class="note">Всегда перечисляйте столбцы: <code>INSERT INTO users VALUES (...)</code> без списка сломается, когда в таблицу добавят столбец.</p>
      </div></details>

      <details class="section"><summary><span class="badge b-red">2</span> UPDATE — изменить <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">UPDATE orders SET status = 'paid' WHERE id = 3;                  -- одна строка
UPDATE users SET city = 'Москва', age = age + 1 WHERE id = 5;    -- несколько столбцов
UPDATE orders SET amount = amount * 0.9 WHERE status = 'new';    -- скидка 10% всем новым
UPDATE orders SET status = 'cancelled';                          -- !!! ВСЕ заказы отменены</pre>
<pre class="code" data-lang="sql">-- безопасный приём: сначала SELECT с тем же WHERE
SELECT * FROM orders WHERE status = 'new' AND created_at &lt; '2026-03-01';   -- 1 строка, ок
BEGIN;
UPDATE orders SET status = 'cancelled' WHERE status = 'new' AND created_at &lt; '2026-03-01';
-- проверили результат → COMMIT;  что-то не так → ROLLBACK;</pre>
      </div></details>

      <details class="section"><summary><span class="badge b-red">3</span> DELETE, TRUNCATE, DROP <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">DELETE FROM orders WHERE status = 'cancelled';   -- удалить подходящие строки
DELETE FROM orders;                              -- удалить все строки (таблица остаётся)
TRUNCATE TABLE orders;                           -- быстро очистить таблицу целиком
DROP TABLE orders;                               -- удалить саму таблицу вместе со структурой</pre>
        <div class="table-scroll"><table class="tbl">
          <thead><tr><th></th><th><code>DELETE</code></th><th><code>TRUNCATE</code></th><th><code>DROP</code></th></tr></thead>
          <tbody>
            <tr><td>Группа</td><td>DML</td><td>DDL</td><td>DDL</td></tr>
            <tr><td>Что удаляет</td><td>Строки по условию</td><td>Все строки</td><td>Таблицу целиком</td></tr>
            <tr><td><code>WHERE</code></td><td class="yes">да</td><td class="no">нет</td><td class="no">нет</td></tr>
            <tr><td>Скорость на больших таблицах</td><td class="mid">медленно, построчно</td><td class="yes">мгновенно</td><td class="yes">мгновенно</td></tr>
            <tr><td>Триггеры на удаление</td><td class="yes">срабатывают</td><td class="no">нет</td><td class="no">нет</td></tr>
            <tr><td>Счётчик автоинкремента</td><td>Продолжается</td><td>Обычно сбрасывается</td><td>—</td></tr>
            <tr><td>Откат <code>ROLLBACK</code></td><td class="yes">да</td><td class="mid">PostgreSQL — да, MySQL/Oracle — нет</td><td class="mid">так же</td></tr>
          </tbody>
        </table></div>
        <p class="note">Мягкое удаление (soft delete): вместо <code>DELETE</code> ставят флаг <code>deleted_at = now()</code>, а все запросы фильтруют <code>WHERE deleted_at IS NULL</code>. Данные можно восстановить, история сохраняется.</p>
      </div></details>

      <details class="section"><summary><span class="badge b-red">4</span> UPSERT — вставить или обновить <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">-- PostgreSQL / SQLite: если такой email уже есть — обновить имя
INSERT INTO users (email, name) VALUES ('a@x.ru', 'Анна')
ON CONFLICT (email) DO UPDATE SET name = EXCLUDED.name;

-- MySQL
INSERT INTO users (email, name) VALUES ('a@x.ru', 'Анна')
ON DUPLICATE KEY UPDATE name = VALUES(name);

-- стандарт SQL, SQL Server, Oracle, PostgreSQL 15+: MERGE</pre>
        <div class="qa-block"><p class="qa-title">Для QA</p><ul>
          <li>Тестовые данные удобно готовить скриптом <code>INSERT</code> и убирать за собой <code>DELETE ... WHERE name LIKE 'autotest_%'</code> — помечайте свои записи префиксом.</li>
          <li>Ещё надёжнее — тест внутри транзакции с <code>ROLLBACK</code> в конце: база вернётся в исходное состояние.</li>
          <li>Проверяйте поведение повторной отправки формы/запроса: создаётся дубль или срабатывает уникальность/UPSERT (идемпотентность).</li>
        </ul></div>
      </div></details>
    </div>
  </details>

  <!-- ==================== DDL ==================== -->
  <details class="section" id="s-ddl" data-icon="🏗" data-desc="CREATE TABLE, ограничения, типы данных, ALTER, нормализация." data-train="Изменение и структура">
    <summary><span class="badge b-gray">DDL</span> Таблицы, типы, ключи и ограничения <span class="chev">▶</span></summary>
    <div class="section-body">
      <p class="note">DDL описывает структуру: какие таблицы, какие у них столбцы и типы, какие правила обязаны соблюдать данные. Ограничения (constraints) — это защита на уровне базы: даже если приложение с багом попробует записать мусор, база откажет.</p>

      <details class="section"><summary><span class="badge b-gray">1</span> CREATE TABLE <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">CREATE TABLE users (
  id         SERIAL PRIMARY KEY,                 -- автоинкремент (PostgreSQL); MySQL: INT AUTO_INCREMENT
  email      VARCHAR(255) NOT NULL UNIQUE,       -- обязательный и уникальный
  name       VARCHAR(100) NOT NULL,
  age        INT CHECK (age BETWEEN 0 AND 150),  -- проверка значения
  balance    NUMERIC(12, 2) NOT NULL DEFAULT 0,  -- деньги: точный тип, по умолчанию 0
  is_active  BOOLEAN NOT NULL DEFAULT TRUE,
  created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
);

CREATE TABLE orders (
  id      SERIAL PRIMARY KEY,
  user_id INT NOT NULL REFERENCES users(id) ON DELETE CASCADE,   -- внешний ключ
  amount  NUMERIC(12, 2) NOT NULL CHECK (amount &gt; 0),
  status  VARCHAR(20) NOT NULL DEFAULT 'new'
);</pre>
      </div></details>

      <details class="section"><summary><span class="badge b-gray">2</span> Ограничения <span class="chev">▶</span></summary><div class="section-body">
        <div class="table-scroll"><table class="tbl">
          <thead><tr><th>Ограничение</th><th>Гарантирует</th><th>Ошибка при нарушении (пример)</th></tr></thead>
          <tbody>
            <tr class="hot"><td><code>PRIMARY KEY</code></td><td>Уникальный и не-NULL идентификатор строки. Один на таблицу (может быть составным)</td><td>duplicate key value violates unique constraint</td></tr>
            <tr class="hot"><td><code>FOREIGN KEY</code> / <code>REFERENCES</code></td><td>Значение существует в другой таблице</td><td>violates foreign key constraint</td></tr>
            <tr><td><code>UNIQUE</code></td><td>Нет повторов (может быть несколько на таблицу)</td><td>duplicate key value</td></tr>
            <tr><td><code>NOT NULL</code></td><td>Значение обязательно</td><td>null value in column violates not-null constraint</td></tr>
            <tr><td><code>CHECK</code></td><td>Значение удовлетворяет условию</td><td>violates check constraint</td></tr>
            <tr><td><code>DEFAULT</code></td><td>Значение, если не передали (не ограничение, но рядом)</td><td>—</td></tr>
          </tbody>
        </table></div>
        <h3 class="sub">Что делать с заказами, если удалили пользователя</h3>
        <div class="table-scroll"><table class="tbl">
          <thead><tr><th>Правило внешнего ключа</th><th>Поведение</th></tr></thead>
          <tbody>
            <tr><td><code>ON DELETE RESTRICT</code> / <code>NO ACTION</code> (по умолчанию)</td><td>Запретить удаление, пока есть заказы</td></tr>
            <tr><td><code>ON DELETE CASCADE</code></td><td>Удалить заказы вместе с пользователем</td></tr>
            <tr><td><code>ON DELETE SET NULL</code></td><td>Оставить заказы, <code>user_id</code> станет <code>NULL</code></td></tr>
          </tbody>
        </table></div>
        <div class="vs-grid">
          <div class="vs-card"><h4>Первичный ключ</h4><p>«Паспорт» строки: <code>users.id</code>. Обычно суррогатный — число или UUID без смысла, а не email или телефон (они меняются).</p></div>
          <div class="vs-card"><h4>Внешний ключ</h4><p>Ссылка на паспорт в другой таблице: <code>orders.user_id → users.id</code>. Не даёт создать заказ несуществующему пользователю.</p></div>
        </div>
      </div></details>

      <details class="section"><summary><span class="badge b-gray">3</span> Типы данных <span class="chev">▶</span></summary><div class="section-body">
        <div class="table-scroll"><table class="tbl">
          <thead><tr><th>Тип</th><th>Для чего</th><th>Нюанс</th></tr></thead>
          <tbody>
            <tr><td><code>INT</code>, <code>BIGINT</code>, <code>SMALLINT</code></td><td>Целые</td><td><code>INT</code> до ~2,1 млрд — id больших таблиц переполняются, берут <code>BIGINT</code></td></tr>
            <tr class="hot"><td><code>NUMERIC(p, s)</code> / <code>DECIMAL</code></td><td>Деньги, точные дроби</td><td><code>NUMERIC(12,2)</code>: 12 цифр всего, 2 после запятой</td></tr>
            <tr><td><code>REAL</code>, <code>FLOAT</code>, <code>DOUBLE</code></td><td>Приблизительные дроби</td><td><code>0.1 + 0.2 ≠ 0.3</code> — для денег нельзя</td></tr>
            <tr><td><code>VARCHAR(n)</code></td><td>Строка до n символов</td><td>Длиннее — ошибка (или обрезка в старом MySQL)</td></tr>
            <tr><td><code>CHAR(n)</code></td><td>Строка ровно n символов</td><td>Дополняется пробелами</td></tr>
            <tr><td><code>TEXT</code></td><td>Длинный текст</td><td>Без ограничения длины</td></tr>
            <tr><td><code>BOOLEAN</code></td><td>Да / нет</td><td>В MySQL это <code>TINYINT(1)</code>: 0/1</td></tr>
            <tr><td><code>DATE</code>, <code>TIME</code></td><td>Дата, время</td><td>Формат ввода: <code>'2026-03-20'</code></td></tr>
            <tr class="hot"><td><code>TIMESTAMP</code> / <code>TIMESTAMPTZ</code></td><td>Дата и время</td><td>С часовым поясом или без — частый источник багов «±3 часа»</td></tr>
            <tr><td><code>UUID</code>, <code>JSON</code>/<code>JSONB</code></td><td>Идентификаторы, документы</td><td>PostgreSQL: <code>data-&gt;&gt;'key'</code> — значение из JSON</td></tr>
          </tbody>
        </table></div>
        <p class="legend-hot">★ — тут чаще всего ошибаются</p>
      </div></details>

      <details class="section"><summary><span class="badge b-gray">4</span> ALTER и DROP <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">ALTER TABLE users ADD COLUMN phone VARCHAR(20);            -- добавить столбец (у старых строк — NULL)
ALTER TABLE users DROP COLUMN phone;                       -- удалить столбец
ALTER TABLE users RENAME COLUMN name TO full_name;         -- переименовать
ALTER TABLE users ALTER COLUMN age SET NOT NULL;           -- PostgreSQL; упадёт, если уже есть NULL
ALTER TABLE orders ADD CONSTRAINT chk_amount CHECK (amount &gt; 0);
DROP TABLE IF EXISTS tmp_import;                           -- без ошибки, если таблицы нет</pre>
        <div class="qa-block"><p class="qa-title">Для QA</p><ul>
          <li>Проверка ограничений — граничные значения: пустая строка, <code>NULL</code>, строка длиной n и n+1 для <code>VARCHAR(n)</code>, 0 и отрицательные для <code>CHECK (amount &gt; 0)</code>, дубль для <code>UNIQUE</code>.</li>
          <li>Ошибка базы не должна долетать до пользователя как «500 + текст SQL». Ожидается понятное сообщение и корректный код ответа (409 на дубль, 400/422 на невалидные данные).</li>
          <li>Миграции: после <code>ALTER</code> старые данные должны остаться корректными — проверяйте новый столбец у существующих строк.</li>
        </ul></div>
      </div></details>

      <details class="section"><summary><span class="badge b-gray">5</span> Нормализация и связи <span class="chev">▶</span></summary><div class="section-body">
        <p class="note">Нормализация — раскладка данных так, чтобы каждый факт хранился в одном месте. Если имя клиента записано в каждом его заказе, при смене имени придётся править десятки строк, и где-нибудь забудут — данные разойдутся (аномалия обновления).</p>
        <div class="vs-grid">
          <div class="vs-card"><h4>1НФ</h4><p>В ячейке одно значение: не <code>phones = '111, 222'</code>, а отдельная таблица телефонов.</p></div>
          <div class="vs-card"><h4>2НФ</h4><p>1НФ + каждый неключевой столбец зависит от всего составного ключа, а не от его части.</p></div>
          <div class="vs-card"><h4>3НФ</h4><p>2НФ + неключевые столбцы не зависят друг от друга: город клиента — в <code>users</code>, а не в <code>orders</code>.</p></div>
        </div>
        <div class="table-scroll"><table class="tbl">
          <thead><tr><th>Связь</th><th>Пример</th><th>Как устроена</th></tr></thead>
          <tbody>
            <tr><td>Один к одному</td><td>Пользователь — профиль</td><td>FK + <code>UNIQUE</code> во второй таблице</td></tr>
            <tr class="hot"><td>Один ко многим</td><td>Пользователь — заказы</td><td>FK в таблице «многих»: <code>orders.user_id</code></td></tr>
            <tr><td>Многие ко многим</td><td>Заказы — товары</td><td>Связующая таблица <code>order_items(order_id, product_id)</code></td></tr>
          </tbody>
        </table></div>
        <p class="note">Денормализация — сознательное дублирование ради скорости чтения (например, хранить <code>orders_count</code> у пользователя). Тогда появляется риск рассинхрона, и это хорошее место для проверок QA.</p>
      </div></details>
    </div>
  </details>

  <!-- ==================== ИНДЕКСЫ И ТРАНЗАКЦИИ ==================== -->
  <details class="section" id="s-index" data-icon="⚡" data-desc="Индексы, транзакции, ACID, уровни изоляции и аномалии." data-train="Индексы и транзакции">
    <summary><span class="badge b-teal">⚡</span> Индексы и транзакции <span class="chev">▶</span></summary>
    <div class="section-body">

      <details class="section"><summary><span class="badge b-teal">1</span> Индекс — оглавление таблицы <span class="chev">▶</span></summary><div class="section-body">
