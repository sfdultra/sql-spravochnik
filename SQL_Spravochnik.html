        <p class="note">Без индекса поиск <code>WHERE email = 'a@x.ru'</code> — это чтение всей таблицы подряд (full scan), как поиск слова в книге без предметного указателя. Индекс — отсортированная структура (обычно B-дерево), по которой нужная строка находится за несколько шагов даже среди миллионов.</p>
<pre class="code" data-lang="sql">CREATE INDEX idx_orders_user ON orders(user_id);                -- обычный
CREATE UNIQUE INDEX idx_users_email ON users(email);            -- ещё и запрещает дубли
CREATE INDEX idx_orders_user_date ON orders(user_id, created_at); -- составной
DROP INDEX idx_orders_user;</pre>
        <div class="vs-grid">
          <div class="vs-card"><h4>Плюсы</h4><p>Быстрые <code>WHERE</code>, <code>JOIN</code>, <code>ORDER BY</code> по индексированным столбцам. <code>PRIMARY KEY</code> и <code>UNIQUE</code> создают индекс автоматически.</p></div>
          <div class="vs-card"><h4>Минусы</h4><p>Занимают место и замедляют <code>INSERT</code>/<code>UPDATE</code>/<code>DELETE</code>: при каждом изменении индекс тоже нужно обновить. Индексировать всё подряд — плохо.</p></div>
        </div>
        <h3 class="sub">Когда индекс НЕ используется</h3>
        <ul class="checks">
          <li>Функция над столбцом: <code>WHERE LOWER(email) = ...</code>, <code>WHERE YEAR(created_at) = 2026</code> (нужен функциональный индекс или условие-диапазон).</li>
          <li><code>LIKE '%abc'</code> — шаблон начинается с <code>%</code>.</li>
          <li>Составной индекс <code>(user_id, created_at)</code>, а фильтр только по <code>created_at</code> — работает правило «левого префикса».</li>
          <li>Неявное приведение типов: столбец строковый, а сравниваем с числом.</li>
          <li>Маленькая таблица или условие подходит большинству строк — полный просмотр дешевле.</li>
        </ul>
<pre class="code" data-lang="sql">EXPLAIN SELECT * FROM orders WHERE user_id = 1;           -- план: Index Scan или Seq Scan?
EXPLAIN ANALYZE SELECT * FROM orders WHERE user_id = 1;   -- PostgreSQL: выполнить и показать реальное время
EXPLAIN QUERY PLAN SELECT * FROM orders WHERE user_id = 1; -- SQLite</pre>
      </div></details>

      <details class="section"><summary><span class="badge b-teal">2</span> Транзакции и ACID <span class="chev">▶</span></summary><div class="section-body">
        <p class="note">Транзакция — группа операций, которая выполняется целиком или не выполняется вовсе. Классика — перевод денег: списать с одного счёта и зачислить на другой. Если после списания сервер упал, без транзакции деньги просто исчезнут.</p>
<pre class="code" data-lang="sql">BEGIN;                                                    -- START TRANSACTION в MySQL
UPDATE accounts SET balance = balance - 500 WHERE id = 1;
UPDATE accounts SET balance = balance + 500 WHERE id = 2;
COMMIT;                                                   -- зафиксировать оба изменения
-- при ошибке: ROLLBACK;                                  -- отменить всё с момента BEGIN

BEGIN;
INSERT INTO orders ...;
SAVEPOINT sp1;                                            -- точка сохранения
UPDATE ...;
ROLLBACK TO sp1;                                          -- откатить только UPDATE
COMMIT;</pre>
        <div class="table-scroll"><table class="tbl">
          <thead><tr><th>Буква</th><th>Свойство</th><th>Простыми словами</th></tr></thead>
          <tbody>
            <tr><td><b>A</b></td><td>Atomicity — атомарность</td><td>Всё или ничего</td></tr>
            <tr><td><b>C</b></td><td>Consistency — согласованность</td><td>После транзакции все ограничения соблюдены (нет отрицательных балансов, висячих FK)</td></tr>
            <tr><td><b>I</b></td><td>Isolation — изолированность</td><td>Параллельные транзакции не мешают друг другу (насколько — задаёт уровень изоляции)</td></tr>
            <tr><td><b>D</b></td><td>Durability — долговечность</td><td>После <code>COMMIT</code> данные не пропадут даже при отключении питания</td></tr>
          </tbody>
        </table></div>
        <p class="note">Режим автофиксации (autocommit): в большинстве клиентов каждая команда без явного <code>BEGIN</code> сразу фиксируется — откатить её уже нельзя. А вот в некоторых клиентах (Oracle SQL Developer, DBeaver в ручном режиме) наоборот: пока не сделали <code>COMMIT</code>, другие ваших изменений не видят.</p>
      </div></details>

      <details class="section"><summary><span class="badge b-teal">3</span> Уровни изоляции и аномалии <span class="chev">▶</span></summary><div class="section-body">
        <div class="table-scroll"><table class="tbl">
          <thead><tr><th>Уровень</th><th>Грязное чтение</th><th>Неповторяющееся чтение</th><th>Фантомы</th></tr></thead>
          <tbody>
            <tr><td><code>READ UNCOMMITTED</code></td><td class="no">возможно</td><td class="no">возможно</td><td class="no">возможно</td></tr>
            <tr class="hot"><td><code>READ COMMITTED</code> (по умолчанию в PostgreSQL, Oracle, SQL Server)</td><td class="yes">нет</td><td class="no">возможно</td><td class="no">возможно</td></tr>
            <tr><td><code>REPEATABLE READ</code> (по умолчанию в MySQL InnoDB)</td><td class="yes">нет</td><td class="yes">нет</td><td class="mid">возможно по стандарту</td></tr>
            <tr><td><code>SERIALIZABLE</code></td><td class="yes">нет</td><td class="yes">нет</td><td class="yes">нет</td></tr>
          </tbody>
        </table></div>
        <div class="vs-grid">
          <div class="vs-card"><h4>Грязное чтение</h4><p>Видим чужие незафиксированные изменения, а потом их откатили — мы работали с данными, которых «не было».</p></div>
          <div class="vs-card"><h4>Неповторяющееся чтение</h4><p>Прочитали строку дважды в одной транзакции, а между чтениями её изменили и зафиксировали — значения разные.</p></div>
          <div class="vs-card"><h4>Фантомы</h4><p>Повторный <code>SELECT ... WHERE</code> вернул новые строки, которые кто-то вставил между запросами.</p></div>
          <div class="vs-card"><h4>Потерянное обновление</h4><p>Два процесса прочитали баланс 100, каждый прибавил 50 и записал 150 — одно пополнение потеряно. Лечится <code>UPDATE ... SET b = b + 50</code>, <code>SELECT ... FOR UPDATE</code> или версией строки.</p></div>
        </div>
        <p class="note">Взаимоблокировка (deadlock): транзакция A держит строку 1 и ждёт строку 2, транзакция B — наоборот. СУБД обнаруживает цикл и откатывает одну из них с ошибкой.</p>
        <div class="qa-block"><p class="qa-title">Для QA</p><ul>
          <li>Гонки проверяют параллельными запросами: двойной клик «Оплатить», два одновременных списания с одного баланса, покупка последнего товара двумя пользователями.</li>
          <li>Если при ошибке на середине операции часть данных записалась (заказ есть, а оплаты нет) — это баг атомарности.</li>
          <li>Медленный экран → попросите <code>EXPLAIN</code> запроса или проверьте, есть ли индекс по столбцу фильтра.</li>
        </ul></div>
      </div></details>
    </div>
  </details>

  <!-- ==================== ФУНКЦИИ ==================== -->
  <details class="section" id="s-func" data-icon="🧮" data-desc="CASE, строковые функции, даты, числа и приведение типов." data-train="SELECT, WHERE и NULL">
    <summary><span class="badge b-green">f()</span> Функции: CASE, строки, даты, типы <span class="chev">▶</span></summary>
    <div class="section-body">
      <p class="note">Набор встроенных функций сильнее всего отличается между СУБД. Ниже — самое ходовое; если не сработало, ищите аналог для своей базы.</p>

      <details class="section"><summary><span class="badge b-green">1</span> CASE — if/else в запросе <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">SELECT name, age,
  CASE
    WHEN age IS NULL THEN 'неизвестно'
    WHEN age &lt; 30    THEN 'до 30'
    ELSE '30+'
  END AS age_group
FROM users;
-- Анна 28 до 30, Борис 35 30+, Вера NULL неизвестно, Глеб 42 30+, Дина 19 до 30

-- условная агрегация: несколько счётчиков за один проход
SELECT
  COUNT(*)                                          AS all_orders,  -- 6
  SUM(CASE WHEN status = 'paid' THEN 1 ELSE 0 END)  AS paid,        -- 4
  SUM(CASE WHEN status = 'paid' THEN amount END)    AS paid_sum     -- 3400
FROM orders;</pre>
        <p class="note">Ветки проверяются сверху вниз, срабатывает первая истинная. Без <code>ELSE</code> несовпавшие получат <code>NULL</code>. В PostgreSQL условную агрегацию можно записать короче: <code>COUNT(*) FILTER (WHERE status = 'paid')</code>.</p>
      </div></details>

      <details class="section"><summary><span class="badge b-green">2</span> Строки <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">SELECT 'Анна' || ' ' || 'Ли';           -- Анна Ли   (стандарт; MySQL: CONCAT('Анна', ' ', 'Ли'))
SELECT UPPER('qa'), LOWER('QA');        -- QA, qa
SELECT LENGTH('тест');                  -- 4 (MySQL LENGTH считает байты → 8; символы — CHAR_LENGTH)
SELECT TRIM('  hi  ');                  -- 'hi'
SELECT SUBSTR('2026-03-20', 1, 7);      -- 2026-03  (SUBSTRING в PostgreSQL/MySQL/SQL Server)
SELECT REPLACE('a-b-c', '-', '/');      -- a/b/c
SELECT INSTR('qa@mail.ru', '@');        -- 3  (POSITION('@' IN ...) в PostgreSQL)</pre>
      </div></details>

      <details class="section"><summary><span class="badge b-green">3</span> Даты <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">SELECT CURRENT_DATE, CURRENT_TIMESTAMP;              -- везде
SELECT NOW();                                        -- PostgreSQL, MySQL
SELECT created_at + INTERVAL '7 days' FROM orders;   -- PostgreSQL (MySQL: + INTERVAL 7 DAY)
SELECT date(created_at, '+7 days') FROM orders;      -- SQLite
SELECT EXTRACT(YEAR FROM created_at) FROM orders;    -- PostgreSQL/MySQL: 2026
SELECT DATE_TRUNC('month', created_at) FROM orders;  -- PostgreSQL: начало месяца
SELECT strftime('%Y-%m', created_at) AS month, SUM(amount)   -- SQLite: выручка по месяцам
FROM orders GROUP BY month;                          -- 2026-01 | 500, 2026-02 | 2200, 2026-03 | 1700</pre>
        <div class="neg-block"><p class="neg-title">✕ Даты и часовые пояса</p><ol>
          <li>В базе время обычно в UTC, в интерфейсе — местное. Заказ в 01:00 по Москве 1 марта лежит в базе как 22:00 28 февраля и попадёт в февральский отчёт.</li>
          <li>Не сравнивайте даты как строки в разных форматах: <code>'20.03.2026' &gt; '1.04.2026'</code> — строковое сравнение посимвольное. Формат <code>YYYY-MM-DD</code> сортируется правильно.</li>
        </ol></div>
      </div></details>

      <details class="section"><summary><span class="badge b-green">4</span> Числа и приведение типов <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">SELECT 7 / 2;                     -- 3  (целочисленное деление в PostgreSQL, SQLite, SQL Server; в MySQL — 3.5)
SELECT 7 / 2.0;                   -- 3.5
SELECT CAST(7 AS REAL) / 2;       -- 3.5  (стандарт CAST)
SELECT 7::numeric / 2;            -- PostgreSQL-сокращение
SELECT ROUND(733.3333, 2);        -- 733.33
SELECT 7 % 3;                     -- 1   остаток (MOD(7, 3) в Oracle)
SELECT ABS(-5);                   -- 5
SELECT CAST('42' AS INTEGER) + 1; -- 43</pre>
        <p class="note">Целочисленное деление — частый баг процентов: <code>paid_cnt / all_cnt * 100</code> даст 0 вместо 66, потому что 4 / 6 = 0. Умножайте сначала на <code>100.0</code>.</p>
      </div></details>
    </div>
  </details>

  <!-- ==================== SQL ДЛЯ QA ==================== -->
  <details class="section" id="s-qa" data-icon="🧪" data-desc="Проверки после действий, целостность данных, сверка источников, SQL-инъекции." data-train="JOIN, Агрегаты">
    <summary><span class="badge b-orange">QA</span> SQL для тестировщика <span class="chev">▶</span></summary>
    <div class="section-body">
      <p class="note">Готовые запросы, которые закрывают типичные проверки данных. Подставьте свои таблицы и столбцы. Хорошая проверка — запрос, который при отсутствии бага возвращает <b>0 строк</b>: его легко превратить в автотест.</p>

      <details class="section"><summary><span class="badge b-orange">1</span> Проверка после действия <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">-- зарегистрировали пользователя через UI/API — что реально легло в базу?
SELECT id, email, status, created_at
FROM users
WHERE email = 'autotest_42@example.com';

-- последние записи: что создалось за последние минуты
SELECT * FROM orders ORDER BY id DESC LIMIT 10;

-- связанные данные создались все (заказ → позиции → платёж)
SELECT o.id, COUNT(oi.id) AS items, p.status AS payment
FROM orders o
LEFT JOIN order_items oi ON oi.order_id = o.id
LEFT JOIN payments p     ON p.order_id = o.id
WHERE o.id = 1001
GROUP BY o.id, p.status;</pre>
      </div></details>

      <details class="section"><summary><span class="badge b-orange">2</span> Целостность данных <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">-- дубли по полю, которое должно быть уникальным
SELECT email, COUNT(*) FROM users GROUP BY email HAVING COUNT(*) &gt; 1;

-- «сироты»: заказы несуществующих пользователей (если FK не настроен)
SELECT o.* FROM orders o LEFT JOIN users u ON u.id = o.user_id WHERE u.id IS NULL;

-- пустые обязательные поля
SELECT id FROM users WHERE email IS NULL OR TRIM(email) = '';

-- недопустимые значения статусов
SELECT DISTINCT status FROM orders WHERE status NOT IN ('new', 'paid', 'cancelled');

-- нарушение бизнес-правил: оплачен, но без даты оплаты; дата окончания раньше начала
SELECT id FROM orders WHERE status = 'paid' AND paid_at IS NULL;
SELECT id FROM promo WHERE ends_at &lt; starts_at;

-- денормализованный счётчик разошёлся с реальным количеством
SELECT u.id, u.orders_count, COUNT(o.id) AS real_count
FROM users u LEFT JOIN orders o ON o.user_id = u.id
GROUP BY u.id, u.orders_count
HAVING u.orders_count &lt;&gt; COUNT(o.id);</pre>
      </div></details>

      <details class="section"><summary><span class="badge b-orange">3</span> Сверка двух источников <span class="chev">▶</span></summary><div class="section-body">
<pre class="code" data-lang="sql">-- количество и сумма совпадают? (до/после миграции, источник/выгрузка)
SELECT COUNT(*), SUM(amount) FROM orders;
SELECT COUNT(*), SUM(amount) FROM orders_export;

-- какие строки есть в источнике, но не доехали
SELECT id, amount FROM orders
EXCEPT
SELECT id, amount FROM orders_export;</pre>
      </div></details>

      <details class="section"><summary><span class="badge b-orange">4</span> SQL-инъекции <span class="chev">▶</span></summary><div class="section-body">
        <p class="note">SQL-инъекция возникает, когда приложение склеивает запрос из строки пользователя. Ввод становится частью кода запроса и меняет его смысл.</p>
<pre class="code" data-lang="sql">-- приложение делает: "SELECT * FROM users WHERE login = '" + login + "' AND pass = '" + pass + "'"
-- пользователь вводит в логин:   admin' --
SELECT * FROM users WHERE login = 'admin' --' AND pass = '...'
-- всё после -- стало комментарием: вход без пароля

-- ввод:   ' OR '1'='1
SELECT * FROM users WHERE login = '' OR '1'='1' AND pass = '' OR '1'='1'
-- условие истинно для всех строк</pre>
        <div class="vs-grid">
          <div class="vs-card"><h4>Как защищаются</h4><p>Параметризованные запросы (prepared statements): <code>WHERE login = ?</code>, значение передаётся отдельно и никогда не становится кодом. ORM делает это сам.</p></div>
          <div class="vs-card"><h4>Как проверяет QA</h4><p>В поля ввода, параметры URL и JSON — <code>'</code>, <code>"</code>, <code>' OR '1'='1</code>, <code>'; --</code>. Тревожные признаки: ошибка 500 с текстом SQL, изменение выдачи, задержка от <code>pg_sleep(5)</code>/<code>SLEEP(5)</code>.</p></div>
        </div>
        <div class="qa-block"><p class="qa-title">Для QA</p><ul>
          <li>Апостроф в обычных данных (<code>O'Brien</code>, «Д'Артаньян») — законный тест: имя должно сохраниться без ошибки и без искажений.</li>
          <li>Проверяйте инъекции только на своих стендах и в рамках согласованного тестирования безопасности.</li>
        </ul></div>
      </div></details>
    </div>
  </details>

  <!-- ==================== ЛОВУШКИ ==================== -->
  <details class="section" id="s-traps" data-icon="⚠️" data-desc="Частые ошибки в запросах и вопросы с собеседований." data-train="WHERE и NULL, JOIN, Агрегаты">
    <summary><span class="badge b-red">!</span> Ловушки и частые вопросы <span class="chev">▶</span></summary>
    <div class="section-body">
      <div class="table-scroll"><table class="tbl">
        <thead><tr><th>Код</th><th>Результат</th><th>Почему</th></tr></thead>
        <tbody>
          <tr><td><code>WHERE age = NULL</code></td><td>0 строк</td><td>Сравнение с <code>NULL</code> — UNKNOWN. Нужно <code>IS NULL</code></td></tr>
          <tr class="hot"><td><code>WHERE id NOT IN (1, NULL)</code></td><td>0 строк</td><td><code>id &lt;&gt; NULL</code> — UNKNOWN, всё условие не TRUE</td></tr>
          <tr><td><code>WHERE city &lt;&gt; 'Москва'</code></td><td>Без строк с <code>NULL</code></td><td>Для <code>NULL</code> условие UNKNOWN</td></tr>
          <tr><td><code>COUNT(*)</code> vs <code>COUNT(age)</code></td><td>5 и 4</td><td><code>COUNT(col)</code> не считает <code>NULL</code></td></tr>
          <tr><td><code>SUM(amount)</code> по пустому набору</td><td><code>NULL</code></td><td>Не 0 — нужен <code>COALESCE(SUM(...), 0)</code></td></tr>
          <tr><td><code>SELECT 7 / 2</code></td><td>3</td><td>Целочисленное деление (кроме MySQL)</td></tr>
          <tr class="hot"><td><code>LEFT JOIN ... WHERE right.col = 'x'</code></td><td>Как INNER JOIN</td><td>Строки без пары имеют <code>NULL</code> и отсеиваются. Условие — в <code>ON</code></td></tr>
          <tr><td><code>LEFT JOIN</code> + <code>COUNT(*)</code></td><td>1 у тех, у кого 0</td><td>Строка с <code>NULL</code>-ами тоже строка. Считайте <code>COUNT(right.id)</code></td></tr>
          <tr><td>Два <code>JOIN</code> «один ко многим» + <code>SUM</code></td><td>Сумма завышена</td><td>Строки перемножились. Агрегируйте до соединения</td></tr>
          <tr><td><code>WHERE COUNT(*) &gt; 1</code></td><td>Ошибка</td><td>Агрегаты фильтруют в <code>HAVING</code></td></tr>
          <tr><td>Псевдоним в <code>WHERE</code></td><td>Ошибка (PostgreSQL)</td><td><code>WHERE</code> выполняется раньше <code>SELECT</code></td></tr>
          <tr><td><code>LIMIT 10</code> без <code>ORDER BY</code></td><td>Случайные 10 строк</td><td>Порядок строк не гарантирован</td></tr>
          <tr><td><code>UPDATE t SET x = 1</code></td><td>Изменены все строки</td><td>Забыли <code>WHERE</code></td></tr>
          <tr><td><code>'abc' || NULL</code></td><td><code>NULL</code></td><td>Операции с <code>NULL</code> дают <code>NULL</code></td></tr>
          <tr><td><code>BETWEEN '2026-02-01' AND '2026-02-28'</code> по timestamp</td><td>Нет записей 28-го после 00:00</td><td>Верхняя граница = полночь. Используйте <code>&lt; '2026-03-01'</code></td></tr>
        </tbody>
      </table></div>
      <p class="legend-hot">★ — любимые вопросы на собеседованиях</p>

      <h3 class="sub">Вопросы с собеседований</h3>
      <ol class="checks">
        <li><b>Чем WHERE отличается от HAVING?</b> WHERE фильтрует строки до группировки и не может содержать агрегаты; HAVING фильтрует группы после <code>GROUP BY</code>.</li>
        <li><b>Виды JOIN и разница INNER / LEFT?</b> INNER — только совпавшие пары; LEFT — все строки левой таблицы, для несовпавших справа <code>NULL</code>. Есть ещё RIGHT, FULL, CROSS, self join.</li>
        <li><b>DELETE vs TRUNCATE vs DROP?</b> DELETE — строки по условию, построчно, с триггерами; TRUNCATE — быстро все строки; DROP — удаляет таблицу целиком.</li>
        <li><b>Первичный ключ vs уникальный?</b> PK — один на таблицу, не допускает <code>NULL</code>, идентифицирует строку. UNIQUE — сколько угодно, обычно допускает <code>NULL</code>.</li>
        <li><b>Что такое внешний ключ?</b> Столбец, значение которого должно существовать в первичном ключе другой таблицы; обеспечивает ссылочную целостность.</li>
        <li><b>Что такое индекс, плюсы и минусы?</b> Структура для быстрого поиска; ускоряет чтение, замедляет запись и занимает место.</li>
        <li><b>Расшифруйте ACID.</b> Atomicity, Consistency, Isolation, Durability.</li>
        <li><b>UNION vs UNION ALL?</b> UNION убирает дубли (дороже), UNION ALL — нет.</li>
        <li><b>Как найти дубли?</b> <code>GROUP BY поле HAVING COUNT(*) &gt; 1</code>.</li>
        <li><b>Вторая по величине зарплата?</b> <code>SELECT MAX(salary) FROM emp WHERE salary &lt; (SELECT MAX(salary) FROM emp)</code> или <code>DENSE_RANK() = 2</code>.</li>
        <li><b>Как найти пользователей без заказов?</b> <code>LEFT JOIN ... WHERE o.id IS NULL</code> или <code>NOT EXISTS</code>; осторожно с <code>NOT IN</code> и <code>NULL</code>.</li>
        <li><b>Порядок выполнения SELECT?</b> FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → DISTINCT → ORDER BY → LIMIT.</li>
        <li><b>Что такое нормализация?</b> Раскладка данных по таблицам без дублирования фактов; 1НФ — атомарные значения, 2НФ — зависимость от всего ключа, 3НФ — нет зависимостей между неключевыми полями.</li>
        <li><b>Чем оконная функция отличается от GROUP BY?</b> Оконная не схлопывает строки: каждая строка остаётся и получает вычисленное по окну значение.</li>
        <li><b>Что такое транзакция и уровни изоляции?</b> Группа операций «всё или ничего»; уровни — READ UNCOMMITTED, READ COMMITTED, REPEATABLE READ, SERIALIZABLE — от слабой к полной изоляции.</li>
        <li><b>Как проверить, что данные из UI сохранились верно?</b> Найти запись по уникальному признаку, сверить каждое поле, связанные таблицы, типы, часовой пояс и отсутствие дублей.</li>
      </ol>
    </div>
  </details>

  { k: 'DDL', t: 'Data Definition Language — определение структуры', d: 'CREATE, ALTER, DROP, TRUNCATE — создают и меняют таблицы, индексы, схемы.' },
  { k: 'DCL', t: 'Data Control Language — управление доступом', d: 'GRANT и REVOKE — выдать или отозвать права.', ex: 'GRANT SELECT ON orders TO qa_user;' },
  { k: 'TCL', t: 'Transaction Control Language — управление транзакциями', d: 'BEGIN, COMMIT, ROLLBACK, SAVEPOINT.' },
  { k: 'псевдоним', t: 'Alias — временное имя столбца или таблицы', d: 'Задаётся через AS. Действует только в этом запросе.', ex: 'SELECT u.name AS user_name FROM users u;', re: '[Пп]севдоним(?:а|ы|ов|ом|ами|ах|е|у)?(?![а-яё])|alias' },
  { k: 'NULL', t: 'Отсутствие значения, «неизвестно»', d: 'Не 0 и не пустая строка. Любое сравнение с NULL даёт UNKNOWN, поэтому проверяют через IS NULL.', ex: 'WHERE age IS NULL' },
  { k: 'UNKNOWN', t: 'Третье логическое значение', d: 'Результат сравнения с NULL. WHERE пропускает только TRUE, поэтому строки с UNKNOWN отбрасываются.' },
  { k: 'трёхзначная логика', t: 'TRUE / FALSE / UNKNOWN', d: 'Логика SQL с учётом NULL: FALSE AND NULL = FALSE, TRUE OR NULL = TRUE, остальное с NULL — UNKNOWN.', re: '[Тт]р[её]хзначн[а-яё]{2,3} логик[а-яё]{1,2}' },

  // ---- SELECT ----
  { k: 'SELECT', t: 'Выбрать данные', d: 'Главная команда чтения. Логически выполняется после FROM, WHERE, GROUP BY и HAVING.' },
  { k: 'DISTINCT', t: 'Убрать повторяющиеся строки', d: 'Применяется ко всей строке результата. С агрегатом: COUNT(DISTINCT col).' },
  { k: 'ORDER BY', t: 'Сортировка результата', d: 'ASC — по возрастанию (по умолчанию), DESC — по убыванию. Без него порядок строк не гарантирован.' },
  { k: 'LIMIT', t: 'Ограничить число строк', d: 'Вместе с OFFSET — для пагинации. В SQL Server — TOP, в стандарте — FETCH FIRST n ROWS ONLY.' },
  { k: 'OFFSET', t: 'Пропустить первые N строк', d: 'Для страниц: страница k по n строк = LIMIT n OFFSET (k-1)*n. На больших смещениях медленно.' },
  { k: 'пагинация', t: 'Pagination — постраничная выдача', d: 'Обычно через LIMIT/OFFSET. Нужен устойчивый ORDER BY с уникальным полем, иначе строки дублируются между страницами.', re: '[Пп]агинаци[а-яё]{1,2}' },
  { k: 'full scan', t: 'Полный просмотр таблицы', d: 'Чтение всех строк подряд, когда нет подходящего индекса. В плане PostgreSQL — Seq Scan.' },

  // ---- WHERE ----
  { k: 'WHERE', t: 'Фильтр строк', d: 'Оставляет строки, для которых условие TRUE. Выполняется до группировки, агрегаты в нём нельзя.' },
  { k: 'BETWEEN', t: 'Значение в диапазоне, границы включены', d: 'a BETWEEN 1 AND 5 ≡ a >= 1 AND a <= 5. Осторожно с датами со временем.' },
  { k: 'IN', t: 'Значение из списка', d: 'Короткая запись нескольких OR. Список может быть подзапросом.', ex: "WHERE status IN ('new', 'paid')" },
  { k: 'LIKE', t: 'Сравнение с шаблоном', d: '% — любое число символов, _ — ровно один символ. Регистрозависимость зависит от СУБД.', ex: "WHERE name LIKE 'А%'" },
  { k: 'ILIKE', t: 'LIKE без учёта регистра (PostgreSQL)', d: "Только в PostgreSQL. Универсальная замена: LOWER(col) LIKE '...'" },
  { k: 'COALESCE', t: 'Первое не-NULL значение', d: 'Подставляет значение по умолчанию вместо NULL. Аналоги: IFNULL, ISNULL, NVL.', ex: "COALESCE(city, 'не указан')" },
  { k: 'NULLIF', t: 'NULL, если два значения равны', d: 'Часто — защита от деления на ноль: x / NULLIF(y, 0).' },

  // ---- агрегаты ----
  { k: 'агрегатная функция', t: 'Aggregate — сворачивает много строк в одно значение', d: 'COUNT, SUM, AVG, MIN, MAX. Все, кроме COUNT(*), пропускают NULL.', re: '[Аа]грегатн[а-яё]{2,3} функци[а-яё]{1,2}|[Аа]грегат(?:а|ы|ов|ом|ами|ах|е|у)?(?![а-яё])' },
  { k: 'COUNT', t: 'Количество', d: 'COUNT(*) — строки; COUNT(col) — не-NULL значения; COUNT(DISTINCT col) — разные не-NULL значения.' },
  { k: 'SUM', t: 'Сумма', d: 'Пропускает NULL. На пустом наборе возвращает NULL, а не 0.' },
  { k: 'AVG', t: 'Среднее арифметическое', d: 'Пропускает NULL: делит на число непустых значений, а не на число строк.' },
  { k: 'GROUP BY', t: 'Группировка строк', d: 'Делит строки на группы по значениям столбцов; агрегаты считаются для каждой группы. В SELECT — только столбцы группировки и агрегаты.' },
  { k: 'HAVING', t: 'Фильтр групп', d: 'Как WHERE, но после GROUP BY и с агрегатами.', ex: 'HAVING COUNT(*) > 1' },
  { k: 'CASE', t: 'Условное выражение в запросе', d: 'Аналог if/else: CASE WHEN условие THEN значение ... ELSE ... END. Удобен для условной агрегации.' },
  { k: 'условная агрегация', t: 'Агрегат по части строк через CASE', d: 'Несколько счётчиков за один проход: SUM(CASE WHEN status = \'paid\' THEN 1 ELSE 0 END).', re: '[Уу]словн[а-яё]{2,3} агрегаци[а-яё]{1,2}' },

  // ---- JOIN ----
  { k: 'JOIN', t: 'Соединение таблиц', d: 'Склеивает строки двух таблиц по условию в ON. Без уточнения — это INNER JOIN.' },
  { k: 'INNER JOIN', t: 'Внутреннее соединение', d: 'Только пары строк, для которых условие ON выполнено. Строки без пары пропадают.' },
  { k: 'LEFT JOIN', t: 'Левое внешнее соединение', d: 'Все строки левой таблицы; если пары справа нет — столбцы правой равны NULL.' },
  { k: 'RIGHT JOIN', t: 'Правое внешнее соединение', d: 'Зеркало LEFT JOIN. Обычно переписывают как LEFT, поменяв таблицы местами.' },
  { k: 'FULL JOIN', t: 'Полное внешнее соединение', d: 'Все строки обеих таблиц; где пары нет — NULL. В MySQL нет, эмулируют через UNION двух LEFT JOIN.' },
  { k: 'CROSS JOIN', t: 'Декартово произведение', d: 'Каждая строка с каждой: 5 × 6 = 30 строк. Случайно получается, если забыть условие соединения.' },
  { k: 'self join', t: 'Соединение таблицы с самой собой', d: 'Через два псевдонима одной таблицы: сотрудник и руководитель, пары из одного города.', re: '[Ss]elf[ -]join' },
  { k: 'анти-соединение', t: 'Anti-join — строки без пары', d: 'LEFT JOIN ... WHERE right.id IS NULL или NOT EXISTS: пользователи без заказов.', re: '[Аа]нти-соединени[а-яё]{1,2}|anti-join' },
  { k: 'декартово произведение', t: 'Все комбинации строк двух таблиц', d: 'Результат CROSS JOIN: N × M строк.', re: '[Дд]екартов[а-яё]{0,2} произведени[а-яё]{1,2}' },
  { k: 'UNION', t: 'Объединение результатов с удалением дублей', d: 'Складывает строки двух запросов «вниз». UNION ALL — без удаления дублей и быстрее.' },
  { k: 'UNION ALL', t: 'Объединение без удаления дублей', d: 'Просто склеивает результаты. Быстрее UNION, потому что не сортирует и не сравнивает строки.' },
  { k: 'EXCEPT', t: 'Разность множеств', d: 'Строки первого запроса, которых нет во втором. В Oracle — MINUS. Удобно для сверки данных.' },
  { k: 'INTERSECT', t: 'Пересечение множеств', d: 'Строки, которые есть в результатах обоих запросов.' },

  // ---- подзапросы ----
  { k: 'подзапрос', t: 'Subquery — запрос внутри запроса', d: 'Пишется в скобках в WHERE, SELECT или FROM. Может вернуть значение, список или таблицу.', re: '[Пп]одзапрос(?:а|ы|ов|ом|ами|ах|е|у)?(?![а-яё])' },
  { k: 'скалярный подзапрос', t: 'Подзапрос, возвращающий одно значение', d: 'Одна строка и один столбец. Несколько строк — ошибка, ноль — NULL.', re: '[Сс]калярн[а-яё]{2,3} подзапрос[а-яё]{0,3}' },
  { k: 'коррелированный подзапрос', t: 'Подзапрос, зависящий от внешней строки', d: 'Ссылается на столбцы внешнего запроса и логически выполняется для каждой его строки.', re: '[Кк]оррелированн[а-яё]{2,3}(?: подзапрос[а-яё]{0,3})?' },
  { k: 'EXISTS', t: 'Есть ли хотя бы одна строка', d: 'Возвращает TRUE, если подзапрос вернул строку. Останавливается на первой найденной. NOT EXISTS безопасен при NULL.' },
  { k: 'NOT IN', t: 'Значение не из списка', d: 'Ловушка: если в списке есть NULL, условие никогда не TRUE и запрос возвращает 0 строк.' },
  { k: 'производная таблица', t: 'Derived table — подзапрос в FROM', d: 'Подзапрос, который используется как таблица. Обычно требует псевдоним.', re: '[Пп]роизводн[а-яё]{2,3} таблиц[а-яё]{0,3}' },
  { k: 'CTE', t: 'Common Table Expression — обобщённое табличное выражение', d: 'Именованный подзапрос в начале запроса через WITH. Делает сложные запросы читаемыми.', ex: 'WITH t AS (SELECT ...) SELECT * FROM t;' },
  { k: 'WITH RECURSIVE', t: 'Рекурсивное CTE', d: 'Якорная часть + шаг через UNION ALL. Для деревьев и последовательностей. Нужно условие остановки.' },

  // ---- окна ----
  { k: 'оконная функция', t: 'Window function — вычисление по окну строк', d: 'Считает по группе строк, но не сворачивает их: каждая строка остаётся. Пишется с OVER(...).', re: '[Оо]конн[а-яё]{2,3} функци[а-яё]{1,3}' },
  { k: 'OVER', t: 'Задаёт окно для оконной функции', d: 'OVER (PARTITION BY ... ORDER BY ...). Пустые скобки — вся выборка одно окно.' },
  { k: 'PARTITION BY', t: 'Разбиение окна на группы', d: 'Как GROUP BY, но для окна: функция считается отдельно внутри каждой группы, строки не схлопываются.' },
  { k: 'ROW_NUMBER', t: 'Порядковый номер строки в окне', d: '1, 2, 3… без повторов. Классика: «топ-1 в каждой группе» через WHERE rn = 1.' },
  { k: 'RANK', t: 'Ранг с пропусками', d: 'Равным значениям — одинаковое место, следующие пропускаются: 1, 2, 2, 4.' },
  { k: 'DENSE_RANK', t: 'Ранг без пропусков', d: '1, 2, 2, 3. Подходит для задачи «N-я по величине зарплата».' },
  { k: 'LAG', t: 'Значение из предыдущей строки окна', d: 'LAG(col, n, default). Для сравнения с прошлым периодом. LEAD — из следующей строки.' },
  { k: 'накопительный итог', t: 'Running total — сумма с начала до текущей строки', d: 'SUM(amount) OVER (ORDER BY date).', re: '[Нн]акопительн[а-яё]{2,3} итог[а-яё]{0,2}' },

  // ---- DML ----
  { k: 'INSERT', t: 'Вставить строки', d: 'INSERT INTO t (cols) VALUES (...). Можно вставить результат SELECT.' },
  { k: 'UPDATE', t: 'Изменить строки', d: 'Без WHERE меняет всю таблицу. Перед запуском проверьте условие через SELECT.' },
  { k: 'DELETE', t: 'Удалить строки', d: 'Построчно, по условию, срабатывают триггеры, можно откатить в транзакции.' },
  { k: 'TRUNCATE', t: 'Быстро очистить таблицу', d: 'Удаляет все строки сразу, без WHERE и триггеров; обычно сбрасывает автоинкремент. Относится к DDL.' },
  { k: 'DROP', t: 'Удалить объект базы', d: 'DROP TABLE удаляет таблицу целиком вместе со структурой и данными.' },
  { k: 'RETURNING', t: 'Вернуть значения изменённых строк', d: 'PostgreSQL/SQLite: INSERT ... RETURNING id — сразу получить сгенерированный id.' },
  { k: 'UPSERT', t: 'Вставить или обновить', d: 'Если строка с таким ключом есть — обновить, иначе вставить. ON CONFLICT (PostgreSQL), ON DUPLICATE KEY (MySQL), MERGE.' },
  { k: 'мягкое удаление', t: 'Soft delete — пометка вместо удаления', d: 'Ставят deleted_at или is_deleted, запросы фильтруют такие строки. Данные можно восстановить.', re: '[Мм]ягк[а-яё]{2,3} удалени[а-яё]{1,2}|soft delete' },
  { k: 'триггер', t: 'Trigger — код, который база выполняет на событие', d: 'Например, при DELETE записать строку в журнал. TRUNCATE триггеры удаления не вызывает.', re: '[Тт]риггер(?:а|ы|ов|ом|ами|ах|е|у)?(?![а-яё])' },
  { k: 'идемпотентность', t: 'Повтор операции не меняет результат', d: 'Повторная отправка того же запроса не должна создать дубль. Помогают UNIQUE и UPSERT.', re: '[Ии]демпотентност[а-яё]{1,2}' },

  // ---- DDL ----
  { k: 'ограничение', t: 'Constraint — правило для данных', d: 'PRIMARY KEY, FOREIGN KEY, UNIQUE, NOT NULL, CHECK. База отклоняет данные, нарушающие правило.', re: '[Оо]граничени(?:е|я|й|ю|ем|ями|ях)(?![а-яё])|constraints?' },
  { k: 'первичный ключ', t: 'Primary key, PK — идентификатор строки', d: 'Уникален и не NULL. Один на таблицу (может быть составным). Автоматически создаёт индекс.', re: '[Пп]ервичн[а-яё]{2,3} ключ[а-яё]{0,3}|PRIMARY KEY' },
  { k: 'внешний ключ', t: 'Foreign key, FK — ссылка на строку другой таблицы', d: 'Значение должно существовать в PK другой таблицы. Обеспечивает ссылочную целостность.', re: '[Вв]нешн[а-яё]{2,3} ключ[а-яё]{0,3}|FOREIGN KEY' },
  { k: 'UNIQUE', t: 'Ограничение уникальности', d: 'Запрещает повторы значений. В большинстве СУБД допускает несколько NULL.' },
  { k: 'NOT NULL', t: 'Значение обязательно', d: 'Запрещает NULL в столбце.' },
  { k: 'CHECK', t: 'Проверка условия для значения', d: 'Например, CHECK (amount > 0). Строка, нарушающая условие, не запишется.' },
  { k: 'DEFAULT', t: 'Значение по умолчанию', d: 'Подставляется, если столбец не указан в INSERT.' },
  { k: 'ON DELETE CASCADE', t: 'Каскадное удаление', d: 'При удалении родительской строки удаляются и дочерние (заказы вместе с пользователем).' },
  { k: 'автоинкремент', t: 'Автоматически растущий id', d: 'SERIAL/IDENTITY в PostgreSQL, AUTO_INCREMENT в MySQL. Номера могут идти с пропусками после откатов и удалений.', re: '[Аа]втоинкремент[а-яё]{0,3}' },
  { k: 'суррогатный ключ', t: 'Искусственный id без бизнес-смысла', d: 'Число или UUID. Не меняется, в отличие от естественных ключей вроде email или телефона.', re: '[Сс]уррогатн[а-яё]{2,3}(?: ключ[а-яё]{0,3})?' },
  { k: 'ссылочная целостность', t: 'Referential integrity', d: 'Все ссылки FK указывают на существующие строки — нет «сирот».', re: '[Сс]сылочн[а-яё]{2,3} целостност[а-яё]{1,2}' },
  { k: 'сирота', t: 'Orphan — запись без родителя', d: 'Например, заказ с user_id, которого нет в users. Появляется, когда нет FK или его обошли.', re: '[Сс]ирот(?:а|ы|у|ой|ам|ами|ах)?(?![а-яё])' },
  { k: 'NUMERIC', t: 'Точное десятичное число', d: 'NUMERIC(p, s) / DECIMAL: p цифр всего, s после запятой. Для денег — только он, не FLOAT.' },
  { k: 'VARCHAR', t: 'Строка переменной длины', d: 'VARCHAR(n) — до n символов. Граница n и n+1 — хороший тест.' },
  { k: 'TIMESTAMP', t: 'Дата и время', d: 'TIMESTAMP — без часового пояса, TIMESTAMPTZ (PostgreSQL) — с ним. Источник багов «сдвиг на 3 часа».' },
  { k: 'ALTER TABLE', t: 'Изменение структуры таблицы', d: 'Добавить, удалить, переименовать столбец, добавить ограничение.' },
  { k: 'миграция', t: 'Migration — версионированное изменение схемы', d: 'Скрипт ALTER/CREATE, который выкатывается вместе с релизом. Проверяют на копии реальных данных.', re: '[Мм]играци(?:я|и|ю|ей|ям|ями|ях)(?![а-яё])' },
  { k: 'нормализация', t: 'Раскладка данных без дублирования фактов', d: 'Каждый факт хранится в одном месте. Нормальные формы 1НФ, 2НФ, 3НФ.', re: '[Нн]ормализаци[а-яё]{1,2}' },
  { k: 'денормализация', t: 'Сознательное дублирование данных', d: 'Ради скорости чтения: например, счётчик заказов у пользователя. Риск рассинхрона.', re: '[Дд]енормализаци[а-яё]{1,2}' },
  { k: 'многие ко многим', t: 'Связь M:N', d: 'Реализуется связующей таблицей с двумя внешними ключами, например order_items(order_id, product_id).', re: '[Мм]ногие ко многим' },
  { k: 'связующая таблица', t: 'Junction table для связи многие ко многим', d: 'Содержит пары внешних ключей двух таблиц.', re: '[Сс]вязующ[а-яё]{2,3} таблиц[а-яё]{0,3}' },

  // ---- индексы, транзакции ----
  { k: 'индекс', t: 'Index — структура для быстрого поиска', d: 'Обычно B-дерево. Ускоряет WHERE/JOIN/ORDER BY, но замедляет запись и занимает место.', ex: 'CREATE INDEX idx_orders_user ON orders(user_id);', re: '[Ии]ндекс(?:а|ы|ов|ом|ами|ах|е|у)?(?![а-яё])' },
  { k: 'B-дерево', t: 'B-tree — сбалансированное дерево поиска', d: 'Основная структура индексов: поиск, диапазоны и сортировка за логарифмическое число шагов.', re: 'B-дерев[а-яё]{1,2}|B-tree' },
  { k: 'составной индекс', t: 'Индекс по нескольким столбцам', d: 'Работает по правилу левого префикса: индекс (a, b) помогает фильтру по a или по a и b, но не по одному b.', re: '[Сс]оставн[а-яё]{2,3} индекс[а-яё]{0,3}' },
  { k: 'EXPLAIN', t: 'Показать план выполнения запроса', d: 'Видно, используется ли индекс (Index Scan) или полный просмотр (Seq Scan). EXPLAIN ANALYZE — с реальным временем.' },
  { k: 'транзакция', t: 'Transaction — группа операций «всё или ничего»', d: 'BEGIN … COMMIT фиксирует, ROLLBACK отменяет. Свойства описывает ACID.', re: '[Тт]ранзакци(?:я|и|ю|ей|ям|ями|ях)(?![а-яё])' },
  { k: 'COMMIT', t: 'Зафиксировать транзакцию', d: 'После COMMIT изменения видны другим и сохраняются надёжно.' },

  { t: 'SELECT', q: 'Что гарантирует запрос `SELECT * FROM orders LIMIT 5` без ORDER BY?',
    o: ['Вернутся какие-то 5 строк, порядок не определён', 'Вернутся 5 первых добавленных строк', 'Вернутся 5 строк с наименьшим id', 'Запрос выдаст ошибку без ORDER BY'], a: 0, e: 'Без ORDER BY порядок строк не гарантирован — тест, опирающийся на него, будет нестабилен.' },
  { t: 'SELECT', q: 'Какие кавычки используются для строковых значений в стандартном SQL?',
    o: ["Одинарные: 'Москва'", 'Двойные: "Москва"', 'Обратные: `Москва`', 'Любые — без разницы'], a: 0, e: 'Двойные кавычки по стандарту — для имён (идентификаторов), например "order". В MySQL двойные иногда работают для строк, но это не переносимо.' },

  { t: 'WHERE и NULL', q: 'Сколько строк вернёт запрос?', code: 'SELECT name FROM users WHERE age = NULL;',
    o: ['0', '1', '5', 'Ошибку синтаксиса'], a: 0, e: 'Сравнение с NULL даёт UNKNOWN, WHERE его отбрасывает. Нужно IS NULL.' },
  { t: 'WHERE и NULL', q: 'Кого вернёт запрос?', code: "SELECT name FROM users WHERE city <> 'Москва';",
    o: ['Борис, Глеб', 'Борис, Глеб, Дина', 'Анна, Вера', 'Всех, кроме Анны'], a: 0, e: 'У Дины city IS NULL: NULL <> \'Москва\' — UNKNOWN, строка отброшена.' },
  { t: 'WHERE и NULL', q: 'Кого вернёт запрос?', code: "SELECT name FROM users\nWHERE age > 30 OR city = 'Москва' AND age < 30;",
    o: ['Анна, Борис, Глеб', 'Анна', 'Борис, Глеб', 'Анна, Вера, Борис, Глеб'], a: 0, e: 'AND приоритетнее: age > 30 OR (Москва AND age < 30). Вера не попала: age NULL.' },
  { t: 'WHERE и NULL', q: 'Кого вернёт запрос?', code: 'SELECT name FROM users WHERE age BETWEEN 19 AND 35;',
    o: ['Анна, Борис, Дина', 'Анна', 'Анна, Борис', 'Анна, Дина'], a: 0, e: 'Границы BETWEEN включены: 19 (Дина) и 35 (Борис) попадают.' },
  { t: 'WHERE и NULL', q: 'Кого вернёт запрос?', code: "SELECT name FROM users WHERE name LIKE '_ера';",

  { t: 'WHERE и NULL', q: 'Сколько строк вернёт запрос?', code: "SELECT name FROM users WHERE name LIKE '%а';",
    o: ['3', '1', '4', '5'], a: 0, e: 'Анна, Вера, Дина. % — любое число символов, включая ноль.' },
  { t: 'WHERE и NULL', q: 'Сколько строк вернёт запрос?', code: 'SELECT name FROM users WHERE id NOT IN (1, 2, NULL);',
    o: ['0', '3', '5', '2'], a: 0, e: 'id NOT IN (1, 2, NULL) ≡ id<>1 AND id<>2 AND id<>NULL. Последнее — UNKNOWN, поэтому условие никогда не TRUE.' },
  { t: 'WHERE и NULL', q: 'Что вернёт выражение?', code: "SELECT COALESCE(NULL, NULL, 'x', 'y');",
    o: ['x', 'NULL', 'y', 'xy'], a: 0, e: 'COALESCE возвращает первый не-NULL аргумент.' },
  { t: 'WHERE и NULL', q: 'Чему равно `TRUE OR NULL`?',
    o: ['TRUE', 'NULL', 'FALSE', 'Ошибка'], a: 0, e: 'Если один операнд OR истинен, результат точно TRUE, каким бы ни было неизвестное.' },
  { t: 'WHERE и NULL', q: 'Чему равно `FALSE AND NULL`?',
    o: ['FALSE', 'NULL', 'TRUE', 'Ошибка'], a: 0, e: 'Если один операнд AND ложен, результат точно FALSE.' },
  { t: 'WHERE и NULL', q: 'Что вернёт выражение?', code: 'SELECT NULLIF(5, 5);',
    o: ['NULL', '5', '0', 'TRUE'], a: 0, e: 'NULLIF возвращает NULL, если аргументы равны, иначе первый аргумент.' },
  { t: 'WHERE и NULL', q: 'Столбец created_at — TIMESTAMP. Какое условие надёжно выберет все записи за февраль 2026?',
    o: ["created_at >= '2026-02-01' AND created_at < '2026-03-01'", "created_at BETWEEN '2026-02-01' AND '2026-02-28'", "created_at LIKE '2026-02'", "created_at = '2026-02'"], a: 0, e: 'BETWEEN до \'2026-02-28\' означает полночь 28-го: всё, что позже 00:00 28 февраля, потеряется. Полуинтервал надёжен.' },
  { t: 'WHERE и NULL', q: 'Чем NULL отличается от пустой строки \'\' (в большинстве СУБД)?',
    o: ['NULL — значения нет, \'\' — есть пустое значение', 'Ничем, это синонимы', '\'\' нельзя хранить в VARCHAR', 'NULL — это строка из нуля символов'], a: 0, e: '\'\' = \'\' → TRUE, а NULL = NULL → UNKNOWN. Исключение — Oracle, где \'\' считается NULL.' },

  // ---- Агрегаты ----
  { t: 'Агрегаты', q: 'Что вернёт запрос?', code: 'SELECT COUNT(*), COUNT(age) FROM users;',
    o: ['5, 4', '5, 5', '4, 4', '4, 5'], a: 0, e: 'COUNT(*) считает строки, COUNT(age) — только не-NULL значения (у Веры NULL).' },
  { t: 'Агрегаты', q: 'Что вернёт запрос?', code: 'SELECT AVG(age) FROM users;',
    o: ['31', '24.8', 'NULL', '28'], a: 0, e: 'AVG пропускает NULL: (28 + 35 + 42 + 19) / 4 = 124 / 4 = 31.' },
  { t: 'Агрегаты', q: 'Что вернёт запрос?', code: "SELECT SUM(amount) FROM orders WHERE status = 'refunded';",
    o: ['NULL', '0', '0 строк', 'Ошибку'], a: 0, e: 'Подходящих строк нет; агрегат без GROUP BY всё равно возвращает одну строку, а SUM пустого набора — NULL.' },
  { t: 'Агрегаты', q: 'Что вернёт запрос?', code: 'SELECT COUNT(DISTINCT city) FROM users;',
    o: ['3', '4', '5', '2'], a: 0, e: 'Москва, СПб, Казань. NULL в COUNT(DISTINCT ...) не считается.' },
  { t: 'Агрегаты', q: 'Сколько строк вернёт запрос?', code: 'SELECT status, COUNT(*) FROM orders GROUP BY status;',
    o: ['3', '6', '1', '4'], a: 0, e: 'Три группы: paid (4), new (1), cancelled (1).' },
  { t: 'Агрегаты', q: 'Какие user_id вернёт запрос?', code: "SELECT user_id FROM orders\nWHERE status = 'paid'\nGROUP BY user_id\nHAVING SUM(amount) > 1000;",
    o: ['1 и 4', 'Только 1', '1, 2 и 4', '1 и 2'], a: 0, e: 'Оплачено: 1 → 2000, 2 → 200, 4 → 1200. Больше 1000 — у 1 и 4.' },
  { t: 'Агрегаты', q: 'Почему запрос не сработает?', code: 'SELECT user_id FROM orders\nWHERE COUNT(*) > 1\nGROUP BY user_id;',
    o: ['Агрегаты нельзя писать в WHERE — нужен HAVING', 'WHERE должен идти после GROUP BY', 'COUNT(*) нужно заменить на COUNT(id)', 'Нужен ORDER BY'], a: 0, e: 'WHERE фильтрует строки до группировки, когда агрегатов ещё нет.' },
  { t: 'Агрегаты', q: 'Что выдаст PostgreSQL на этот запрос?', code: 'SELECT status, amount, COUNT(*)\nFROM orders GROUP BY status;',
    o: ['Ошибку: amount должен быть в GROUP BY или в агрегате', 'Случайный amount из каждой группы', 'Максимальный amount в группе', 'Все amount через запятую'], a: 0, e: 'В группе paid четыре разных amount — неясно, какой показать. MySQL (без ONLY_FULL_GROUP_BY) и SQLite вернут произвольный — тихий баг.' },
  { t: 'Агрегаты', q: 'Что вернёт запрос?', code: "SELECT SUM(CASE WHEN status = 'paid' THEN 1 ELSE 0 END) FROM orders;",
    o: ['4', '6', '3400', '1'], a: 0, e: 'Условная агрегация: каждая оплаченная строка даёт 1. Оплачено 4 заказа.' },
  { t: 'Агрегаты', q: 'Какой запрос найдёт повторяющиеся email?',
    o: ['SELECT email FROM users GROUP BY email HAVING COUNT(*) > 1', 'SELECT DISTINCT email FROM users', 'SELECT email FROM users WHERE COUNT(email) > 1', 'SELECT email, COUNT(*) FROM users'], a: 0, e: 'Группируем по email и оставляем группы больше одной строки. DISTINCT, наоборот, прячет дубли.' },
  { t: 'Агрегаты', q: 'Что вернёт запрос?', code: 'SELECT city, COUNT(*) FROM users\nWHERE city IS NULL GROUP BY city;',
    o: ['Одну строку: NULL | 1', '0 строк', 'Ошибку', 'Одну строку: NULL | 0'], a: 0, e: 'NULL-значения объединяются в одну группу; у Дины city = NULL.' },

  // ---- JOIN ----
  { t: 'JOIN', q: 'Сколько строк вернёт запрос?', code: 'SELECT u.name, o.id\nFROM users u\nJOIN orders o ON o.user_id = u.id;',
    o: ['6', '5', '8', '30'], a: 0, e: 'INNER JOIN — только пары: по строке на каждый из 6 заказов. Вера и Дина пропадают.' },
  { t: 'JOIN', q: 'Сколько строк вернёт запрос?', code: 'SELECT u.name, o.id\nFROM users u\nLEFT JOIN orders o ON o.user_id = u.id;',
    o: ['8', '6', '5', '11'], a: 0, e: '6 строк с заказами + Вера и Дина с NULL вместо заказа.' },
  { t: 'JOIN', q: 'Сколько строк вернёт запрос?', code: 'SELECT * FROM users CROSS JOIN orders;',
    o: ['30', '11', '6', '5'], a: 0, e: 'Декартово произведение: 5 × 6.' },
  { t: 'JOIN', q: 'Кого вернёт запрос?', code: 'SELECT u.name FROM users u\nLEFT JOIN orders o ON o.user_id = u.id\nWHERE o.id IS NULL;',
    o: ['Вера, Дина', 'Никого', 'Всех пользователей', 'Анна, Борис, Глеб'], a: 0, e: 'Анти-соединение: оставляем строки, для которых пары справа не нашлось.' },
  { t: 'JOIN', q: 'Сколько строк вернёт запрос?', code: "SELECT u.name, o.amount FROM users u\nLEFT JOIN orders o ON o.user_id = u.id\nWHERE o.status = 'paid';",
    o: ['4', '6', '5', '8'], a: 0, e: 'Условие на правую таблицу в WHERE отсеяло строки с NULL — LEFT JOIN превратился в INNER. Остались 4 оплаченных заказа.' },
  { t: 'JOIN', q: 'Сколько строк вернёт запрос?', code: "SELECT u.name, o.amount FROM users u\nLEFT JOIN orders o ON o.user_id = u.id AND o.status = 'paid';",
    o: ['6', '4', '8', '5'], a: 0, e: 'Условие в ON: 4 оплаченных заказа (Анна ×2, Борис, Глеб) + Вера и Дина с NULL. Все пользователи сохранены.' },
  { t: 'JOIN', q: 'Что вернёт запрос для Веры?', code: "SELECT u.name, COUNT(*) FROM users u\nLEFT JOIN orders o ON o.user_id = u.id\nWHERE u.name = 'Вера'\nGROUP BY u.name;",
    o: ['Вера | 1', 'Вера | 0', 'Вера | NULL', '0 строк'], a: 0, e: 'Строка с NULL-ами из LEFT JOIN — всё равно строка. Чтобы получить 0, считают COUNT(o.id).' },
  { t: 'JOIN', q: 'Что вернёт запрос?', code: 'SELECT a.name, b.name\nFROM users a JOIN users b\n  ON a.city = b.city AND a.id < b.id;',
    o: ['Анна | Вера', 'Анна | Анна, Вера | Вера', 'Анна | Вера, Вера | Анна', '0 строк'], a: 0, e: 'Self join: в одном городе только Анна и Вера (Москва). a.id < b.id убирает зеркальную пару и пары «сам с собой».' },
  { t: 'JOIN', q: 'У пользователя 2 заказа и 3 адреса. Сколько строк даст users JOIN orders JOIN addresses для него?',
    o: ['6', '5', '3', '2'], a: 0, e: 'Две связи «один ко многим» перемножаются: 2 × 3. SUM(amount) по такому результату завысится втрое.' },
  { t: 'JOIN', q: 'Что вернёт запрос?', code: "SELECT user_id FROM orders WHERE status = 'paid'\nUNION\nSELECT user_id FROM orders WHERE status = 'new';",
    o: ['1, 2, 4 (3 строки)', '1, 1, 4, 2, 2 (5 строк)', '2 (1 строку)', '1, 4 (2 строки)'], a: 0, e: 'UNION удаляет дубли. С UNION ALL было бы 5 строк.' },
  { t: 'JOIN', q: 'Что вернёт запрос?', code: 'SELECT id FROM users\nEXCEPT\nSELECT user_id FROM orders;',
    o: ['3, 5', '1, 2, 4', 'Пусто', '1, 2, 3, 4, 5'], a: 0, e: 'id пользователей, которых нет среди user_id заказов, — Вера и Дина.' },
  { t: 'JOIN', q: 'Какого JOIN нет в MySQL?',
    o: ['FULL OUTER JOIN', 'LEFT JOIN', 'CROSS JOIN', 'RIGHT JOIN'], a: 0, e: 'В MySQL FULL JOIN эмулируют через UNION двух LEFT JOIN.' },

  // ---- Подзапросы и окна ----
  { t: 'Подзапросы и окна', q: 'Какие заказы вернёт запрос?', code: 'SELECT id FROM orders\nWHERE amount > (SELECT AVG(amount) FROM orders);',
    o: ['2, 5', '2', '1, 2, 3, 5', '3, 5'], a: 0, e: 'Среднее = 4400 / 6 ≈ 733.33. Больше — 1500 (id 2) и 1200 (id 5).' },
  { t: 'Подзапросы и окна', q: 'Кого вернёт запрос?', code: "SELECT u.name FROM users u\nWHERE EXISTS (\n  SELECT 1 FROM orders o\n  WHERE o.user_id = u.id AND o.status = 'cancelled');",
    o: ['Глеб', 'Глеб, Борис', 'Никого', 'Всех'], a: 0, e: 'Отменённый заказ (id 4) есть только у Глеба.' },
  { t: 'Подзапросы и окна', q: 'В orders появился заказ гостя с user_id = NULL. Что станет с запросом?', code: 'SELECT name FROM users\nWHERE id NOT IN (SELECT user_id FROM orders);',
    o: ['Вернёт 0 строк', 'Вернёт Веру и Дину, как раньше', 'Вернёт всех пользователей', 'Выдаст ошибку'], a: 0, e: 'NULL в списке NOT IN делает условие UNKNOWN для всех строк. NOT EXISTS от этого не страдает.' },
  { t: 'Подзапросы и окна', q: 'Что будет, если скалярный подзапрос вернёт несколько строк?',
    o: ['Ошибка выполнения (в PostgreSQL)', 'Возьмётся первая строка', 'Вернётся NULL', 'Вернётся сумма'], a: 0, e: '«more than one row returned by a subquery». SQLite тихо берёт первую строку — ещё один повод не полагаться на это.' },
  { t: 'Подзапросы и окна', q: 'Что вернёт запрос?', code: 'SELECT AVG(total) FROM (\n  SELECT user_id, SUM(amount) AS total\n  FROM orders GROUP BY user_id\n) t;',
    o: ['≈ 1466.67', '≈ 733.33', '4400', '1500'], a: 0, e: 'Суммы по пользователям: 2000, 900, 1500. Среднее = 4400 / 3.' },
  { t: 'Подзапросы и окна', q: 'Что вернёт рекурсивная CTE?', code: 'WITH RECURSIVE n(x) AS (\n  SELECT 1\n  UNION ALL\n  SELECT x + 1 FROM n WHERE x < 3\n)\nSELECT SUM(x) FROM n;',
    o: ['6', '3', '1', 'Бесконечный цикл'], a: 0, e: 'Генерируются 1, 2, 3 (на x = 3 условие x < 3 ложно). Сумма — 6.' },
  { t: 'Подзапросы и окна', q: 'Что вернёт запрос для заказа id = 1?', code: 'SELECT id, SUM(amount) OVER (PARTITION BY user_id) AS s\nFROM orders WHERE id = 1;',
    o: ['1 | 500', '1 | 2000', '1 | 4400', 'Ошибку'], a: 0, e: 'Окно считается после WHERE: в выборке осталась одна строка, и сумма по окну — 500.' },
  { t: 'Подзапросы и окна', q: 'Что вернёт запрос (заказы Анны: 500 и 1500)?', code: 'SELECT id, SUM(amount) OVER (PARTITION BY user_id) AS s\nFROM orders WHERE user_id = 1 ORDER BY id;',
    o: ['1 | 2000, 2 | 2000', '1 | 500, 2 | 2000', '1 | 2000 (одна строка)', '1 | 500, 2 | 1500'], a: 0, e: 'Оконная функция не схлопывает строки: каждая получает сумму по своему окну.' },
  { t: 'Подзапросы и окна', q: 'Баллы: 100, 90, 90, 80. Какие значения даст RANK() OVER (ORDER BY score DESC)?',
    o: ['1, 2, 2, 4', '1, 2, 2, 3', '1, 2, 3, 4', '1, 1, 2, 3'], a: 0, e: 'RANK даёт равным одно место и пропускает следующие. DENSE_RANK дал бы 1, 2, 2, 3.' },
  { t: 'Подзапросы и окна', q: 'Что вернёт запрос?', code: 'SELECT amount, LAG(amount) OVER (ORDER BY created_at)\nFROM orders ORDER BY created_at LIMIT 2;',
    o: ['500 | NULL, 1500 | 500', '500 | 1500, 1500 | 700', '500 | 0, 1500 | 500', '500 | 500, 1500 | 1500'], a: 0, e: 'LAG берёт значение из предыдущей строки окна. У первой предыдущей нет — NULL.' },
  { t: 'Подзапросы и окна', q: 'Последнее значение running в запросе?', code: 'SELECT SUM(amount) OVER (ORDER BY created_at) AS running\nFROM orders ORDER BY created_at;',
    o: ['4400', '200', '1500', '733.33'], a: 0, e: 'С ORDER BY в окне SUM — накопительный итог; на последней строке он равен общей сумме.' },
  { t: 'Подзапросы и окна', q: 'Почему нельзя написать `WHERE ROW_NUMBER() OVER (...) = 1`?',
    o: ['Оконные функции вычисляются на шаге SELECT, после WHERE', 'ROW_NUMBER нельзя сравнивать с числом', 'Нужно писать HAVING ROW_NUMBER() = 1', 'Можно, это корректный запрос'], a: 0, e: 'Оборачивают в подзапрос или CTE и фильтруют снаружи: WHERE rn = 1.' },

  // ---- Изменение и структура ----
  { t: 'Изменение и структура', q: 'Что произойдёт?', code: "UPDATE orders SET status = 'cancelled';",
    o: ['Будут отменены все 6 заказов', 'Ошибка: нет WHERE', 'Изменится первая строка', 'Ничего, нужен COMMIT'], a: 0, e: 'UPDATE без WHERE меняет всю таблицу. В режиме autocommit — сразу и безвозвратно.' },
  { t: 'Изменение и структура', q: 'Чем TRUNCATE отличается от DELETE без WHERE?',
    o: ['Быстрее, не вызывает триггеры удаления, обычно сбрасывает автоинкремент', 'Удаляет таблицу вместе со структурой', 'Удаляет только строки с NULL', 'Ничем'], a: 0, e: 'TRUNCATE — DDL-операция: очищает таблицу целиком, не перебирая строки. Структура остаётся.' },
  { t: 'Изменение и структура', q: 'Что произойдёт? (orders.user_id — внешний ключ на users.id без CASCADE)', code: 'INSERT INTO orders (user_id, amount, status, created_at)\nVALUES (99, 100, \'new\', \'2026-04-01\');',
    o: ['Ошибка: нарушение внешнего ключа', 'Создастся пользователь 99', 'Заказ вставится с user_id = NULL', 'Вставится без ошибок'], a: 0, e: 'Пользователя 99 нет — FK не даёт создать «сироту». (В SQLite FK проверяются, только если включить PRAGMA foreign_keys = ON.)' },
  { t: 'Изменение и структура', q: 'Чем PRIMARY KEY отличается от UNIQUE?',
    o: ['PK один на таблицу и не допускает NULL; UNIQUE может быть несколько и обычно допускает NULL', 'Ничем, это синонимы', 'UNIQUE быстрее работает', 'PK допускает дубли, если они NULL'], a: 0, e: 'PK — идентификатор строки. UNIQUE — просто запрет повторов.' },
  { t: 'Изменение и структура', q: 'Какое правило FK удалит заказы вместе с пользователем?',
    o: ['ON DELETE CASCADE', 'ON DELETE SET NULL', 'ON DELETE RESTRICT', 'ON UPDATE CASCADE'], a: 0, e: 'SET NULL обнулит ссылку, RESTRICT запретит удаление пользователя, пока есть заказы.' },
  { t: 'Изменение и структура', q: 'Какой тип выбрать для суммы денег?',
    o: ['NUMERIC(12, 2)', 'FLOAT', 'VARCHAR(20)', 'REAL'], a: 0, e: 'FLOAT и REAL — приблизительные: 0.1 + 0.2 ≠ 0.3. Строка не даст считать и сортировать.' },

/* ================= Подсветка Python ================= */
const PY_KW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case'.split(' '));
const PY_BI = new Set('print len range enumerate zip map filter sorted reversed sum min max abs round divmod pow any all isinstance issubclass type int float str bool list tuple dict set frozenset input open ord chr bin hex oct id hash dir help getattr setattr hasattr callable iter next super object property staticmethod classmethod Exception ValueError TypeError KeyError IndexError ZeroDivisionError AttributeError NameError StopIteration RecursionError FileNotFoundError'.split(' '));
const PY_RE = /(#[^\n]*)|((?:\b[rRbBfFuU]{1,2})?(?:"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'))|(@[A-Za-z_][\w.]*)|(\b\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?j?\b)|([A-Za-z_]\w*)/g;

function highlightPy(code) {
  let out = '', last = 0, m, prev = '';
  PY_RE.lastIndex = 0;
  while ((m = PY_RE.exec(code))) {
    out += esc(code.slice(last, m.index));
    last = m.index + m[0].length;
    const t = esc(m[0]);
    if (m[1]) out += `<span class="hl-com">${t}</span>`;
    else if (m[2]) out += `<span class="hl-str">${t}</span>`;
    else if (m[3]) out += `<span class="hl-dec">${t}</span>`;
    else if (m[4]) out += `<span class="hl-num">${t}</span>`;
    else {
      const w = m[0];
      if (prev === 'def' || prev === 'class') out += `<span class="hl-fn">${t}</span>`;
      else if (PY_KW.has(w)) out += `<span class="hl-kw">${t}</span>`;
      else if (w === 'self' || w === 'cls') out += `<span class="hl-self">${t}</span>`;
      else if (PY_BI.has(w) && code[last] === '(') out += `<span class="hl-bi">${t}</span>`;
      else out += t;
      prev = w;
      continue;
    }
    prev = '';
  }
  return out + esc(code.slice(last));
}
function highlightSh(code) {
  return code.split('\n').map(line => {
    const i = line.indexOf('#');
    return i < 0 ? esc(line) : esc(line.slice(0, i)) + `<span class="hl-com">${esc(line.slice(i))}</span>`;
  }).join('\n');
}

/* Универсальная подсветка для других языков (JS, SQL, Java, Go, C#…): комментарии, строки, числа, ключевые слова */
const GEN_KW = new Set(('select from where insert into update delete set values create alter drop table index view join inner left right full outer cross on '
  + 'group order by having limit offset as and or not null is in like between distinct union all exists case when then else end primary foreign key references '
  + 'default unique check begin commit rollback transaction grant revoke with asc desc count sum avg min max '
  + 'function return if for while do switch break continue const let var class new this super extends implements interface public private protected static '
  + 'final void int long double float boolean bool string char true false import export package try catch finally throw throws async await yield typeof instanceof '
  + 'func go defer struct type map range chan select fn mut impl pub use match enum').split(' '));
const GEN_RE = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/|#[^\n]*|--[^\n]*)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`[^`]*`)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/g;
function highlightGeneric(code) {
  let out = '', last = 0, m;
  GEN_RE.lastIndex = 0;
  while ((m = GEN_RE.exec(code))) {
    out += esc(code.slice(last, m.index));
    last = m.index + m[0].length;
    if (m[4]) { out += GEN_KW.has(m[4].toLowerCase()) ? `<span class="hl-kw">${esc(m[4])}</span>` : esc(m[4]); continue; }
    const cls = m[1] ? 'hl-com' : m[2] ? 'hl-str' : 'hl-num';
    out += `<span class="${cls}">${esc(m[0])}</span>`;
  }
  return out + esc(code.slice(last));
}
/* lang: py | sh | plain | любой другой → универсальная подсветка */
function highlight(code, lang) {
  lang = lang || CODE_LANG;
  if (lang === 'py' || lang === 'python') return highlightPy(code);
  if (lang === 'sh' || lang === 'bash' || lang === 'text') return highlightSh(code);
  if (lang === 'plain') return esc(code);
  return highlightGeneric(code);
}

/* Мини-разметка для карточек и теста: `код`, ```lang\nблок``` */
function fmt(text) {
  const parts = String(text).split(/```([A-Za-z]*)\n?([\s\S]*?)```/);
  let html = '';
  for (let i = 0; i < parts.length; i += 3) {
    html += esc(parts[i]).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g, '<br>');
    if (i + 2 < parts.length) html += `<pre class="code">${highlight(parts[i + 2].replace(/\n$/, ''), parts[i + 1] || undefined)}</pre>`;
  }
  return html;
}

function addCopyButtons(root) {

}

const plural = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? many : b > 1 && b < 5 ? few : b === 1 ? one : many; };

/* ================= Подсказки (термины) ================= */
const TERMS = GLOSSARY.map((e, i) => ({ ...e, i }));
const TERM_LOC = TERMS.map(() => []); // где термин встречается: [{cat, topic}]
const TERM_RE = (function () {
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&');
  const sorted = [...TERMS].sort((a, b) => b.k.length - a.k.length);
  const B = 'A-Za-zА-Яа-яЁё0-9_';
  const parts = sorted.map(e => `(?<g${e.i}>${e.re || escRe(e.k)})`);
  return new RegExp(`(?<![${B}])(?:${parts.join('|')})(?![${B}])`, 'g');
})();
const SKIP = 'script, style, abbr, pre, .badge, summary, #tip, input, button, h1, h2, h3.sub, th, .chips, .qz-opt, .copy-btn, .side, .topbar, .card, .res, .term, .letters, .pagehead, .cathead, .setup, .selfcheck, .foot';
const seenByScope = new WeakMap();

function markTerms(root, onMark) {
  if (!TERMS.length) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      if (!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const p = n.parentElement;
      if (p && p.closest(SKIP)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    const text = node.nodeValue;
    TERM_RE.lastIndex = 0;
    if (!TERM_RE.test(text)) return;
    // каждый термин подсвечиваем один раз на блок, чтобы текст не рябил
    const scope = node.parentElement.closest('.section-body, .fc-face, .qz-ex, .mist, .qz-qwrap') || root;
    let seen = seenByScope.get(scope);
    if (!seen) { seen = new Set(); seenByScope.set(scope, seen); }
    TERM_RE.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m, changed = false;
    while ((m = TERM_RE.exec(text))) {
      const gi = Object.keys(m.groups).find(k => m.groups[k] !== undefined);
      const idx = +gi.slice(1);
      if (seen.has(idx)) continue;
      seen.add(idx);
      changed = true;
      if (onMark) onMark(idx);
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const a = document.createElement('abbr');
      a.className = 't'; a.tabIndex = 0; a.dataset.idx = idx; a.textContent = m[0];
      frag.appendChild(a);
      last = m.index + m[0].length;
    }
    if (!changed) return;
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
}

const tip = $('#tip');
let tipFor = null;
function showTip(el) {
  const d = TERMS[+el.dataset.idx];
  if (!d) return;
  tipFor = el;
  tip.innerHTML = `<div class="tip-full"><span class="tip-term">${esc(d.k)}</span> · ${esc(d.t)}</div>`
    + `<div class="tip-why">${esc(d.d)}</div>`
    + (d.ex ? `<pre>${highlight(d.ex, d.lang)}</pre>` : '');
  tip.classList.add('show');
  tip.style.left = tip.style.top = '';
  if (isMob()) return; // на телефоне — шторка снизу (CSS)
  const r = el.getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight, pad = 8;
  const left = Math.max(pad, Math.min(r.left + r.width / 2 - tw / 2, window.innerWidth - tw - pad));
  let top = r.bottom + 8;
  if (top + th > window.innerHeight - pad) top = r.top - th - 8;
  tip.style.left = left + 'px';
  tip.style.top = Math.max(pad, top) + 'px';
}
function hideTip() { tip.classList.remove('show'); tipFor = null; }
const HOVER_MQ = window.matchMedia ? matchMedia('(hover: hover)') : { matches: false };
const canHover = () => HOVER_MQ.matches && !isMob();
document.addEventListener('mouseover', e => { if (!canHover()) return; const a = e.target.closest('abbr.t'); if (a) showTip(a); });
document.addEventListener('mouseout', e => { if (!canHover()) return; const a = e.target.closest('abbr.t'); if (a && !a.contains(e.relatedTarget)) hideTip(); });
document.addEventListener('focusin', e => { if (e.target.matches('abbr.t')) showTip(e.target); });
document.addEventListener('focusout', e => { if (e.target.matches('abbr.t') && !isMob()) hideTip(); });
document.addEventListener('click', e => {
  const a = e.target.closest('abbr.t');

  else if (!e.target.closest('#tip') || isMob()) hideTip();
}, true);

/* ================= Разбор контента: раздел → категория, подраздел → тема ================= */
const RESERVED = new Set(['cards', 'quiz', 'gloss', 'home']);
const CATS = [], catByKey = {}, topicById = {};
(function parse() {
  const src = document.importNode($('#src').content, true);
  const tops = [...src.children].filter(e => e.matches('details.section'));
  const titleOf = sum => { const s = sum.cloneNode(true); s.querySelectorAll('.badge, .chev').forEach(x => x.remove()); return s.textContent.replace(/\s+/g, ' ').trim(); };
  const badgeOf = sum => { const b = sum && sum.querySelector('.badge'); return b ? b.textContent.trim() : ''; };
  const wrapBody = nodes => { const d = document.createElement('div'); d.className = 'section-body'; nodes.forEach(n => d.appendChild(n)); return d; };
  const meaningful = nodes => nodes.some(n => n.nodeType === 1 || (n.nodeType === 3 && n.nodeValue.trim()));

  tops.forEach((d, ci) => {
    const sum = d.querySelector(':scope > summary');
    const body = d.querySelector(':scope > .section-body') || d;
    let key = (d.id || 'r' + (ci + 1)).replace(/^s-/, '');
    if (RESERVED.has(key) || catByKey[key] || key.includes('/')) key = d.id || 'r' + (ci + 1);
    const badge = sum && sum.querySelector('.badge');
    const cat = {
      i: ci, key, title: sum ? titleOf(sum) : 'Раздел ' + (ci + 1),
      icon: d.dataset.icon ? esc(d.dataset.icon) : badge ? badge.outerHTML : '📘',
      desc: d.dataset.desc || '', train: (d.dataset.train || '').split(',').map(s => s.trim()).filter(Boolean),
      intro: null, topics: [], flat: false,
    };
    const kids = [...body.childNodes];
    const nested = kids.filter(n => n.nodeType === 1 && n.matches('details.section'));
    const heads = kids.filter(n => n.nodeType === 1 && n.matches('h3.sub'));
    const addTopic = (t, tag, num, el) => { cat.topics.push({ t, tag, num, el, cat }); };

    if (nested.length) {
      const rest = kids.filter(n => !nested.includes(n));
      if (meaningful(rest)) cat.intro = wrapBody(rest);
      nested.forEach((n, i) => {
        const s = n.querySelector(':scope > summary');
        const b = badgeOf(s);
        const isNum = /^\d+$/.test(b);
        const el = n.querySelector(':scope > .section-body') || wrapBody([...n.childNodes].filter(x => x !== s));
        addTopic(titleOf(s), isNum || b === '✓' ? '' : b, b === '✓' ? '✓' : String(i + 1), el);
      });
    } else if (heads.length >= 2 && d.dataset.split !== 'no') {
      // плоский раздел с подзаголовками h3.sub — делим на темы по подзаголовкам
      const before = kids.slice(0, kids.indexOf(heads[0]));
      if (meaningful(before)) cat.intro = wrapBody(before);
      heads.forEach((h, i) => {
        const end = i + 1 < heads.length ? kids.indexOf(heads[i + 1]) : kids.length;
        const part = kids.slice(kids.indexOf(h) + 1, end);
        addTopic(h.textContent.replace(/\s+/g, ' ').trim(), '', String(i + 1), wrapBody(part));
      });
    } else {
      cat.flat = true;
      addTopic(cat.title, '', '1', body.classList && body.classList.contains('section-body') ? body : wrapBody(kids));
    }
    if (!cat.desc) {
      const p = (cat.intro || cat.topics[0].el).querySelector('p');
      const t = p ? p.textContent.replace(/\s+/g, ' ').trim() : '';
      cat.desc = t.length > 130 ? t.slice(0, 127).replace(/\s+\S*$/, '') + '…' : t;
    }
    cat.topics.forEach((t, i) => { t.i = i; t.id = key + '/' + (i + 1); topicById[t.id] = t; });
    CATS.push(cat); catByKey[key] = cat;
  });

  // подсветка кода, кнопки копирования, термины — один раз при загрузке
  CATS.forEach(c => [c.intro, ...c.topics.map(t => t.el)].forEach((el, k) => {
    if (!el) return;
    $$('pre.py', el).forEach(p => p.innerHTML = highlightPy(p.textContent));
    $$('pre.sh', el).forEach(p => p.innerHTML = highlightSh(p.textContent));
    $$('pre.code', el).forEach(p => p.innerHTML = highlight(p.textContent, p.dataset.lang));
    addCopyButtons(el);
    const topic = k === 0 ? (c.intro ? null : c.topics[0]) : c.topics[k - 1];
    markTerms(el, idx => { const L = TERM_LOC[idx]; if (L.length < 3 && !L.some(x => x.cat === c)) L.push({ cat: c, topic }); });
  }));
})();
const ALL_TOPICS = CATS.flatMap(c => c.topics);
const IDX = ALL_TOPICS.map(t => ({ t, title: t.t.toLowerCase(), text: t.el.textContent.replace(/Копировать/g, '').replace(/\s+/g, ' ') }));
CATS.forEach(c => { if (c.intro) IDX.push({ t: c.topics[0], title: c.title.toLowerCase(), text: c.intro.textContent.replace(/\s+/g, ' '), intro: c }); });
