const saveRead = () => store.set('read', read);
const readCount = c => c.topics.filter(t => read[t.id]).length;
const totalRead = () => ALL_TOPICS.filter(t => read[t.id]).length;

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  $('#themeIcon').textContent = theme === 'dark' ? '☀️' : '🌙';
  const meta = $('meta[name="theme-color"]');
  if (meta) meta.content = theme === 'dark' ? '#181c24' : '#ffffff';
}
applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
$('#themeBtn').addEventListener('click', () => { const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; applyTheme(t); store.set('theme', t); });
$('#fsBtn').addEventListener('click', () => { const v = (+(store.get('fs', 0)) + 1) % 3; store.set('fs', v); document.documentElement.setAttribute('data-fs', v); });
$('#menuBtn').addEventListener('click', () => document.body.classList.toggle('nav-open'));
$('#backdrop').addEventListener('click', () => document.body.classList.remove('nav-open'));
$('#searchBtn').addEventListener('click', () => { const on = document.body.classList.toggle('search-open'); if (on) $('#q').focus(); });
$('#totop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
let ticking = false;
window.addEventListener('scroll', () => {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    const h = document.documentElement.scrollHeight - innerHeight;
    $('#progress').style.width = (h > 0 ? scrollY / h * 100 : 0) + '%';
    $('#totop').style.display = scrollY > 700 ? 'block' : 'none';
    ticking = false;
  });
}, { passive: true });

/* ================= Боковое меню ================= */
let curRoute = { name: 'home' };
function renderSide() {
  const r = curRoute;
  let h = `<a class="mode${r.name === 'home' ? ' active' : ''}" href="#"><span class="ci">🏠</span><span>Главная</span><span class="cnt">${totalRead()}/${ALL_TOPICS.length}</span></a><div class="grp">Разделы</div>`;
  CATS.forEach(c => {
    const act = r.name === 'cat' && r.cat === c;
    h += `<a class="cat${act ? ' active' : ''}" href="#${c.key}"><span class="ci">${c.icon}</span><span>${esc(c.title)}</span><span class="cnt">${readCount(c)}/${c.topics.length}</span></a>`;
    if (act && !c.flat) h += '<div class="sub">' + c.topics.map(t => `<a href="#${t.id}" data-id="${t.id}" class="${read[t.id] ? 'read' : ''}${r.topic === t ? ' active' : ''}">${esc(t.t)}</a>`).join('') + '</div>';
  });
  const tr = (name, ico, label, n) => `<a class="mode${r.name === name ? ' active' : ''}" href="#${name}"><span class="ci">${ico}</span><span>${label}</span><span class="cnt">${n}</span></a>`;
  h += '<div class="grp">Тренировка</div>' + tr('cards', '🃏', 'Карточки', CARDS.length) + tr('quiz', '✅', 'Тест', QUIZ.length) + tr('gloss', '🔤', 'Термины', TERMS.length);
  side.innerHTML = h;
}
side.addEventListener('click', e => { if (e.target.closest('a')) document.body.classList.remove('nav-open'); });

/* ================= Главная ================= */
function home() {
  curRoute = { name: 'home' };
  const last = topicById[store.get('last', '')];
  const known = new Set(store.get('known', []));
  const kc = CARDS.filter(c => known.has(c.c + '|' + c.f)).length;
  const best = store.get('qzBest', null);
  view.innerHTML = `
    <div class="hero"><h1>${esc(CFG.icon || '')} ${esc(CFG.heading || document.title)}</h1><p>${esc(CFG.subtitle || '')}</p>
      ${last ? `<a class="cont" href="#${last.id}">▶ <span>Продолжить: ${esc(last.cat.flat ? last.cat.title : last.cat.title + ' → ' + last.t)}</span></a>` : `<a class="cont" href="#${CATS[0] ? CATS[0].key : ''}">▶ <span>Начать с раздела «${esc(CATS[0] ? CATS[0].title : '')}»</span></a>`}
    </div>
    <div class="grid">${CATS.map(c => { const n = c.topics.length, rc = readCount(c); return `
      <a class="card" href="#${c.key}"><span class="ico">${c.icon}</span><h3>${esc(c.title)}</h3><p>${esc(c.desc)}</p>
        <span class="meta">${c.flat ? (rc ? 'Прочитано ✓' : 'Одна страница') : `${n} ${plural(n, 'тема', 'темы', 'тем')} · прочитано ${rc}`}</span><span class="bar"><i style="width:${rc / n * 100}%"></i></span></a>`; }).join('')}
    </div>
    <h2 class="h2">Тренировка</h2><p class="lead">Закрепить прочитанное: карточки для запоминания, тест с разбором ошибок, словарь терминов.</p>
    <div class="grid train">
      <a class="card" href="#cards"><span class="ico">🃏</span><h3>Карточки</h3><p>${CARDS.length} ${plural(CARDS.length, 'карточка', 'карточки', 'карточек')} · выучено ${kc}</p><span class="bar"><i style="width:${CARDS.length ? kc / CARDS.length * 100 : 0}%"></i></span></a>
      <a class="card" href="#quiz"><span class="ico">✅</span><h3>Тест</h3><p>${QUIZ.length} ${plural(QUIZ.length, 'вопрос', 'вопроса', 'вопросов')}${best ? ` · лучший результат ${best.pct}%` : ''}</p></a>
      <a class="card" href="#gloss"><span class="ico">🔤</span><h3>Термины</h3><p>${TERMS.length} ${plural(TERMS.length, 'термин', 'термина', 'терминов')} с расшифровкой и примерами</p></a>
    </div>`;
}

/* ================= Раздел ================= */
let accordion = store.get('accordion', false);
let pendingTerm = null;
function category(c, n) {
  curRoute = { name: 'cat', cat: c, topic: null };
  const idx = CATS.indexOf(c);
  const next = CATS[idx + 1];
  view.replaceChildren();
  const head = document.createElement('div');
  head.innerHTML = `<a class="back" href="#">← Все разделы</a>
    <div class="cathead"><span class="ico">${c.icon}</span><div><h1>${esc(c.title)}</h1>${c.desc ? `<p>${esc(c.desc)}</p>` : ''}</div></div>
    ${c.flat ? '' : `<div class="toolbar"><button class="ibtn" id="expAll">Развернуть все</button><button class="ibtn" id="colAll">Свернуть все</button>
      <label><input type="checkbox" id="accChk"${accordion ? ' checked' : ''}> по одной</label><span class="pr" id="pr"></span></div>`}`;
  view.appendChild(head);
  if (c.intro) { const box = document.createElement('div'); box.className = 'intro'; box.appendChild(c.intro); view.appendChild(box); }

  const mkFoot = t => {
    const f = document.createElement('div'); f.className = 'foot';
    const nt = c.topics[t.i + 1];
    f.innerHTML = `<button class="ibtn mark${read[t.id] ? ' on' : ''}">${read[t.id] ? '✓ Прочитано' : 'Отметить прочитанным'}</button>`
      + (nt ? `<button class="ibtn next">Следующая тема →</button>` : next ? `<a class="ibtn next" href="#${next.key}">Следующий раздел →</a>` : '');
    $('.mark', f).onclick = () => setRead(t, !read[t.id]);
    const nb = $('button.next', f);
    if (nb) nb.onclick = () => { setRead(t, true); openTopic(nt, true); };
    else if ($('a.next', f)) $('a.next', f).onclick = () => setRead(t, true);
    return f;
  };
  if (c.flat) {
    const t = c.topics[0], box = document.createElement('div');
    box.className = 'flat'; box.dataset.id = t.id;
    box.append(t.el, mkFoot(t)); view.appendChild(box);
    curRoute.topic = t; store.set('last', t.id);
  } else {
    c.topics.forEach(t => {
      const d = document.createElement('details');
      d.className = 'topic' + (read[t.id] ? ' isread' : ''); d.dataset.id = t.id;
      d.innerHTML = `<summary><span class="num">${esc(t.num)}</span><span class="ttl">${esc(t.t)}</span>${t.tag ? `<span class="tag">${esc(t.tag)}</span>` : ''}<span class="done">✓</span><span class="chev"></span></summary>`;
      const wrap = document.createElement('div'); wrap.className = 'tbody';
      wrap.append(t.el, mkFoot(t)); d.appendChild(wrap);
      d.addEventListener('toggle', () => {
        if (!d.open || !d.isConnected || curRoute.cat !== c || !location.hash.startsWith('#' + c.key)) return; // toggle приходит асинхронно — страница могла смениться
        if (accordion) $$('details.topic[open]', view).forEach(x => { if (x !== d) x.open = false; });
        curRoute.topic = t; store.set('last', t.id);
        history.replaceState(null, '', '#' + t.id);
        renderSide();
      });
      view.appendChild(d);
    });
    $('#expAll').onclick = () => $$('details.topic', view).forEach(d => d.open = true);
    $('#colAll').onclick = () => $$('details.topic', view).forEach(d => d.open = false);
    $('#accChk').onchange = e => { accordion = e.target.checked; store.set('accordion', accordion); };
  }

  const cardsN = CARDS.filter(x => c.train.includes(x.c)).length, quizN = QUIZ.filter(q => c.train.includes(q.t)).length;
  const tail = document.createElement('div');
  tail.innerHTML = (cardsN || quizN ? `<div class="selfcheck"><b>Проверить себя по разделу</b>
      ${cardsN ? `<a class="ibtn" href="#cards/${c.key}">🃏 ${cardsN} ${plural(cardsN, 'карточка', 'карточки', 'карточек')}</a>` : ''}
      ${quizN ? `<a class="ibtn" href="#quiz/${c.key}">✅ ${quizN} ${plural(quizN, 'вопрос', 'вопроса', 'вопросов')}</a>` : ''}</div>` : '')
    + (next ? `<div class="catnext"><a class="ibtn" href="#${next.key}">${next.icon && !next.icon.startsWith('<') ? next.icon + ' ' : ''}${esc(next.title)} →</a></div>` : '');
  view.appendChild(tail);
  updPr();

  const t = n && c.topics[+n - 1];
  if (t && !c.flat) openTopic(t, false);
  else window.scrollTo(0, 0);
  if (pendingTerm != null) {
    const host = (t || c.topics[0]).el;
    const a = host.querySelector(`abbr.t[data-idx="${pendingTerm}"]`) || (c.intro && c.intro.querySelector(`abbr.t[data-idx="${pendingTerm}"]`));
    pendingTerm = null;
    if (a) setTimeout(() => { a.scrollIntoView({ block: 'center' }); a.classList.remove('flash'); void a.offsetWidth; a.classList.add('flash'); }, 60);
  }
}
function openTopic(t, smooth) {
  const d = view.querySelector(`details.topic[data-id="${t.id}"]`);
  if (!d) return;
  if (accordion) $$('details.topic[open]', view).forEach(x => { if (x !== d) x.open = false; });
  d.open = true;
  curRoute.topic = t; store.set('last', t.id);
  history.replaceState(null, '', '#' + t.id);
  renderSide();
  requestAnimationFrame(() => d.scrollIntoView({ block: 'start', behavior: smooth ? 'smooth' : 'auto' }));
}
function setRead(t, v) {
  if (v) read[t.id] = 1; else delete read[t.id];
  saveRead();
  const host = view.querySelector(`[data-id="${t.id}"]`);
  if (host) {
    host.classList.toggle('isread', !!v);
    const m = $('.mark', host); if (m) { m.classList.toggle('on', !!v); m.textContent = v ? '✓ Прочитано' : 'Отметить прочитанным'; }
  }
  updPr(); renderSide();
}
function updPr() { const c = curRoute.cat, p = $('#pr'); if (c && p) p.textContent = `Прочитано ${readCount(c)} из ${c.topics.length}`; }

/* ================= Поиск ================= */
const qInput = $('#q');
let searching = false, sTimer;
qInput.addEventListener('input', () => { clearTimeout(sTimer); sTimer = setTimeout(() => doSearch(qInput.value), 150); });
qInput.addEventListener('keydown', e => { if (e.key === 'Escape') { qInput.value = ''; doSearch(''); qInput.blur(); document.body.classList.remove('search-open'); } });
document.addEventListener('keydown', e => { if (e.key === '/' && !e.target.matches('input, textarea')) { e.preventDefault(); if (innerWidth <= 900) document.body.classList.add('search-open'); qInput.focus(); } });
function doSearch(raw) {
  const q = raw.trim().toLowerCase();
  if (q.length < 2) { if (searching) { searching = false; route(); } return; }
  searching = true; hideTip();
  const hits = IDX.map(x => {
    const ti = x.title.indexOf(q), pi = x.text.toLowerCase().indexOf(q);
    return ti < 0 && pi < 0 ? null : { x, score: (ti >= 0 ? 100 : 0) + (pi >= 0 ? 10 : 0), pi };
  }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 60);
  const terms = TERMS.filter(e => (e.k + ' ' + e.t).toLowerCase().includes(q)).slice(0, 12);
  const hl = s => esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`);
  view.innerHTML = `<div class="pagehead"><h1>Поиск: «${esc(raw.trim())}»</h1><p>${hits.length ? `Найдено: ${hits.length}` : ''}</p></div>`
    + (terms.length ? `<div class="termhits">${terms.map(e => `<a class="chip" href="#gloss/${encodeURIComponent(e.k)}">🔤 ${esc(e.k)}</a>`).join('')}</div>` : '')
    + (hits.length ? hits.map(({ x, pi }) => {
      const t = x.t, s = Math.max(0, pi - 70);
      const snip = pi >= 0 ? (s ? '…' : '') + x.text.slice(s, pi + q.length + 110) + '…' : x.text.slice(0, 160) + '…';
      return `<a class="res" href="#${x.intro ? x.intro.key : t.id}"><b>${hl(x.intro ? x.intro.title : t.t)}</b><span class="rc">${x.intro ? 'Введение к разделу' : esc(t.cat.title)}</span><p>${hl(snip)}</p></a>`;
    }).join('') : (terms.length ? '' : '<p class="empty">Ничего не найдено</p>'));
  window.scrollTo(0, 0);
}

/* ================= Карточки ================= */
const Cards = (function () {
  const termCat = e => { const L = TERM_LOC[e.i]; return L.length ? L[0].cat.title : 'Прочее'; };
  const DECKS = {
    cards: CARDS.map(c => ({ c: c.c, f: c.f, b: c.b, id: c.c + '|' + c.f })),
    terms: TERMS.map(e => ({ c: termCat(e), f: e.k, b: e.t + '\n\n' + e.d + (e.ex ? '\n```' + (e.lang || '') + '\n' + e.ex + '\n```' : ''), id: 'T|' + e.k })),
  };
  let known = new Set(store.get('known', [])), again = new Set(store.get('again', []));
  const saveMarks = () => { store.set('known', [...known]); store.set('again', [...again]); };
  let S = Object.assign({ src: 'cards', cats: [], count: 20, filter: 'all', order: 'shuffle', rev: false }, store.get('fcSet', {}));
  const saveS = () => store.set('fcSet', S);
  let sess = null, flipped = false;

  const catsOf = src => [...new Set(DECKS[src].map(x => x.c))];
  const selCats = () => { const all = catsOf(S.src); const s = S.cats.filter(c => all.includes(c)); return s.length ? s : all; };
  const pool = () => { const cs = selCats(); return DECKS[S.src].filter(x => cs.includes(x.c) && (S.filter === 'all' || (S.filter === 'new' ? !known.has(x.id) : again.has(x.id)))); };

  function show(key) {
    curRoute = { name: 'cards' };
    if (key === 'terms') { S.src = 'terms'; S.cats = []; saveS(); }
    else if (key && catByKey[key]) {
      const c = catByKey[key];
      const want = c.train.filter(x => catsOf('cards').includes(x));
      S.src = 'cards'; S.cats = want.length ? want : []; S.filter = 'all'; saveS();
    }
    setup(); window.scrollTo(0, 0);
  }

  function setup() {
    sess = null;
    const deck = DECKS[S.src], all = catsOf(S.src), cs = selCats();
    const inSel = deck.filter(x => cs.includes(x.c));
    const p = pool(), n = S.count ? Math.min(S.count, p.length) : p.length;
    const chip = (label, on, attr, cnt) => `<button class="chip${on ? ' on' : ''}" ${attr}>${esc(label)}${cnt != null ? `<span class="n">${cnt}</span>` : ''}</button>`;
    const allOn = cs.length === all.length;
    view.innerHTML = `
      <div class="pagehead"><h1>🃏 Карточки</h1><p>Выбери колоду, темы и сколько карточек прогнать. Отметки «знаю» и «повторить» сохраняются в браузере.</p></div>
      <div class="stats3"><div><b>${deck.length}</b>в колоде</div><div><b>${deck.filter(x => known.has(x.id)).length}</b>знаю</div><div><b>${deck.filter(x => again.has(x.id)).length}</b>повторить</div></div>
      <div class="panel setup">
        <div class="row"><h3>Колода</h3><div class="chips">${chip('Карточки', S.src === 'cards', 'data-src="cards"', DECKS.cards.length)}${chip('Термины', S.src === 'terms', 'data-src="terms"', DECKS.terms.length)}</div></div>
        <div class="row"><h3>Темы</h3><div class="chips">${chip('Все', allOn, 'data-cat=""', deck.length)}${all.map(c => chip(c, !allOn && cs.includes(c), `data-cat="${esc(c)}"`, deck.filter(x => x.c === c).length)).join('')}</div></div>
        <div class="row"><h3>Сколько</h3><div class="chips">${[10, 20, 30, 0].map(v => chip(v ? String(v) : 'Все', S.count === v, `data-count="${v}"`)).join('')}
          <input class="num-in" id="fcNum" type="number" min="1" max="999" placeholder="своё" value="${[10, 20, 30, 0].includes(S.count) ? '' : S.count}"></div></div>
        <div class="row"><h3>Какие</h3><div class="chips">${chip('Все', S.filter === 'all', 'data-filter="all"', inSel.length)}${chip('Не выученные', S.filter === 'new', 'data-filter="new"', inSel.filter(x => !known.has(x.id)).length)}${chip('Отмеченные «повторить»', S.filter === 'again', 'data-filter="again"', inSel.filter(x => again.has(x.id)).length)}</div></div>
        <div class="row"><h3>Порядок</h3><div class="chips">${chip('🔀 Перемешать', S.order === 'shuffle', 'data-order="shuffle"')}${chip('По порядку', S.order === 'seq', 'data-order="seq"')}${chip('⇄ Сначала ответ', S.rev, 'data-rev="1"')}</div></div>
        <div class="summary"><button class="btn primary" id="fcStart"${n ? '' : ' disabled'}>Начать · ${n} ${plural(n, 'карточка', 'карточки', 'карточек')}</button>
          <span class="info">${n ? `из ${p.length} подходящих` : 'Нет карточек под эти условия'}</span>
          <button class="btn" id="fcReset" style="margin-left:auto">Сбросить отметки</button></div>
      </div>`;
    $$('[data-src]', view).forEach(b => b.onclick = () => { S.src = b.dataset.src; S.cats = []; saveS(); setup(); });
    $$('[data-cat]', view).forEach(b => b.onclick = () => {
      const c = b.dataset.cat;
      if (!c) S.cats = [];
      else { let s = allOn ? [] : selCats().slice(); s = s.includes(c) ? s.filter(x => x !== c) : [...s, c]; S.cats = s.length === all.length ? [] : s; }
      saveS(); setup();
    });
    $$('[data-count]', view).forEach(b => b.onclick = () => { S.count = +b.dataset.count; saveS(); setup(); });
    $('#fcNum').onchange = e => { const v = Math.max(0, Math.floor(+e.target.value || 0)); S.count = v; saveS(); setup(); };
    $$('[data-filter]', view).forEach(b => b.onclick = () => { S.filter = b.dataset.filter; saveS(); setup(); });
    $$('[data-order]', view).forEach(b => b.onclick = () => { S.order = b.dataset.order; saveS(); setup(); });
    $('[data-rev]', view).onclick = () => { S.rev = !S.rev; saveS(); setup(); };
    $('#fcStart').onclick = () => start(S.order === 'shuffle' ? shuffle(p).slice(0, n) : p.slice(0, n));
    $('#fcReset').onclick = () => {
      if (!confirm('Сбросить отметки «знаю» и «повторить» для этой колоды?')) return;
      deck.forEach(x => { known.delete(x.id); again.delete(x.id); }); saveMarks(); setup();
    };
  }

  function start(list) { sess = { list, pos: 0, res: new Array(list.length) }; flipped = false; render(); window.scrollTo(0, 0); }

  function render(animIn) {
    const { list, pos, res } = sess, c = list[pos];
    const ok = res.filter(x => x === true).length, bad = res.filter(x => x === false).length, done = ok + bad;
    const front = S.rev ? c.b : c.f, back = S.rev ? c.f : c.b;
    const mark = known.has(c.id) ? '<span class="known-mark">✓ знаю</span>' : again.has(c.id) ? '<span class="again-mark">↻ повторить</span>' : '';
    view.innerHTML = `
      <div class="sesshead"><span>Карточка ${pos + 1} из ${list.length}</span><span class="sc"><span class="yes">✓ ${ok}</span> &nbsp; <span class="no">✕ ${bad}</span></span></div>
      <div class="sbar"><i style="width:${done / list.length * 100}%"></i></div>
      <div class="fc-stage" id="fcStage"><div class="fc-drag" id="fcDrag">
        <div class="fc-swipe l">ПОВТОРИТЬ</div><div class="fc-swipe r">ЗНАЮ</div>
        <div class="fc-card${flipped ? ' flipped' : ''}" id="fcCard" tabindex="0" role="button" aria-label="Перевернуть карточку">
          <div class="fc-face fc-front"><div class="fc-cat"><span>${esc(c.c)}</span>${mark}</div><div class="fc-text"><div>${fmt(front)}</div></div>
            <div class="fc-hint">${isMob() ? 'Нажми, чтобы увидеть ответ · свайп ← → для оценки' : 'Клик или пробел — перевернуть'}</div></div>
          <div class="fc-face fc-back"><div class="fc-cat"><span>${S.rev ? 'Вопрос' : 'Ответ'}</span>${mark}</div><div class="fc-text"><div>${fmt(back)}</div></div>
            <div class="fc-hint">Знаешь? → свайп вправо или «Знаю»</div></div>
        </div></div></div>
      <div class="fc-actions">
        <button class="btn fc-prev" id="fcPrev"${pos === 0 ? ' disabled' : ''}>← Назад</button>
        <button class="btn bad fc-again" id="fcAgain">✕ Повторить</button>
        <button class="btn good fc-know" id="fcKnow">✓ Знаю</button>
        <button class="btn fc-end" id="fcEnd">Завершить</button>
      </div>
      <p class="kbd-hint"><kbd>Пробел</kbd> перевернуть · <kbd>←</kbd> <kbd>→</kbd> листать · <kbd>1</kbd> повторить · <kbd>2</kbd> знаю · <kbd>Esc</kbd> завершить</p>`;
    markTerms($('#fcCard'));
    if (animIn) {
      const drag = $('#fcDrag');
      drag.style.transform = `translateX(${animIn * 40}px)`; drag.style.opacity = '0';
      requestAnimationFrame(() => { drag.style.transition = 'transform .22s ease, opacity .22s ease'; drag.style.transform = ''; drag.style.opacity = ''; });
    }
    $('#fcPrev').onclick = () => go(-1);
    $('#fcAgain').onclick = () => rate(false);
    $('#fcKnow').onclick = () => rate(true);
    $('#fcEnd').onclick = summary;
    $('#fcCard').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); flip(); } });
    if (!isMob()) $('#fcCard').focus({ preventScroll: true });
    bindSwipe();
  }
  function flip() { flipped = !flipped; const c = $('#fcCard'); if (c) c.classList.toggle('flipped', flipped); }
  function go(d) { const np = sess.pos + d; if (np < 0 || np >= sess.list.length) return; sess.pos = np; flipped = false; render(d); }
  function rate(ok, fromSwipe) {
    const c = sess.list[sess.pos];
    sess.res[sess.pos] = ok;
    if (ok) { known.add(c.id); again.delete(c.id); } else { again.add(c.id); known.delete(c.id); }
    saveMarks();
    flipped = false;
    const done = () => { if (sess.pos < sess.list.length - 1) { sess.pos++; render(1); } else summary(); };
    if (fromSwipe) return done();
    const drag = $('#fcDrag');
    drag.style.transition = 'transform .2s ease, opacity .2s ease';
    drag.style.transform = `translateX(${ok ? 60 : -60}px) rotate(${ok ? 4 : -4}deg)`; drag.style.opacity = '0';
    setTimeout(done, 180);
  }
  function summary() {
    const { list, res } = sess;
    const ok = list.filter((_, i) => res[i] === true), bad = list.filter((_, i) => res[i] === false), skip = list.length - ok.length - bad.length;
    const pct = list.length ? Math.round(ok.length / list.length * 100) : 0;
    sess = null;
    view.innerHTML = `
      <div class="panel">
        <div class="score"><div class="big" style="color:${pct >= 70 ? 'var(--ok)' : pct >= 40 ? 'var(--orange)' : 'var(--bad)'}">${ok.length} / ${list.length}</div>
          <div class="msg">знаю ${ok.length} · повторить ${bad.length}${skip ? ` · пропущено ${skip}` : ''}</div></div>
        <div class="center-actions">
          ${bad.length ? `<button class="btn primary" id="fcBad">↻ Прогнать «повторить» (${bad.length})</button>` : ''}
          <button class="btn${bad.length ? '' : ' primary'}" id="fcMore">Ещё раз с теми же настройками</button>
          <button class="btn" id="fcSet">Настройки</button>
          <a class="btn" href="#quiz">✅ Пройти тест</a>
        </div>
        ${bad.length ? `<div class="mistakes"><h3>На повторение</h3>${bad.map(c => `<div class="mist"><b>${fmt(S.rev ? c.b : c.f)}</b><div style="margin-top:6px">${fmt(S.rev ? c.f : c.b)}</div></div>`).join('')}</div>` : ''}
      </div>`;
    $$('.mist', view).forEach(el => markTerms(el));
    if (bad.length) $('#fcBad').onclick = () => start(shuffle(bad));
    $('#fcMore').onclick = () => { const p = pool(), n = S.count ? Math.min(S.count, p.length) : p.length; if (n) start(S.order === 'shuffle' ? shuffle(p).slice(0, n) : p.slice(0, n)); else setup(); };
    $('#fcSet').onclick = setup;
    window.scrollTo(0, 0);
  }
  function bindSwipe() {
    const stage = $('#fcStage'), drag = $('#fcDrag'), card = $('#fcCard');
    const lblL = $('.fc-swipe.l', stage), lblR = $('.fc-swipe.r', stage);
    let sx = 0, sy = 0, dx = 0, active = false, moved = false, pid = null;
    stage.addEventListener('pointerdown', e => {
      if (e.button !== 0 || e.target.closest('abbr.t, .copy-btn, pre')) return;
      active = true; moved = false; sx = e.clientX; sy = e.clientY; dx = 0; pid = e.pointerId;
      drag.style.transition = 'none';
    });
    stage.addEventListener('pointermove', e => {
      if (!active || e.pointerId !== pid) return;
      dx = e.clientX - sx;
      const dy = e.clientY - sy;
      if (!moved && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { moved = true; try { stage.setPointerCapture(pid); } catch (_) {} }
      if (!moved) return;
      drag.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
      lblR.style.opacity = Math.max(0, Math.min(1, dx / 90));
      lblL.style.opacity = Math.max(0, Math.min(1, -dx / 90));
    });
    const end = e => {
      if (!active || (e && e.pointerId !== pid)) return;
      active = false;
      if (!moved) { if (e && e.type === 'pointerup' && !e.target.closest('abbr.t, .copy-btn')) flip(); return; }
      if (Math.abs(dx) > 90) {
        const ok = dx > 0;
        drag.style.transition = 'transform .22s ease, opacity .22s ease';
        drag.style.transform = `translateX(${ok ? 140 : -140}%) rotate(${ok ? 18 : -18}deg)`;
        drag.style.opacity = '0';
        setTimeout(() => rate(ok, true), 200);
      } else {
        drag.style.transition = 'transform .25s cubic-bezier(.2,.8,.3,1.2)';
        drag.style.transform = '';
        lblL.style.opacity = lblR.style.opacity = 0;
      }
    };
    stage.addEventListener('pointerup', end);
    stage.addEventListener('pointercancel', e => { moved = true; dx = 0; end(e); });
    card.addEventListener('click', e => { if (!e.target.closest('abbr.t')) e.preventDefault(); });
  }
  document.addEventListener('keydown', e => {
    if (curRoute.name !== 'cards' || !sess || searching || e.target.matches('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === ' ' || e.key === 'Enter') { if (e.target.closest('button') && e.target.id !== 'fcCard') return; e.preventDefault(); flip(); }
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === '1') rate(false);
    else if (e.key === '2') rate(true);
    else if (e.key === 'Escape') summary();
  });
  window.addEventListener('layoutchange', () => { if (curRoute.name === 'cards' && sess) render(); });
  return { show };
})();

/* ================= Тест ================= */
const Quiz = (function () {
  const qid = q => q.t + '|' + q.q + '|' + (q.code || '');
  let wrong = new Set(store.get('qzWrong', []));
  const saveWrong = () => store.set('qzWrong', [...wrong]);
  let sel = store.get('qzTopics', []).filter(t => QUIZ_TOPICS.includes(t));
  let count = store.get('qzCount', 20), onlyWrong = false;
  const save = () => { store.set('qzTopics', sel); store.set('qzCount', count); };
  const selTopics = () => sel.length ? sel : QUIZ_TOPICS;
  const pool = () => QUIZ.filter(q => selTopics().includes(q.t) && (!onlyWrong || wrong.has(qid(q))));
  const LETTERS = ['1', '2', '3', '4', '5', '6'];
  const looksLikeCode = (s, q) => !!q.code || /[\[\]{}()'"=<>_.]|^-?\d/.test(s);
  let run = null;

  function show(key) {
    curRoute = { name: 'quiz' };
    if (key && catByKey[key]) { const want = catByKey[key].train.filter(t => QUIZ_TOPICS.includes(t)); sel = want; onlyWrong = false; save(); }
    setup(); window.scrollTo(0, 0);
  }
  function setup() {
    run = null;
    const p = pool(), n = count ? Math.min(count, p.length) : p.length;
    const best = store.get('qzBest', null), hist = store.get('qzHist', []);
    const allOn = !sel.length || sel.length === QUIZ_TOPICS.length;
    const chip = (label, on, attr, cnt) => `<button class="chip${on ? ' on' : ''}" ${attr}>${esc(label)}${cnt != null ? `<span class="n">${cnt}</span>` : ''}</button>`;
    const inSel = QUIZ.filter(q => selTopics().includes(q.t));
    view.innerHTML = `
      <div class="pagehead"><h1>✅ Тест</h1><p>Выбери темы и количество вопросов. После каждого ответа — объяснение, в конце — разбор ошибок.</p></div>
      <div class="stats3"><div><b>${QUIZ.length}</b>вопросов</div><div><b>${best ? best.pct + '%' : '—'}</b>лучший результат</div><div><b>${wrong.size}</b>ошибок в прошлых попытках</div></div>
      <div class="panel setup">
        <div class="row"><h3>Темы</h3><div class="chips">${chip('Все', allOn, 'data-t=""', QUIZ.length)}${QUIZ_TOPICS.map(t => chip(t, !allOn && sel.includes(t), `data-t="${esc(t)}"`, QUIZ.filter(q => q.t === t).length)).join('')}</div></div>
        <div class="row"><h3>Сколько</h3><div class="chips">${[10, 20, 30, 0].map(v => chip(v ? String(v) : 'Все', count === v, `data-count="${v}"`)).join('')}
          <input class="num-in" id="qzNum" type="number" min="1" max="999" placeholder="своё" value="${[10, 20, 30, 0].includes(count) ? '' : count}"></div></div>
        <div class="row"><h3>Какие</h3><div class="chips">${chip('Все', !onlyWrong, 'data-w="0"', inSel.length)}${chip('Только мои ошибки', onlyWrong, 'data-w="1"', inSel.filter(q => wrong.has(qid(q))).length)}</div></div>
        <div class="summary"><button class="btn primary" id="qzStart"${n ? '' : ' disabled'}>Начать · ${n} ${plural(n, 'вопрос', 'вопроса', 'вопросов')}</button>
          <span class="info">${n ? `из ${p.length} подходящих` : 'Нет вопросов под эти условия'}${hist.length ? ` · последние: ${hist.map(h => h.pct + '%').join(' · ')}` : ''}</span></div>
      </div>`;
    $$('[data-t]', view).forEach(b => b.onclick = () => {
      const t = b.dataset.t;
      if (!t) sel = [];
      else { let s = allOn ? [] : sel.slice(); s = s.includes(t) ? s.filter(x => x !== t) : [...s, t]; sel = s.length === QUIZ_TOPICS.length ? [] : s; }
      save(); setup();
    });
    $$('[data-count]', view).forEach(b => b.onclick = () => { count = +b.dataset.count; save(); setup(); });
    $('#qzNum').onchange = e => { count = Math.max(0, Math.floor(+e.target.value || 0)); save(); setup(); };
    $$('[data-w]', view).forEach(b => b.onclick = () => { onlyWrong = b.dataset.w === '1'; setup(); });
    $('#qzStart').onclick = () => start(shuffle(p).slice(0, n));
  }
  function start(list) {
    run = { list: list.map(q => ({ q, order: shuffle(q.o.map((_, i) => i)) })), i: 0, answers: [] };
    question(); window.scrollTo(0, 0);
  }
  function question() {
    const { list, i, answers } = run, { q, order } = list[i];
    const ok = answers.filter(a => a.ok).length, bad = answers.length - ok;
    view.innerHTML = `
      <div class="panel">
        <div class="sesshead"><span>Вопрос ${i + 1} из ${list.length}</span><span class="sc"><span class="yes">✓ ${ok}</span> &nbsp; <span class="no">✕ ${bad}</span></span></div>
        <div class="sbar"><i style="width:${i / list.length * 100}%"></i></div>
        <div class="qz-qwrap"><span class="qz-topic">${esc(q.t)}</span><p class="qz-q">${fmt(q.q)}</p>${q.code ? `<pre class="code">${highlight(q.code, q.lang)}</pre>` : ''}</div>
        <div class="qz-opts">${order.map((oi, k) => `<button class="qz-opt" data-oi="${oi}"><span class="k">${LETTERS[k]}</span><span class="v${looksLikeCode(q.o[oi], q) ? '' : ' plain'}">${esc(q.o[oi])}</span></button>`).join('')}</div>
        <div id="qzEx"></div>
        <div class="qz-nav"><button class="btn" id="qzQuit">Завершить</button><button class="btn primary" id="qzNext" hidden>${i === list.length - 1 ? 'Результат' : 'Далее →'}</button></div>
      </div>`;
    markTerms($('.qz-qwrap', view));
    $$('.qz-opt', view).forEach(b => b.onclick = () => answer(+b.dataset.oi));
    $('#qzNext').onclick = next;
    $('#qzQuit').onclick = () => { if (!run.answers.length) return setup(); if (confirm('Завершить тест и посмотреть результат?')) result(); };
  }
  function answer(oi) {
    if (run.answers.length > run.i) return;
    const { q } = run.list[run.i], ok = oi === q.a;
    run.answers.push({ chosen: oi, ok });
    ok ? wrong.delete(qid(q)) : wrong.add(qid(q)); saveWrong();
    $$('.qz-opt', view).forEach(b => {
      const v = +b.dataset.oi; b.disabled = true;
      b.classList.add(v === q.a ? 'correct' : v === oi ? 'wrong' : 'dim');
    });
    const ex = $('#qzEx');
    ex.innerHTML = `<div class="qz-ex${ok ? '' : ' bad'}"><b>${ok ? '✓ Верно!' : '✕ Неверно. Правильно: ' + esc(q.o[q.a])}</b>${fmt(q.e)}</div>`;
    markTerms(ex);
    const nb = $('#qzNext'); nb.hidden = false; nb.focus({ preventScroll: true });
    if (isMob()) ex.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function next() {
    if (run.answers.length <= run.i) return;
    if (run.i < run.list.length - 1) { run.i++; question(); window.scrollTo({ top: 0 }); } else result();
  }
  function result() {
    const done = run.list.slice(0, run.answers.length);
    const n = done.length, ok = run.answers.filter(a => a.ok).length, pct = n ? Math.round(ok / n * 100) : 0;
    const msg = pct >= 90 ? '🏆 Отлично! Тема усвоена.' : pct >= 70 ? '👍 Хорошо! Повтори темы с ошибками.' : pct >= 50 ? '📚 Неплохо, но стоит пройтись по карточкам.' : '🔁 Вернись к справочнику и карточкам, потом попробуй снова.';
    const best = store.get('qzBest', null);
    if (n >= 5 && (!best || pct > best.pct)) store.set('qzBest', { pct, ok, n, date: new Date().toLocaleDateString('ru-RU') });
    store.set('qzHist', [{ pct }, ...store.get('qzHist', [])].slice(0, 5));
    const byTopic = {};
    done.forEach((it, k) => { const t = it.q.t; byTopic[t] = byTopic[t] || { ok: 0, n: 0 }; byTopic[t].n++; if (run.answers[k].ok) byTopic[t].ok++; });
    const mistakes = done.map((it, k) => ({ ...it, ans: run.answers[k] })).filter(x => !x.ans.ok);
    const linkFor = t => { const c = CATS.find(c => c.train.includes(t)); return c ? ` <a href="#${c.key}" title="Открыть раздел">📘</a>` : ''; };
    view.innerHTML = `
      <div class="panel">
        <div class="score"><div class="big" style="color:${pct >= 70 ? 'var(--ok)' : pct >= 50 ? 'var(--orange)' : 'var(--bad)'}">${pct}%</div><div>${ok} из ${n} правильно</div><div class="msg">${msg}</div></div>
        <div class="bytopic">${Object.entries(byTopic).map(([t, s]) => `<div class="r"><span>${esc(t)}${linkFor(t)}</span><div class="bar"><i style="width:${s.ok / s.n * 100}%"></i></div><span>${s.ok}/${s.n}</span></div>`).join('')}</div>
        <div class="center-actions">
          ${mistakes.length ? `<button class="btn primary" id="qzRetry">Повторить ошибки (${mistakes.length})</button>` : ''}
          <button class="btn${mistakes.length ? '' : ' primary'}" id="qzAgain">Новый тест</button>
          <a class="btn" href="#cards">🃏 Карточки</a>
        </div>
        ${mistakes.length ? `<div class="mistakes"><h3>Разбор ошибок</h3>${mistakes.map(m => `
          <div class="mist"><b>${fmt(m.q.q)}</b>${m.q.code ? `<pre class="code">${highlight(m.q.code, m.q.lang)}</pre>` : '<br>'}
            <span class="your">Твой ответ: ${esc(m.q.o[m.ans.chosen])}</span><br><span class="right">Правильно: ${esc(m.q.o[m.q.a])}</span><br>${fmt(m.q.e)}</div>`).join('')}</div>` : ''}
      </div>`;
    $$('.mist', view).forEach(el => markTerms(el));
    if (mistakes.length) $('#qzRetry').onclick = () => start(shuffle(mistakes.map(m => m.q)));
    $('#qzAgain').onclick = setup;
    run = null;
    window.scrollTo({ top: 0 });
  }
  document.addEventListener('keydown', e => {
    if (curRoute.name !== 'quiz' || !run || searching || e.target.matches('input') || e.metaKey || e.ctrlKey) return;
    const k = LETTERS.indexOf(e.key);
    if (k >= 0) { const b = $$('.qz-opt', view)[k]; if (b && !b.disabled) b.click(); }
    else if (e.key === 'Enter' && $('#qzNext') && !$('#qzNext').hidden) { e.preventDefault(); next(); }
  });
  return { show };
})();

/* ================= Термины ================= */
const Gloss = (function () {
  let cat = '';
  const catOf = e => TERM_LOC[e.i].length ? TERM_LOC[e.i][0].cat.key : '';
  const sorted = [...TERMS].sort((a, b) => a.k.localeCompare(b.k, 'ru', { sensitivity: 'base' }));
  const letterOf = e => { const ch = e.k.trim()[0].toUpperCase(); return /[A-ZА-ЯЁ]/.test(ch) ? ch : '#'; };
  function show(q) {
    curRoute = { name: 'gloss' };
    const used = CATS.filter(c => TERMS.some(e => catOf(e) === c.key));
    view.innerHTML = `
      <div class="pagehead"><h1>🔤 Термины</h1><p>${TERMS.length} ${plural(TERMS.length, 'термин', 'термина', 'терминов')}. В тексте они подчёркнуты пунктиром — наведи мышь или нажми, чтобы увидеть подсказку.</p></div>
      <div class="center-actions" style="justify-content:flex-start;margin:0 0 14px"><a class="btn" href="#cards/terms">🃏 Учить термины карточками</a></div>
      <input class="gsearch" id="gq" type="search" placeholder="${esc(CFG.glossPlaceholder || 'Поиск термина…')}" value="${esc(q || '')}">
      <div class="chips hscroll" style="margin-bottom:12px">${[['', 'Все разделы'], ...used.map(c => [c.key, c.title])].map(([k, t]) => `<button class="chip${cat === k ? ' on' : ''}" data-c="${esc(k)}">${esc(t)}</button>`).join('')}</div>
      <div class="letters" id="gLetters"></div><div id="gList"></div>`;
    $('#gq').addEventListener('input', list);
    $$('[data-c]', view).forEach(b => b.onclick = () => { cat = b.dataset.c; $$('[data-c]', view).forEach(x => x.classList.toggle('on', x === b)); list(); });
    list();
    window.scrollTo(0, 0);
  }
  function list() {
    const q = $('#gq').value.trim().toLowerCase();
    const items = sorted.filter(e => (!cat || catOf(e) === cat) && (!q || (e.k + ' ' + e.t + ' ' + e.d).toLowerCase().includes(q)));
    const groups = {};
    items.forEach(e => (groups[letterOf(e)] = groups[letterOf(e)] || []).push(e));
    const letters = Object.keys(groups);
    $('#gLetters').innerHTML = letters.length > 3 ? letters.map(l => `<a href="#" data-l="${l}">${l}</a>`).join('') : '';
    $$('#gLetters a').forEach(a => a.onclick = e => { e.preventDefault(); const t = $('#gl-' + CSS.escape(a.dataset.l)); if (t) t.scrollIntoView({ behavior: 'smooth' }); });
    $('#gList').innerHTML = items.length ? letters.map(l => `<div class="gl-letter" id="gl-${l}">${l}</div>` + groups[l].map(e => `
      <div class="term"><div class="th"><span class="k">${esc(e.k)}</span><span class="tt">${esc(e.t)}</span></div>
        <p class="d">${esc(e.d)}</p>${e.ex ? `<pre>${highlight(e.ex, e.lang)}</pre>` : ''}
        ${TERM_LOC[e.i].length ? `<div class="where">в тексте: ${TERM_LOC[e.i].map(L => `<a href="#" data-term="${e.i}" data-topic="${L.topic ? L.topic.id : L.cat.key}">${esc(L.cat.title)}${L.topic && !L.cat.flat ? ' → ' + esc(L.topic.t) : ''}</a>`).join('')}</div>` : ''}
      </div>`).join('')).join('') : '<p class="empty">Ничего не найдено</p>';
    $$('[data-term]', view).forEach(a => a.onclick = e => { e.preventDefault(); pendingTerm = +a.dataset.term; location.hash = a.dataset.topic; });
  }
  return { show };
})();

/* ================= Маршруты ================= */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const i = h.indexOf('/'), a = i < 0 ? h : h.slice(0, i), b = i < 0 ? '' : h.slice(i + 1);
  hideTip();
  if (a === 'cards') Cards.show(b);
  else if (a === 'quiz') Quiz.show(b);
  else if (a === 'gloss') Gloss.show(b);
  else if (catByKey[a]) category(catByKey[a], b);
  else { home(); window.scrollTo(0, 0); }
  renderSide();
}
window.addEventListener('hashchange', () => {
  if (searching) { searching = false; qInput.value = ''; document.body.classList.remove('search-open'); }
  document.body.classList.remove('nav-open');
  route();
});
// клик по ссылке на текущий адрес (hashchange не сработает) — всё равно перерисовать
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a || e.defaultPrevented) return;
  const href = a.getAttribute('href');
  if ((href === '#' ? '' : href) === location.hash || (href === '#' && !location.hash)) {
    e.preventDefault();
    if (searching) { searching = false; qInput.value = ''; document.body.classList.remove('search-open'); }
    document.body.classList.remove('nav-open');
    route();
  }
});
window.addEventListener('layoutchange', renderSide);
route();
requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.add('ready')));

</script>
</body>
